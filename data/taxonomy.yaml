  name_zh: 急重症分流與照護協調 AI
  name_full: Time-critical single-vendor imaging AI (stroke LVO/ICH, PE, aneurysm) with mobile notification and care-team activation
  scope_en: 'Vertical, time-critical AI: a single vendor''s own deep algorithm portfolio (stroke LVO/ICH, ASPECTS, perfusion, pulmonary embolism, aneurysm) bundled with mobile notification and care-team activation, deployed as a low-latency on-prem/edge inference appliance near the modality (RapidAI/Brainomix/Avicenna offer on-prem; Viz.ai is cloud-led). Distinct clinical buyer (stroke/neuro/service-line, not just radiology) and distinct economics (reimbursement/door-to-needle, not the horizontal marketplace).'
  scope_zh: 垂直、時效關鍵的 AI：單一廠商自有深度演算法組合（中風大血管阻塞／腦出血、ASPECTS、灌流、肺栓塞、動脈瘤）搭配行動推播與照護團隊啟動，於病灶模態旁以低延遲地端／邊緣推論設備部署（RapidAI／Brainomix／Avicenna 提供地端；Viz.ai 以雲端為主）。臨床買方不同（中風／神經科／服務線，非僅放射科），經濟模型亦不同（給付／到針時間，而非水平市集）。
