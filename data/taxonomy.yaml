  scope_en: Trained NNP/MLIP models (equivariant GNNs, foundation atomistic models) that deliver near-DFT accuracy at MD speed; the segment's flagship spend is GPU-heavy TRAINING on large ab-initio datasets, then GPU inference-time dynamics. Distinct buyer motion (AI/ML + comp-chem) and a training-cluster hardware pull that neither classical MD nor FEP requires. Still an emerging commercial base (confidence B), but the strongest net-new GPU training opportunity in the MD/FEP family.
