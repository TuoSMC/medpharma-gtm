- id: serialization-track-trace-national-verification-hub-pod-verify-registry
  parent: serialization-track-trace-national-verification-hub
  name_en: Point-of-Dispense Verification Registry (verify-only sovereign hub)
  name_zh: 配藥點驗證登記樞紐（僅驗證型國家系統）
  name_full: National Point-of-Dispense Medicines Verification System (EMVS/NMVS verify-only blueprint hub)
  scope_en: 'EU/EEA-style national medicines verification systems (EMVS/NMVS) where a central information router plus a national repository authenticate each serialized pack in near-real-time at the point of dispense (pharmacy/hospital) and mark it dispensed, WITHOUT persisting full change-of-ownership pedigree. Built on the two EMVO-endorsed blueprints (Solidsoft Reply, Arvato Systems). The dominant engineering constraint is continuous uptime and low-latency lookup because dispensing cannot stop, so the footprint is high-availability + geo-redundant DR + fast NVMe rather than bulk storage. SMCI caveat: the dominant Solidsoft blueprint is hosted on Microsoft Azure (hyperscaler, out of SMCI scope); the SMCI-relevant footprint is limited to the minority of sovereign / data-residency-driven on-prem NMVS deployments, so the true hardware pull is modest.'
  scope_zh: 歐盟/歐洲經濟區式國家藥品驗證系統（EMVS/NMVS）：由中央資訊路由器加國家資料庫，在配藥點（藥局/醫院）近乎即時驗證每一序列化包裝並標記為已配發，但不保存完整所有權轉移軌跡。採用 EMVO 認可的兩套藍圖（Solidsoft Reply、Arvato Systems）建置。核心工程約束是不中斷可用性與低延遲查詢（配藥不能停），故硬體偏向高可用+異地容災+高速 NVMe，而非大容量存儲。SMCI 注意：主流 Solidsoft 藍圖建於 Microsoft Azure（公有雲，超大規模商，超出 SMCI 範圍）；SMCI 可及的部分僅限少數主權/資料落地驅動的本地部署 NMVS，故實際硬體拉動為溫和。
