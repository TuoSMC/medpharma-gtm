- id: radiation-oncology-tps-proton-particle-carbon-heavy-ion-biological
  parent: radiation-oncology-tps-proton-particle
  name_en: Carbon / Heavy-Ion Biological-Dose TPS (RBE/LET, LEM/MKM)
  name_zh: 碳离子/重离子生物剂量治疗计划系统（RBE/LET，LEM/MKM）
  name_full: Carbon / Heavy-Ion Particle-Therapy TPS with RBE-weighted biological-dose and dose-averaged LET optimization (Local Effect Model / Microdosimetric Kinetic Model)
  scope_en: 'Heavy-ion (carbon, helium) particle-therapy planning that optimizes RBE-weighted BIOLOGICAL dose and dose-averaged LET (LETd) using microdosimetric radiobiology models — Local Effect Model (LEM) and Microdosimetric Kinetic Model (MKM) — not just physical dose as in proton planning. Genuinely distinct sub-market: a biological-dose layer on top of the transport engine, a distinct and tiny buyer base (~14 heavy-ion/hadron centres worldwide, e.g. HIT, CNAO, MedAustron, SPHIC, Osaka HIMAK, Yamagata), and a distinct hardware pull (biological optimization over large voxel/spot grids, GPU-accelerated Monte Carlo where offered). Proton PBS physical-dose planning is NOT emitted as a child because that IS the parent itself.'
  scope_zh: 重离子（碳、氦）粒子治疗计划：在输运引擎之上，使用微剂量学放射生物学模型——局部效应模型（LEM）与微剂量动力学模型（MKM）——优化RBE加权的生物剂量与剂量平均传能线密度（LETd），而不仅是质子计划中的物理剂量。真正独立的子市场：在剂量引擎之上叠加生物剂量层、独立且极小的买方群体（全球仅约14家重离子/强子中心，如HIT、CNAO、MedAustron、上海SPHIC、大阪HIMAK、山形），以及独立的硬件拉动（对大体素/点阵网格的生物优化，配合GPU加速蒙特卡洛）。质子PBS物理剂量计划不作为子项，因为那就是父市场本身。注：商用碳离子TPS（RayStation、VQA Plan）以解析笔形束为主，非大型GPU蒙特卡洛集群，且全球装机基数极小，故单点硬件机会为modest。
