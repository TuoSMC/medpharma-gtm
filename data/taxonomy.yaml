  scope_en: 'CT-based 3D reconstruction, annulus/landing-zone sizing and device-fit planning for transcatheter structural-heart procedures (aortic/mitral/tricuspid valve replacement, left-atrial-appendage occlusion). A separate advanced-visualization workflow from FFR/plaque: the buying center is the structural-heart/interventional team, and the deliverable is procedural measurement rather than disease risk. Bulk of the market is workstation/thin-client 3D viz (3mensio, Philips HeartNavigator, Siemens Valve Pilot), a modest per-seat hardware pull. A distinct predictive-simulation tier (Materialise Mimics + FEops HEARTguide) runs patient-specific finite-element/CFD deployment simulation, which adds a real HPC/GPU compute pull on top of the viz seat.'
