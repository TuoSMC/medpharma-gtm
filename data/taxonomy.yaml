- id: advanced-visualization-3d-cardiovascular-ctffr-functional-cfd-ffrct
  parent: advanced-visualization-3d-cardiovascular-ctffr
  name_en: Functional CT-FFR / Coronary Hemodynamic Simulation (FFRct)
  name_zh: 功能性 CT-FFR / 冠脉血流动力学仿真
  name_full: Functional CT-FFR — Computational Fluid Dynamics / ML-Based Fractional Flow Reserve from Coronary CTA
  scope_en: 'Non-invasive estimation of lesion-specific coronary ischemia (fractional flow reserve) computed from a standard coronary CTA, using either full computational fluid dynamics (CFD) solved on a patient-specific 3D coronary tree or reduced-order/machine-learning surrogate models. This is the physics-simulation workflow: it turns anatomy into blood-flow physics, distinct from morphologic plaque reading. The dominant vendor (HeartFlow) runs it as a centralized cloud service — images uploaded, meshed, solved on a compute farm, result returned — which is a genuine datacenter/HPC pull; on-site variants (Siemens cFFR, Canon) push the same math onto a local workstation/GPU for sub-minute turnaround.'
  scope_zh: 基于常规冠脉 CTA 无创估算病变特异性冠脉缺血（血流储备分数 FFR），采用针对患者三维冠脉树求解的完整计算流体力学（CFD）或降阶/机器学习代理模型。这是物理仿真工作流——将解剖结构转化为血流物理，区别于形态学斑块判读。主导厂商 HeartFlow 以集中式云服务运行（上传影像、网格化、在计算集群求解、返回结果），带来真实的数据中心/HPC 需求；本地化方案（Siemens cFFR、Canon）将相同运算放到本地工作站/GPU 上实现分钟级出结果。
