- id: pharmacometrics-modeling-simulation-qsp-systems-pharmacology
  parent: pharmacometrics-modeling-simulation
  name_en: Quantitative Systems Pharmacology (QSP)
  name_zh: 定量系统药理学(QSP)
  name_full: Quantitative Systems Pharmacology Modeling & Virtual Population Simulation
  scope_en: 'Large mechanistic biology models that couple disease pathway networks to drug mechanism-of-action, used to explore targets, biomarkers, and combination therapy in silico. The compute signature is distinct from PK modeling: big stiff ODE/PDE systems plus virtual-population calibration (generating hundreds-to-thousands of plausible-patient parameterizations via gradient-based or sampling fitting) — the one sub-market here with a real GPU / accelerated-solver angle. NVIDIA''s nvQSP GPU stiff-ODE solver and Julia/SciML surrogate acceleration (DifferentialEquations.jl, echo-state-network surrogates, up to ~56x) validate an emerging GPU pull. Buyer is the systems-biology / QSP group, often distinct from classical pharmacometrics.'
  scope_zh: 将疾病通路网络与药物作用机制耦合的大型机制生物学模型,用于体外(in silico)探索靶点、生物标志物与联合治疗。其计算特征与PK建模不同:大型刚性ODE/PDE系统加虚拟人群校准(通过基于梯度或采样的拟合生成数百至数千个合理患者参数化)—— 这是本层唯一具有真正GPU/加速求解器需求的子市场。NVIDIA的nvQSP GPU刚性ODE求解器与Julia/SciML代理加速(DifferentialEquations.jl、回声状态网络代理,最高约56倍)印证了新兴的GPU需求。买方为系统生物学/QSP团队,常与传统药量学团队分立。
