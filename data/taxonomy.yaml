version: 6
status: approved

enums:
  lifecycle: [research, preclinical, clinical, manufacturing, commercial, post-market]
  role: [system-of-record, workflow, data-acquisition, integration, analytics-artificial-intelligence, infrastructure-platform, regulated-software-as-a-medical-device]
  data_modality: [transactional, images, omics, time-series, documents, simulation, artificial-intelligence-models, real-world-data]
  deployment: [on-premises, private-cloud, hybrid, public-cloud, software-as-a-service, vendor-managed, edge]
  segments: [hospital-health-system, diagnostic-reference-laboratory, academic-medical-center,
             medical-technology-in-vitro-diagnostics, biotechnology-pharmaceutical, contract-research-organization, contract-development-manufacturing-organization, payer]
  hospital_stakeholder: [patient, clinician, device, facility]
  hospital_dimension: [clinical, ops, business, admin, regulatory]
  hardware_opportunity: [1, 2, 3, 4]   # size of the hardware/infra deal a category pulls: 1 minimal · 2 modest · 3 significant · 4 flagship (headline rollup)
  hardware_buyer: [customer, operator, hyperscaler, original-equipment-manufacturer] # WHO buys the iron (§3 gate, authoritative)
  hardware_profile: [gpu-server, high-performance-computing-cpu, nvme-performance-storage, capacity-archive-storage, high-memory, edge-industrial, high-availability-redundant, disaster-recovery-backup] # SMCI components a category pulls (bridge to product)
  domain: [hospital-clinical-core, hospital-business-administration, hospital-device-facility-operations,
           diagnostics-laboratory, pharmaceutical-research-clinical-development,
           manufacturing-quality-supply-chain, data-analytics-payer-platforms,
           medical-technology-device-software]

