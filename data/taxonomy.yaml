  name_en: Deep-Learning Spectrum-Predicted PSM Rescoring Pipelines
  name_zh: 深度学习谱图预测 PSM 重打分流水线
  name_full: Post-search data-driven rescoring that adds DL-predicted fragment/RT features and re-ranks PSMs with Percolator/Mokapot (DDA)
  scope_en: Search-engine-agnostic post-processors that generate features from DL-predicted fragment intensities (MS2PIP, Prosit) and retention time (DeepLC), then submit unfiltered PSMs to Percolator/Mokapot to recover more identifications at fixed FDR. An add-on layered on top of any search engine, not a search engine itself. Includes MS2Rescore, Oktoberfest, inSPIRE, TIMS2Rescore (timsTOF DDA-PASEF).
