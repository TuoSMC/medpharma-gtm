  scope_en: 'Outpatient EHR + practice-management for independent physician groups, clinics and specialty practices. The install base is dominated by ISV-hosted cloud/SaaS — small practices buy no infrastructure of their own, so this is an operator co-sell (dedicated single-tenant hosting) at best, and modest. Important co-sell caveat: athenahealth is pure public-cloud / AWS-committed (near-zero SMCI room, per playbook scope rule 4), whereas eClinicalWorks, NextGen and Greenway still run owned datacenters where an ISV hardware conversation exists. Not a SMCI-direct segment.'
  scope_zh: 獨立醫師集團、診所與專科診所的門診EHR＋診所管理。安裝基礎以ISV託管雲端/SaaS為主——小型診所不自購基礎設施，故最多為operator協銷（專屬單租戶託管），機會modest。重要協銷提醒：athenahealth為純公有雲/AWS綁定（依手冊範圍規則4，SMCI幾無空間），而eClinicalWorks、NextGen、Greenway仍營運自有機房，存在ISV硬體對話空間。非SMCI直銷區塊。
