  scope_en: 'Scheduler-plugin layer that replaces the default kube-scheduler for large multi-node GPU training/HPC jobs: all-or-nothing gang scheduling (so a distributed training job only starts when every worker can be placed), topology-aware bin-packing, hierarchical queues, fair-share/DRF and cross-department quota. Buyers are research-computing/AI-platform teams at pharma and academic medical centers running distributed drug-discovery model training and multi-GPU bioinformatics. Distinct SMCI pull: large multi-node GPU clusters with high-speed interconnect and parallel storage — the opposite density profile from single-GPU fractional sharing.'
