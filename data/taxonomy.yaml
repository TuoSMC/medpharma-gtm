  scope_en: 'The automation layer inside/alongside the photon TPS that auto-generates deliverable IMRT/VMAT plans: knowledge-based planning (atlas/DVH-prediction), deep-learning dose prediction, and a-priori multi-criteria optimization. An analyst-tracked, separately-licensed segment; hospital-side GPU pull is modest (a single inference/planning workstation per department; DL model training is vendor-side), so hardware opportunity is set to modest to avoid double-counting the parent dose-calculation farm''s own compute. Same big-three-plus-Philips vendor set as the parent, hence a sub-workflow rather than a distinct-vendor market — flagged confidence B.'
