  name_zh: 嵌合/共碎裂 MS2 解卷积搜索引擎
  name_full: Spectrum-centric AI search engines that explain each MS2 with a minimal set of co-isolated peptides (DDA)
  scope_en: Primary-search replacements that treat one MS2 as a mixture and, using DL-predicted fragment-ion intensities and retention time plus regularized regression, explain it with the fewest co-fragmented peptides. Replaces the database search step (not a post-processor). Includes CHIMERYS (MSAID, in Proteome Discoverer), Sage chimeric/wide-window mode, MSFragger-DDA+ full-isolation-window search.
