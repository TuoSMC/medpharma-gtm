- id: bioinformatics-secondary-population-cohort-federated-analytics
  parent: bioinformatics-secondary-population-cohort
  name_en: Federated / Distributed Cross-Cohort Analytics
  name_zh: 聯邦式／分佈式跨隊列分析
  name_full: Federated Multi-Biobank Analytics — Compute-to-Data Across Sovereign Cohorts
  scope_en: '''Move the compute to the data'' analytics across multiple biobanks/registries that legally cannot be pooled: analysis commands are dispatched to a node sitting inside each cohort''s firewall, executed locally, and only non-disclosive aggregate statistics or model weights return. Hub-and-spoke federated statistics (DataSHIELD / MOLGENIS Armadillo), federated genomics (Lifebit Federated), and federated ML (Rhino Health, Owkin). Distinct hardware pull: many modest per-site nodes — CPU for federated statistics, GPU for federated deep learning — plus a coordinating node, driven by data-sovereignty rather than raw scale.'
  scope_zh: 在法律上無法匯集的多個生物樣本庫／登記處之間「將計算移向數據」的分析：指令下發到各隊列防火牆內的節點本地執行，僅回傳非披露性聚合統計或模型權重。中心輻射式聯邦統計（DataSHIELD／MOLGENIS Armadillo）、聯邦基因組（Lifebit Federated）、聯邦機器學習（Rhino Health、Owkin）。硬件拉動獨特：多個中等的每站點節點（統計用 CPU、深度學習用 GPU）加一協調節點，由數據主權而非規模驅動。
