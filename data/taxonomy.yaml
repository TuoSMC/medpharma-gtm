- id: bioinformatics-secondary-population-cohort-gwas-statistical-genetics
  parent: bioinformatics-secondary-population-cohort
  name_en: Biobank-Scale GWAS / Statistical-Genetics Compute Engines
  name_zh: 生物樣本庫級 GWAS／統計遺傳學計算引擎
  name_full: Biobank-Scale Genome-Wide Association & Whole-Genome-Regression Statistical-Genetics Engines
  scope_en: 'Dense-compute engines that run genome-wide association / mixed-model regression across hundreds of thousands to millions of samples: whole-genome regression (REGENIE / GloWGR), sparse mixed models (SAIGE, BOLT-LMM), and Spark/HDFS-native cohort engines (Databricks Glow, Broad Hail/Terra). Distinct from the TRE substrate — this is the CPU- and RAM-bound batch-analytics workload (step-1 whole-genome regression, gene-based and interaction testing) that consumes the cohort once it is assembled. Rated significant rather than flagship because the same iron is frequently the TRE''s own compute layer and the workload is bursty and largely open-source.'
  scope_zh: 在數十萬至數百萬樣本上運行全基因組關聯／混合模型回歸的密集計算引擎：全基因組回歸（REGENIE／GloWGR）、稀疏混合模型（SAIGE、BOLT-LMM）、Spark/HDFS 原生隊列引擎（Databricks Glow、Broad Hail/Terra）。區別於 TRE 底座——這是隊列組裝後消耗它的、受 CPU 與內存約束的批量分析負載。評為「顯著」而非「旗艦」，因為所用硬件常即 TRE 自身算力層，且負載呈突發性並多為開源。
