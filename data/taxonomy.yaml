- id: ehr-emr-core-acute-inpatient-enterprise-idn-suite
  parent: ehr-emr-core-acute-inpatient
  name_en: Enterprise Integrated Acute EHR (Tier-1 IDN Suite)
  name_zh: 企業級整合式急症住院電子病歷（大型醫療系統核心套件）
  name_full: Tier-1 Integrated Inpatient System-of-Record Suite (CPOE / eMAR / Clinical Documentation on a Single Platform)
  scope_en: The single-platform system-of-record that runs an entire hospital or IDN's inpatient operations — CPOE, eMAR, orders, results, clinical documentation, and inpatient revenue on one integrated database. Runs on an in-memory operational database (InterSystems IRIS/Cache for Epic; Oracle DB for Cerner Millennium) that demands very high RAM, all-flash NVMe, synchronous failover and asynchronous DR mirroring. This is the flagship SMCI database-server pull inside acute EHR.
