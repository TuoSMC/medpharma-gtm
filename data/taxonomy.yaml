  name_full: Data-Dependent Acquisition Spectrum-Centric Fragment-Ion-Index Database Search & Quantification Engines
  scope_en: 'Data-dependent acquisition (DDA) search engines that identify and quantify peptides by matching MS/MS spectra against a protein sequence database, typically via fragment-ion indexing. These are CPU-core- and RAM-bound: engines like MSFragger load large fragment-ion indexes into memory to reach 6x+ search speed, and pharma-scale runs batch thousands of raw files. Covers label-free and isobaric (TMT/iTRAQ) reporter-ion quant done on top of the same DDA search core.'
