- id: pharmacometrics-modeling-simulation-nlme-poppk-estimation
  parent: pharmacometrics-modeling-simulation
  name_en: Population PK/PD (NLME) Estimation & Pharmacometrics
  name_zh: 群体药代/药效(非线性混合效应)估计与药量学
  name_full: Population PK/PD Nonlinear Mixed-Effects (NLME) Estimation Software
  scope_en: 'Core pharmacometric estimation engines that fit nonlinear mixed-effects models to sparse/dense concentration-time and biomarker data from clinical trials — FOCE/SAEM/Bayesian estimation, covariate model building, bootstraps, and visual predictive checks. This is the compute-heaviest, most grid-oriented pharmacometrics workload: bootstrap replicates, stepwise covariate searches, and stochastic estimation chains are embarrassingly parallel and routinely run on dedicated HPC-CPU clusters (''NONMEM grids'') or the vendor''s cloud. Distinct buyer: the sponsor''s pharmacometrics/clinical-pharmacology modeling group.'
  scope_zh: 药量学核心估计引擎,将非线性混合效应模型拟合到临床试验的稀疏/密集浓度-时间及生物标志物数据 —— FOCE/SAEM/贝叶斯估计、协变量建模、自助法(bootstrap)与可视化预测检验(VPC)。这是药量学中计算量最大、最依赖计算网格的工作负载:自助法重复、逐步协变量搜索与随机估计链高度可并行,通常运行在专用HPC-CPU集群('NONMEM网格')或厂商云上。买方明确:申办方的药量学/临床药理建模团队。
