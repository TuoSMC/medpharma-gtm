- id: ai-hpc-orchestration-hpc-batch-scheduler-htc-grid-pilot-job-federation-meta-scheduling
  parent: ai-hpc-orchestration-hpc-batch-scheduler-htc-grid
  name_en: Pilot-Job / Grid-Federation Meta-Scheduling (Overlay WMS)
  name_zh: 先導作業/網格聯邦元排程（覆蓋式工作負載管理）
  scope_en: 'Overlay workload-management systems that federate many autonomous, independently-administered HTC sites (and cloud bursts) into a single logical pool using pilot/''glidein'' jobs and late binding: a pilot lands on a remote site, phones home to a central factory/broker, and pulls payload work just-in-time. This is a distinct architectural and product layer sitting ABOVE a single-cluster batch scheduler (the parent) — it adds cross-site brokering, global fair-share, and fault masking across unreliable resources. Real pharma/life-science use is the large distributed virtual-screening / docking campaign (e.g. WISDOM-style ligand docking across grids, RADICAL-Pilot COVID-19 docking) and multi-site cohort/simulation batch, alongside the dominant HEP user base.'
  scope_zh: 覆蓋式工作負載管理系統，透過先導（glidein）作業與延遲綁定，把眾多自治、各自管理的高吞吐運算站點（含雲端爆發）聯邦成單一邏輯資源池：先導作業落到遠端站點後回連中央工廠/中介，即時拉取實際運算負載。此為位於單一叢集批次排程器（母市場）之上的獨立架構與產品層，提供跨站點中介、全域公平分享與容錯遮蔽。製藥/生命科學的真實用例為大規模分散式虛擬篩選/對接運算（如跨網格的百萬配體對接活動、RADICAL-Pilot 的 COVID-19 對接）與多站點世代/模擬批次，主要使用者仍以高能物理社群為主。
