  scope_en: Physiology-anchored, bottom-up mechanistic models that predict absorption, distribution, drug-drug interactions, and special-population/organ-impairment exposure by simulating drug behavior across virtual populations built from physiological parameters. Widely used for regulatory submissions (DDI and pediatric waivers). Distinct vendor set and a distinct buyer — the DMPK / clinical-pharmacology group — separate from the NLME pharmacometricians. Compute is mechanistic ODE simulation across virtual-population trials; largely workstation- and small-cluster-shaped, with cloud/CPU batch for large virtual-population DDI sweeps.
