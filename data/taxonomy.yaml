- id: ngs-lab-lims-sequencer-run-control-basecalling
  parent: ngs-lab-lims
  name_en: Sequencer Run-Control & Live Basecalling Software
  name_zh: 測序儀運行控制與實時鹼基識別軟體
  name_full: Instrument-vendor run-control and primary-analysis software (sequencer control, real-time basecalling/demultiplexing) — the run-management layer physically adjacent to the sequencer, pulling GPU/edge compute (Dorado)
  scope_en: 'The run-management/primary-analysis layer that drives the sequencer itself: instrument control, real-time signal-to-basecall conversion and on-instrument demultiplexing. This is the ONE NGS-LIMS sub-market with a genuine SMCI GPU pull — Oxford Nanopore Dorado requires an NVIDIA GPU (Pascal+, ≥8GB vRAM; optimized for A100/H100) for live/re-basecalling, so labs buy GPU/edge servers adjacent to the sequencer for off-instrument or higher-throughput basecalling. (Illumina DRAGEN is FPGA-accelerated rather than NVIDIA-GPU, so the GPU-server story rests on Nanopore.) The OEM-integrated path (GridION/PromethION) uses ONT''s own compute and is NOT an SMCI BOM; the SMCI-relevant buyer is the lab purchasing its own GPU iron.'
