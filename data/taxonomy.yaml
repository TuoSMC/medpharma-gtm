  scope_en: 'Software that carves a single physical GPU into isolated fractional slices consumable by multiple Kubernetes pods — via CUDA-level time-slicing, MIG partition orchestration, and enforced memory/compute isolation — so many small medical AI inference/notebook workloads (radiology triage models, pathology inference, LLM copilots, bioinformatics notebooks) pack densely onto expensive GPUs. Distinct buyer motion: platform/MLOps team chasing GPU utilization, not the batch-training scheduler. Distinct SMCI pull: dense single-node GPU servers sized for consolidation and inference oversubscription rather than multi-node training fabric.'
