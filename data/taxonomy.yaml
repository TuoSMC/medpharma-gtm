  scope_en: 'Payer-facing retrospective and prospective risk adjustment: AI/NLP mines millions of member charts to surface under-documented HCC conditions, close diagnosis gaps and optimize RAF scores across Medicare Advantage, Medicaid and ACA. The GPU/NLP chart-mining workload is the distinct hardware pull that separates this from the rest of the parent. Delivery is concentrated in a handful of large operators (Optum, Cotiviti, Datavant) that run the chart-mining pipelines as a service.'
