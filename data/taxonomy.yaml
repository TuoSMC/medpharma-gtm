  name_en: Confidential-Computing / TEE Secure-Enclave Training (hardware-attested pooled training)
  name_zh: 機密運算／TEE 安全飛地訓練（硬體驗證的集中式訓練）
  name_full: Trusted Execution Environment (TEE) secure-enclave platforms that let multiple parties pool PHI and train/validate models inside hardware-attested enclaves where data and algorithm IP are invisible to the host, hypervisor and admins
  scope_en: 'Privacy-preserving multi-site training via hardware confidential computing rather than gradient exchange: data (or the algorithm) is brought into an attested enclave and pooled/validated without exposure. Distinct hardware signature = confidential-computing-capable silicon — NVIDIA H100/H200 CC-mode GPUs, Intel TDX/SGX or AMD SEV-SNP CPUs — running centralized, with strong HA/attestation requirements. SMCI-relevant only for ON-PREM/co-located confidential-computing deployments; several vendors default to hyperscaler CC (Azure), which leaks the iron away from SMCI, so the on-prem pull is real but softer than the FL-orchestration sibling.'
  scope_zh: 透過硬體機密運算（而非梯度交換）進行隱私保護的跨站點訓練：資料（或演算法）進入經驗證的飛地內集中/驗證而不暴露。硬體特徵＝支援機密運算的晶片——NVIDIA H100/H200 CC 模式 GPU、Intel TDX/SGX 或 AMD SEV-SNP CPU——集中運行，具強 HA／遠端驗證需求。僅在地端/自建機密運算部署對 SMCI 有意義；部分廠商預設跑在 Azure 機密運算雲上，會把硬體流向超大規模雲，故在地端拉力真實但弱於聯邦學習子市場。與資料不出院的聯邦學習屬不同廠商與架構。
