  name_full: Model-Informed Precision Dosing (MIPD) — Point-of-Care Bayesian Dose Individualization from PopPK Priors
  scope_en: Point-of-care software that takes a pre-built population PK/PD model as a Bayesian prior and computes individualized dosing for a single patient via MAP/empirical-Bayes estimation from sparse therapeutic-drug-monitoring levels (vancomycin, aminoglycosides, busulfan, methotrexate, infliximab, etc.). Deployed inside hospital pharmacies and integrated with the EHR/LIS; several tools are regulated software (cleared/CE-marked). Distinct from the research parent by buyer (clinical pharmacy, not a modeling group) and by a latency-/PHI-driven pull toward on-prem clinical servers rather than a batch cluster.
