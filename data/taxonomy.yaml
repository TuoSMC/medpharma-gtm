  scope_en: EHR for skilled-nursing facilities, senior living, home health and hospice — a distinct vendor world from acute/ambulatory, led by PointClickCare (~65% skilled-nursing share, 6-yr KLAS leader, 21,000+ facilities) and MatrixCare (15,000+ providers), with WellSky (Best-in-KLAS home health/hospice), Netsmart and American HealthTech. Delivery is vendor-run cloud/SaaS, so operator co-sell and modest; the care organizations themselves buy little to no iron and the leaders increasingly run on public cloud, capping SMCI pull. KLAS tracks this as its own Long-Term Care / Continuum-of-Care category.
