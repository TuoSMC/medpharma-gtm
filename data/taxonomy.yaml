  name_zh: 开放式／主权医疗数据湖仓（多模态 AI）
  name_full: Open-Format Sovereign Healthcare & Life-Sciences Data Lakehouse for Multimodal AI
  scope_en: 'On-prem/hybrid open-table-format (Delta Lake / Apache Iceberg) lakehouse that unifies structured EHR and claims with imaging, genomics and clinical text on a single governed platform for ML/AI feature engineering and model training. Distinct from the SQL EDW by open formats, Spark/query-engine compute (Dremio, Starburst), all-flash NVMe substrate (VAST Data), and GPU-backed AI workloads on curated tables. The SMCI-relevant slice is the on-prem/sovereign/air-gapped deployment (Cloudera CDP, Dremio+VAST, private engines) that deliberately avoids public cloud; the hyperscaler-native Snowflake/AWS HealthLake/Google Health Data Engine variants are out of scope. Note: Databricks names/defines the healthcare-lakehouse category but is itself cloud-native — the genuine SMCI iron in this child is Cloudera/Dremio/Starburst/VAST on-prem.'
