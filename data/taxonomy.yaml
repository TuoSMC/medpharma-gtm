  name_full: Population-Scale Joint Genotyping — merging tens-to-hundreds of thousands of per-sample gVCFs into a jointly genotyped cohort matrix (GLnexus, GATK GenomicsDBImport/GenotypeGVCFs, GraphTyper)
  scope_en: 'The distinct downstream sub-workflow that combines per-sample gVCFs into a joint-genotyped cohort: GLnexus (DeepVariant), GATK GenomicsDBImport+GenotypeGVCFs, or GraphTyper across biobank cohorts (UK Biobank ran 150k+ WGS via GraphTyper). Unlike per-sample alignment/calling this is memory- and storage-bound, not GPU — the pull is high-memory nodes plus fast NVMe scratch and large capacity/archive for the growing cohort database. It is the ONLY child here whose hardware pull is not GPU. Softer as a standalone market: core tooling is largely open-source, packaged commercially by platform players.'
  scope_zh: 把逐样本gVCF合并为联合分型队列的独立下游子流程：GLnexus（配DeepVariant）、GATK GenomicsDBImport+GenotypeGVCFs，或GraphTyper用于生物样本库队列（UK Biobank用GraphTyper处理15万+ WGS）。与逐样本比对/检测不同，此环节受内存与存储约束而非GPU——拉动高内存节点、高速NVMe暂存以及为不断增长的队列数据库准备的大容量/归档存储。这是本层唯一非GPU拉动的子市场。作为独立市场偏软：核心工具多为开源，由平台厂商商业化封装。
