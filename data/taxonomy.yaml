- id: ehr-emr-core-community-critical-access
  parent: ehr-emr-core
  name_en: Community & Critical-Access Hospital EHR
  name_zh: 社區與偏鄉急救（Critical-Access）醫院電子病歷
  name_full: Community and Critical-Access Hospital Electronic Health Record (1-150 beds)
  scope_en: 'Inpatient EHR for small, rural and critical-access hospitals (roughly 1-150 beds) where Epic is too costly/complex. A distinct vendor field from large-acute, and the segment is shifting hard to vendor-hosted single-tenant delivery (MEDITECH-as-a-Service, Oracle Health CommunityWorks hosted, TruBridge hosting, Altera Paragon Denali) — so predominantly operator co-sell, but each hosted site still needs real dedicated HA + DR iron, making the opportunity significant rather than modest. Ties to the rural-hospital EHR replacement wave (Black Book: ~55% of rural/CAH planning replacement within 18 months).'
  scope_zh: 小型、偏鄉與critical-access醫院（約1-150床）的住院EHR，Epic對其過於昂貴複雜。廠商陣容與大型急症區塊不同，且此區塊正快速轉向廠商託管單租戶交付（MEDITECH-as-a-Service、Oracle CommunityWorks託管、TruBridge託管、Altera Paragon Denali）——故以operator協銷為主，但每個託管站點仍需實體專屬HA＋DR硬體，機會為significant而非modest。對應偏鄉醫院EHR汰換潮（Black Book：約55%偏鄉/CAH醫院18個月內規劃汰換）。
