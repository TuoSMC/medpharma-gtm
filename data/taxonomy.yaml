  name_zh: 軟體時間切片與 MPS 軟性 GPU 共享
  name_full: Software-Level Fractional GPU Sharing via Time-Slicing and CUDA MPS (No Hardware Isolation)
  scope_en: 'Pure-software fractionalization: a scheduler/device-plugin lets multiple pods declare sub-GPU fractions (e.g. 0.25 GPU, N GB memory) and share one physical GPU by time-slicing the context or via CUDA MPS memory partitioning, with no hardware fault/memory isolation. Works on ANY GPU including commodity/consumer cards, so it drives denser utilization of existing GPU servers rather than new silicon.'
