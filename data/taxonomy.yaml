  name_zh: 遠端 GPU 池化與可組合光纖解耦
  name_full: Composable (PCIe/CXL Fabric) GPU Disaggregation and Network-Attached GPU Pooling
  scope_en: 'Detaches GPUs from their host and pools them across a fabric: composable-disaggregated-infrastructure (CDI) uses PCIe/CXL fabric to compose GPUs from a shared disaggregated chassis (JBOG) into any host on demand; a software GPU-over-IP layer can additionally attach remote GPUs to unmodified client apps. Highest SMCI pull of the three — drives dense GPU chassis, disaggregation appliances and high-speed fabric, not just utilization software. NOTE: the pure-software GPU-over-IP leg has weak standalone vendors after Juice Labs was absorbed by HP and VMware Bitfusion went EOL; the durable vendors are the composable-fabric appliance makers.'
