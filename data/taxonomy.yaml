  name_en: Pharmacometrics HPC Run Orchestration & Compute-Intensive Diagnostics (Bootstrap / SCM / VPC / SSE)
  name_zh: 药代动力学HPC作业编排与计算密集型诊断（Bootstrap/协变量逐步筛选/VPC/SSE）
  name_full: Pharmacometrics Run-Management & HPC Compute Layer for NLME (nonparametric bootstrap, stepwise covariate modeling, visual predictive checks, log-likelihood profiling, stochastic simulation-estimation)
  scope_en: 'The compute-orchestration layer that fans thousands of parallel NONMEM/Monolix/Pumas fits across a CPU cluster to run the batch-heavy statistics that wrap the NLME estimator: nonparametric bootstrap, stepwise covariate model building (SCM), visual predictive checks (VPC), log-likelihood profiling, and stochastic simulation-and-estimation (SSE). This is where the real cluster pull lives — a single model fit is one core-hour, but a bootstrap/SCM/SSE campaign is thousands of embarrassingly-parallel fits over shared model+dataset storage. Delivered as on-prem run managers/grids or as validated cloud environments.'
  scope_zh: 计算编排层：将成千上万次NONMEM/Monolix/Pumas拟合并行分发到CPU集群，运行围绕NLME估计器的批量密集统计——非参数Bootstrap、逐步协变量建模(SCM)、可视化预测检验(VPC)、对数似然剖面、随机模拟与估计(SSE)。真正的集群需求源于此：单次拟合仅数核时，但一次Bootstrap/SCM/SSE往往是数千次高度并行拟合，共享模型与数据集存储。以本地作业管理器/网格或经验证的云环境交付。
