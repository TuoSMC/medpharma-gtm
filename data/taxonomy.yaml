  parent: bioinformatics-secondary-alignment-variant-long-read
  name_en: Long-Read Methylation / Modified-Base Analysis (Dorado+modkit / pb-CpG-tools)
  name_zh: 长读长甲基化 / 碱基修饰分析（Dorado+modkit / pb-CpG-tools）
  name_full: Long-Read DNA Methylation and Modified-Base Secondary Analysis
  scope_en: 'Native 5mC/5hmC and modified-base detection carried in the same long reads, then aligned and piled up into per-CpG methylation and differential-methylation/haplotype-resolved calls — an epigenetics sub-workflow distinct from sequence-variant calling. ONT: Dorado/Remora mod-basecalling + modkit pileup; PacBio HiFi: pb-CpG-tools; orchestrated by nf-core/methylong. Carries the strongest SMCI pull in this parent: mod-aware basecalling is GPU-bound and modBAMs are large, driving GPU-server + NVMe + archive demand — though most of the GPU spend sits at the basecalling boundary upstream of this secondary-analysis step (the modkit/pb-CpG-tools pileup itself is CPU).'
