- id: cdss-clinical-ai-predictive-surveillance
  parent: cdss-clinical-ai
  name_en: Real-Time Predictive Clinical Surveillance (Sepsis / Deterioration / Early Warning)
  name_zh: 即時預測性臨床監測（敗血症／病情惡化／早期預警）
  name_full: Real-Time Predictive Clinical Surveillance & Early-Warning AI (sepsis, deterioration, patient-safety)
  scope_en: 'Continuous machine-learning inference over streaming EHR vitals, labs and orders to predict sepsis, clinical deterioration and safety events ahead of onset — FDA-cleared continuous monitors (Bayesian Health TREWS, first-ever continuous AI sepsis 510(k), May 2026) plus homegrown academic early-warning models (Duke Sepsis Watch, UCSD COMPOSER). Architecturally distinct from rule-based CDSS: it reasons continuously over evolving patient state, so it demands always-on, low-latency inference next to the clinical data — a genuine high-availability + modest-GPU + fast-storage pull, and several deployments run on hospital/private infrastructure (SMCI direct). GPU footprint is modest (many models are gradient-boosted/logistic); the anchor is HA + NVMe, not dense training.'
  scope_zh: 對串流的 EHR 生命徵象、檢驗與醫囑進行連續機器學習推論，在敗血症、病情惡化與病安事件發生前提出預警——含 FDA 核准之連續監測（Bayesian Health TREWS，史上首個連續 AI 敗血症 510(k)，2026年5月）與學術自研早期預警模型（Duke Sepsis Watch、UCSD COMPOSER）。與規則式 CDSS 架構本質不同：需對演變中的病人狀態連續推理，故需貼近臨床資料、永不中斷、低延遲的推論，形成真實的高可用＋中度 GPU＋高速儲存拉動；部分部署於醫院／私有基礎設施（SMCI 直銷）。GPU 需求屬中度（多為梯度提升／羅吉斯模型），主錨為高可用＋NVMe，而非密集訓練。
