- id: bioinformatics-secondary-alignment-variant-population-joint-genotyping-structural-variant-sv-cohort-genotyping
  parent: bioinformatics-secondary-alignment-variant-population-joint-genotyping
  name_en: Structural-Variant Population Genotyping / SV Cohort Merge (GraphTyper2 / Paragraph / GATK-SV)
  name_zh: 結構變異群體基因分型 / SV 隊列合併（GraphTyper2 / Paragraph / GATK-SV）
  scope_en: Joint genotyping and cross-sample merging of structural variants (deletions, insertions, duplications, CNVs) across a cohort, as a distinct variant class from SNV/indel joint calling. Uses graph/pangenome genotypers (GraphTyper2, Paragraph) or ensemble re-genotyping pipelines (GATK-SV, as used for gnomAD-SV v4). SVs are discovered per-sample, then re-genotyped and merged so identical sites are reported once across tens of thousands of genomes. Tooling is predominantly open-source/academic, driving customer HPC-CPU + NVMe purchases rather than commercial ISV licenses.
  scope_zh: 對隊列中的結構變異（缺失、插入、重複、CNV）進行聯合基因分型與跨樣本合併，作為有別於 SNV/indel 聯合檢測的獨立變異類別。採用圖/泛基因組分型器（GraphTyper2、Paragraph）或集成再分型流程（GATK-SV，用於 gnomAD-SV v4）。SV 先按樣本發現，再跨數萬基因組重新分型併合並，使相同位點僅報告一次。工具以開源/學術為主，帶動客戶自建 HPC-CPU + NVMe 硬件而非商業 ISV 授權。
