- id: pacs-radiology-core-enterprise-server-side-rendering
  parent: pacs-radiology-core-enterprise
  name_en: Server-Side-Rendering High-Performance Diagnostic PACS
  name_zh: 服务器端渲染高性能诊断PACS
  name_full: Server-Side-Rendering / Streaming Thin-Client Diagnostic Interpretation Platform (Deconstructed-PACS Rendering Engine)
  scope_en: 'The diagnostic interpretation and rendering engine of enterprise PACS in its modern ''PACS 3.0'' architecture: all image rendering (MPR, thick-slab, large CT/MR/DBT studies) is performed on centralized datacenter GPU servers and streamed on-demand to zero-footprint thin clients, replacing per-radiologist thick-client workstations. This is the sub-workflow where the diagnostic read happens at speed and where the datacenter GPU/RAM/NVMe pull lives, as distinct from the workflow-routing layer above it. Buyers are large health systems and academic medical centers reading high volumes of high-slice-count studies.'
  scope_zh: 企业PACS在现代'PACS 3.0'架构下的诊断判读与渲染引擎:所有影像渲染(多平面重建、厚层、大体量CT/MR/断层合成研究)均在数据中心集中式GPU服务器上完成,并按需流式传输到零占用瘦客户端,取代逐位放射科医师的厚客户端工作站。这是实际发生诊断判读、并承载数据中心GPU/内存/NVMe需求的子工作流,区别于其上层的工作流路由层。买方为判读大量高层数研究的大型医疗集团与学术医学中心。
