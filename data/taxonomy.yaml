- id: bioinformatics-secondary-alignment-variant-long-read-structural-variant-cnv
  parent: bioinformatics-secondary-alignment-variant-long-read
  name_en: Long-Read Structural Variant & CNV Calling (Sniffles / cuteSV / pbsv / Sentieon LongReadSV)
  name_zh: 长读长结构变异与拷贝数变异检测（Sniffles / cuteSV / pbsv / Sentieon LongReadSV）
  name_full: Long-Read Structural Variant and Copy-Number Detection from Aligned Reads
  scope_en: Detection of insertions, deletions, duplications, inversions, translocations and CNVs from minimap2-aligned long reads — a distinct sub-workflow from small-variant (SNV/indel) calling that is the core of the parent. Signature-based callers (Sniffles2, cuteSV, SVIM, pbsv/sawfish, Severus) plus copy-number segmentation (sawfish/Sawfish2) and population SV merging (Jasmine). Long reads are the primary reason SV detection has moved off short-read pipelines. Compute is CPU-bound but I/O- and storage-heavy on whole-genome BAMs and cohort-scale merges.
  scope_zh: 从 minimap2 比对后的长读长中检测插入、缺失、重复、倒位、易位及拷贝数变异，是独立于亲代核心（SNV/indel 小变异检测）的子工作流。基于比对信号的检测工具（Sniffles2、cuteSV、SVIM、pbsv/sawfish、Severus）加上拷贝数分段（sawfish/Sawfish2）与群体 SV 合并（Jasmine）。长读长是 SV 检测脱离短读长流程的主因。计算以 CPU 为主，但全基因组 BAM 与队列合并对 I/O 与存储压力大。
