  name_full: Structure-Based Antibody Modeling, Developability & Biophysical Liability Prediction
  scope_en: Homology/ML structure modeling of the Fv plus prediction of manufacturability liabilities — aggregation (SAP), high-concentration viscosity (SCM), hydrophobicity, PTM/chemical liabilities, polyspecificity, PK clearance. Blends short MD/energy refinement (GPU) with feature-based ML scoring (CPU); the recognized commercial CMC-developability screening segment distinct from de novo generation. Standalone open-source structure predictors (IgFold, ABodyBuilder3, ImmuneBuilder) are folded in here because commercially they are wrapped into these developability offerings rather than sold as a separate market.
