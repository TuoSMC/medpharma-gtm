  scope_en: 'Governed multimodal research data platforms and Trusted Research Environments / Secure Data Environments where AMCs, national health-data programs and biopharma access de-identified EHR + imaging + omics for cohort discovery and AI under audited, data-stays-put access. Delivered as dedicated managed infrastructure or on-prem/sovereign for national SDEs (e.g., NHS-style secure data environments). Supports OMOP/OHDSI Atlas and multimodal catalogs (verified: Aridhia DRE handles clinical/imaging via XNAT/genomic/EHR + OMOP/SDTM). Broader in modality and buyer than the genomics-cohort TRE market: EHR/imaging-centric clinical research rather than population-genomics joint-genotyping. SMCI iron concentrates under Aridhia/Palantir national-SDE managed deployments; Lifebit/Rhino are federated (thinner centralized hardware).'
