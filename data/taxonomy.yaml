  name_zh: 多基因風險評分生成與人群風險分層
  name_full: Polygenic Risk Score (PRS) Development, Validation & Population/Clinical Risk Stratification
  scope_en: 'Software that turns cohort-derived weights into individual polygenic risk scores and validated, multi-ancestry risk-stratification tests: imputation, PRS development/validation across ancestries, and clinical/population reporting (CAD, breast/prostate cancer, T2D, Alzheimer''s). A distinct clinical-lab / population-health buyer and a SaMD-adjacent regulatory posture, but genuinely SaaS-light — scoring is cheap once weights exist, so the SMCI pull is modest and honest, not inflated.'
