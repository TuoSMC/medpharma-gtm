- id: pacs-ai-orchestration-marketplace
  parent: pacs-ai-orchestration
  name_en: Vendor-neutral AI orchestration platform / marketplace
  name_zh: 廠商中立 AI 編排平台／演算法市集
  name_full: Horizontal vendor-neutral radiology-AI marketplace + orchestration hub (hosts many third-party algorithms, routes inference to the worklist)
  scope_en: 'The horizontal ''app-store'' layer: a single vendor-neutral hub that hosts, deploys, monitors and routes many third-party AI algorithms into the PACS/reporting worklist. Sold as shared infrastructure; a central multi-model GPU inference hub in the datacenter aggregating dozens of models (CARPL runs behind the hospital firewall; deepc/Blackford/Incepto offer on-prem de-identification + inference). The worklist-orchestration and marketplace-app-store functions are one commercial segment here (the same vendors do both), distinct from single-vendor clinical AI.'
  scope_zh: 水平的『應用商店』層：單一廠商中立樞紐，託管、部署、監控並將多家第三方 AI 演算法路由進 PACS／報告工作清單。作為共享基礎設施銷售，於資料中心設置集中式多模型 GPU 推論樞紐彙整數十種模型（CARPL 於院內防火牆後運行；deepc／Blackford／Incepto 提供地端去識別化與推論）。工作清單編排與演算法市集在此為同一商業區隔（同一批廠商兼營），區別於單一廠商臨床 AI。
