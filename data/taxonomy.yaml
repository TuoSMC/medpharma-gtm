  parent: advanced-visualization-3d-cardiovascular-ctffr
  name_en: AI Coronary Plaque Quantification & Characterization
  name_zh: AI 冠脉斑块定量与表征
  name_full: AI-Based Coronary Atherosclerosis / Plaque Quantification and High-Risk Plaque Characterization from CCTA
  scope_en: Deep-learning quantification of coronary atherosclerosis from coronary CTA — per-vessel and per-lesion volumes of calcified vs non-calcified/low-attenuation ('soft', high-risk) plaque, stenosis grading, and disease staging for preventive cardiology. This is the morphology-reading workflow, distinct from the CFD-hemodynamic FFR path (though several vendors also derive plaque-based ischemia estimates). Buying center is preventive/imaging cardiology rather than the cath lab. Leaders operate a centralized cloud AI-inference service (Cleerly, HeartFlow Plaque), so the compute concentrates in the vendor's GPU datacenter; a Category 1 CPT reimbursement ($950) is driving volume and new entrants. Heavy GPU inference plus large image-archive retention.
  scope_zh: 基于冠脉 CTA 的冠脉粥样硬化深度学习定量——按血管、按病变量化钙化 vs 非钙化/低密度（'软'、高危）斑块体积、狭窄分级及疾病分期，服务于预防心脏病学。这是形态学判读工作流，区别于 CFD 血流动力学 FFR 路径（尽管部分厂商也衍生基于斑块的缺血估算）。购买方为预防/影像心脏病学而非导管室。头部厂商以集中式云 AI 推理服务运行（Cleerly、HeartFlow Plaque），算力集中于厂商 GPU 数据中心；美国 1 类 CPT 报销（950 美元）正推动放量与新进入者。GPU 推理密集，叠加大规模影像归档留存。
