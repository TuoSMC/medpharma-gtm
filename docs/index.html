 logs (Joint Commission, VFC, CAP). Location-adjacent sensor telemetry rather than location tracking proper, but a genuinely distinct commercial segment served by dedicated pure-plays plus broad RTLS vendors.", "scope_zh": "对冰箱/冷冻柜、疫苗与血库、实验室及药房环境进行连续温湿度与压差监测，提供告警与审计级合规记录（Joint Commission、VFC、CAP）。属定位相邻的传感遥测而非定位追踪，但为独立的商业细分，有专营厂商与综合 RTLS 厂商共同服务，需长期存储合规数据。", "role": ["data-acquisition", "workflow", "analytics-artificial-intelligence"], "data_modality": ["time-series"], "hardware_profile": ["edge-industrial", "capacity-archive-storage"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["hospital-health-system", "diagnostic-reference-laboratory", "academic-medical-center"], "vendors": ["Sonicu", "Primex", "SmartSense by Digi", "CenTrak", "Securitas Healthcare"], "confidence": "A", "source": "Grand View / MarketsandMarkets RTLS application segmentation (environmental monitoring); CenTrak Environmental Monitoring page (NIST-traceable, VFC/CAP compliance); Sonicu, Primex, SmartSense product sites", "_deep": 0}, {"id": "pharmacy-automation-central-robotics-unit-dose", "parent": "pharmacy-automation", "name_en": "Central Pharmacy Dispensing Robotics & Unit-Dose Packaging", "name_zh": "中心药房调剂机器人与单剂量包装", "scope_en": "Inpatient central-pharmacy automation: high-density storage/retrieval robots, unit-dose repackaging, pouch/blister packagers, and carousels that pick and package oral solids for hospital medication carts. Compute is an embedded industrial controller per machine, backed by a pharmacy management server that orchestrates the robots and reconciles inventory with the EHR/ADC network.", "scope_zh": "住院部中心药房自动化：高密度存取机器人、单剂量重新包装、药袋/泡罩包装机，以及为医院药车拣选和包装口服固体制剂的旋转药柜。每台设备的算力是嵌入式工业控制器，后端由药房管理服务器编排机器人并与EHR/药柜网络对账库存。", "role": ["data-acquisition", "workflow", "integration"], "data_modality": ["transactional", "images"], "hardware_profile": ["edge-industrial", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "original-equipment-manufacturer", "segments": ["hospital-health-system"], "vendors": ["Omnicell (XR2)", "Swisslog Healthcare (BoxPicker, PillPick)", "BD (Rowa)", "ARxIUM", "Capsa Healthcare"], "confidence": "A", "source": "MarketsandMarkets Pharmacy Automation Systems Market; Mordor Intelligence Pharmacy Automation; Omnicell/Swisslog Healthcare/BD Rowa/ARxIUM vendor sites", "_deep": 2}, {"id": "pharmacy-automation-dispensing-cabinets-adc", "parent": "pharmacy-automation", "name_en": "Automated Dispensing Cabinets (ADC) & Enterprise Medication Management", "name_zh": "自动化调剂药柜(ADC)与企业级药品管理", "scope_en": "Decentralized point-of-care medication dispensing: networked, biometric ADCs on nursing units, tightly EHR-integrated, governed by an enterprise server that manages the cabinet fleet, controlled-substance workflows, par levels and audit trails. The distinct SMCI pull is the on-prem HA management/server tier (often shipped as a vendor appliance), not the cabinet itself.", "scope_zh": "分散式床旁药品调剂：护理单元上联网的生物识别自动药柜，与EHR紧密集成，由企业级服务器统一管理药柜集群、管制药品流程、库存基准和审计追踪。SMCI的独特机会在于本地高可用管理/服务器层（常作为厂商一体机交付），而非药柜本身。", "role": ["data-acquisition", "workflow", "integration", "infrastructure-platform"], "data_modality": ["transactional", "time-series"], "hardware_profile": ["edge-industrial", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "original-equipment-manufacturer", "segments": ["hospital-health-system"], "vendors": ["Omnicell (XT Automated Dispensing Cabinets)", "BD (Pyxis MedStation)", "ARxIUM (MedSelect Flex/Aspire)", "Capsa Healthcare (NexsysADC)"], "confidence": "A", "source": "Precedence Research / Grand View US Pharmacy Automation Devices; Omnicell XT and BD Pyxis MedStation product sites; ARxIUM MedSelect (Flex/Aspire) product pages (web-verified); industry note ~84% of hospital pharmacies use/plan ADCs", "_deep": 2}, {"id": "pharmacy-automation-iv-sterile-compounding-robotics", "parent": "pharmacy-automation", "name_en": "IV / Sterile & Hazardous-Drug Compounding Robotics", "name_zh": "静脉输液/无菌与危害药品配制机器人", "scope_en": "Robotic aseptic compounding of IV bags, syringes and hazardous (chemotherapy) preparations under USP <797>/<800>, NIOSH and OSHA, with gravimetric/volumetric and optical-recognition verification of dose accuracy. Compute is an embedded industrial controller running barcode + optical + gravimetric checks with pharmacist image review; no verified rack-server pull, so this is an OEM per-unit embedded opportunity rather than a data-center sale.", "scope_zh": "在USP <797>/<800>、NIOSH和OSHA规范下对静脉输液袋、注射器及危害性（化疗）制剂进行机器人无菌配制，配合重量/容量法与光学识别核验剂量准确性。算力为嵌入式工业控制器，运行条码+光学+重量核验并由药师复核图像；无经核实的机架服务器需求，故属于OEM单机嵌入式机会而非数据中心销售。", "role": ["data-acquisition", "workflow", "regulated-software-as-a-medical-device"], "data_modality": ["transactional", "images"], "hardware_profile": ["edge-industrial"], "hardware_opportunity": 2, "primary_buyer": "original-equipment-manufacturer", "segments": ["hospital-health-system"], "vendors": ["Omnicell (IVX Station)", "ARxIUM (RIVA)", "BD (Pyxis IV Prep / Cato)", "Baxter (DoseEdge)"], "confidence": "A", "source": "Towards Healthcare Automated Pharmacy Compounding Systems (robotics ~55% share 2024); Omnicell IVX Station press release/product page (web-verified: barcode + optical recognition + gravimetric); ARxIUM RIVA product page; Baxter DoseEdge", "_deep": 3}, {"id": "pharmacy-automation-retail-centralfill-highvolume", "parent": "pharmacy-automation", "name_en": "Retail / Central-Fill & High-Volume Prescription Fulfillment", "name_zh": "零售/集中配药与高通量处方履约", "scope_en": "High-throughput outpatient and mail-order fulfillment: robotic counting/labeling/capping cells, tote-conveyor and sortation lines, and the facility-scale order-management + control software that runs a central-fill or mail-order operation. This is the sub-market with the most genuine server footprint (order management, sortation control, WMS/GDP), sold as an operator co-sell to PBM/mail-order and retail-chain operators running the iron.", "scope_zh": "高通量门诊与邮购履约：机器人计数/贴标/封盖单元、料箱输送与分拣线，以及运行集中配药或邮购业务的设施级订单管理与控制软件。这是最具真实服务器占用的子市场（订单管理、分拣控制、WMS/GDP），以运营商联合销售模式面向运营自有硬件的PBM/邮购和零售连锁运营商。", "role": ["workflow", "integration", "infrastructure-platform"], "data_modality": ["transactional", "time-series"], "hardware_profile": ["edge-industrial", "high-availability-redundant", "nvme-performance-storage"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["hospital-health-system", "payer"], "vendors": ["ScriptPro", "Parata (BD Parata Max)", "iA (Innovation Associates)", "RxSafe", "Omnicell", "Cardinal Health"], "confidence": "A", "source": "Verified Market Research Top Central Fill Pharmacy Automation Companies; PRNewswire Central Fill Pharmacy Automation to 2030 (Omnicell, ARxIUM, ScriptPro, Cardinal, Parata); ScriptPro/Parata/RxSafe/iA vendor sites", "_deep": 2}, {"id": "pharmacy-automation-medication-diversion-intelligence", "parent": "pharmacy-automation", "name_en": "Medication Intelligence & Controlled-Substance Diversion Analytics", "name_zh": "药品智能与管制药品盗用分析", "scope_en": "ML/analytics software that reconciles dispense-administer-waste-return data across ADCs, EHR and inventory systems to score controlled-substance diversion risk and surveil the medication supply chain. Genuinely AI-driven and a real distinct submarket with its own vendors, but delivered almost entirely as hosted cloud SaaS — real ML compute, minimal on-prem SMCI pull (listed for completeness, not as a server opportunity).", "scope_zh": "机器学习/分析软件，跨自动药柜、EHR和库存系统对配发-给药-废弃-退回数据进行对账，为管制药品盗用风险评分并监控药品供应链。确属AI驱动且有独立厂商的真实子市场，但几乎完全以托管云SaaS交付——真实的ML算力，但本地SMCI需求极小（列出以求完整，而非服务器机会）。", "role": ["analytics-artificial-intelligence", "integration"], "data_modality": ["transactional", "time-series", "real-world-data"], "hardware_profile": [], "hardware_opportunity": 1, "primary_buyer": "operator", "segments": ["hospital-health-system"], "vendors": ["Bluesight (Kit Check / Medacist / Protenus)", "Wolters Kluwer (Invistics / Sentri7)", "BD (HealthSight Diversion Management)", "Imprivata", "HelioMetrics"], "confidence": "B", "source": "KLAS State of Drug Diversion Monitoring; RxPert Drug Diversion Monitoring Vendor Guide 2025; Bluesight/Kit Check, Wolters Kluwer Invistics, BD HealthSight product pages", "_deep": 0}, {"id": "medical-iot-security-clinical-visibility-ndr", "parent": "medical-iot-security", "name_en": "Clinical Network IoMT/OT Visibility & Network Detection", "name_zh": "臨床網路醫療物聯網/OT 可視化與網路偵測", "name_full": "Healthcare-Delivery-Organization IoMT/OT Asset Visibility, Risk Assessment & Network Detection & Response", "scope_en": "HDO-side platforms that passively discover, fingerprint and risk-score every connected medical/IoT/OT device on the clinical network via deep-packet inspection, then run behavioral anomaly detection and threat response. Dominant delivery is vendor-cloud SaaS fed by a lightweight (often virtual) on-prem SPAN/mirror collector; large or air-gapped HDOs can instead run collector plus analytics on-prem appliances retaining device telemetry and network flows.", "scope_zh": "醫療機構側平台，透過深度封包檢測被動發現、指紋識別並評分臨床網路上每一台連網醫療/IoT/OT 設備，再以行為異常偵測進行威脅偵測與回應。主流交付為廠商雲端 SaaS，搭配輕量（多為虛擬）的地端 SPAN/鏡像採集器；大型或氣隙醫療機構則可改採地端採集器加分析設備，保存設備遙測與網路流量。", "role": ["infrastructure-platform", "analytics-artificial-intelligence", "data-acquisition", "integration"], "data_modality": ["time-series", "artificial-intelligence-models"], "hardware_profile": ["edge-industrial", "nvme-performance-storage", "capacity-archive-storage"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Claroty (Medigate/xDome)", "Armis (ServiceNow)", "Asimily", "Ordr", "Forescout (CyberMDX)", "Palo Alto Networks (Medical IoT Security)", "Cynerio (Axonius)"], "confidence": "A", "source": "Mordor Intelligence Medical Device Cybersecurity Market; Gartner Peer Insights Medical Device Security Solutions; ServiceNow newsroom (Armis $7.75B, closed 2026) and Axonius newsroom/SecurityWeek (Cynerio ~$100M+, 2025) — verified. Visibility/discovery is the dominant layer; SMCI pull limited to the on-prem collector/analytics deployment mode (GPU claim dropped as over-reach; opportunity set to modest as most delivery is vendor-cloud SaaS).", "_deep": 2}, {"id": "medical-iot-security-microsegmentation-enforcement", "parent": "medical-iot-security", "name_en": "Clinical Device Microsegmentation & Enforcement", "name_zh": "臨床設備微分段與強制隔離", "name_full": "Healthcare Connected-Device Microsegmentation, Isolation & Zero-Trust Enforcement", "scope_en": "The protection/enforcement layer that isolates and contains connected medical devices — identity-based microsegmentation, NAC-driven policy enforcement and zero-trust containment that stops threats from reaching or spreading between devices. Enforcement rides on existing switching/NAC fabric and is delivered as SaaS/controller software, so there is essentially no dedicated SMCI iron.", "scope_zh": "保護/強制層，用於隔離與圍堵連網醫療設備——以身分為基礎的微分段、NAC 驅動的政策強制與零信任圍堵，阻止威脅到達設備或在設備間擴散。強制動作依附既有交換/NAC 網路架構，以 SaaS/控制器軟體交付，故基本上無專屬 SMCI 硬體需求。", "role": ["infrastructure-platform", "integration"], "data_modality": ["time-series"], "hardware_profile": [], "hardware_opportunity": 1, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Elisity", "TerraZone", "Cisco", "Zero Networks", "Claroty (xDome Secure)"], "confidence": "B", "source": "TerraZone/ORDR 2026 comparisons and Elisity 'Top Healthcare Cybersecurity Vendors' framing — market explicitly split into visibility/discovery vs protection/enforcement layers. Real distinct commercial layer but SaaS/controller-delivered with no SMCI hardware pull; heavy vendor overlap with the visibility child noted.", "_deep": 0}, {"id": "medical-iot-security-device-manufacturer-product-security", "parent": "medical-iot-security", "name_en": "Medical Device Manufacturer Product Security (SBOM/Vuln)", "name_zh": "醫療設備製造商產品安全（SBOM/漏洞）", "name_full": "OEM Pre-/Post-Market Product Security: SBOM, Vulnerability Management & Embedded Runtime Protection", "scope_en": "OEM-side tooling for medical device manufacturers to meet FDA/regulatory cybersecurity mandates: SBOM generation and management, binary/firmware composition analysis, pre- and post-market vulnerability monitoring, cryptography/PKI, and embedded on-device runtime protection. Distinct buyer (the device maker, not the hospital); delivered as vendor-hosted SaaS, so the firmware-analysis compute runs vendor-side and the buyer procures no SMCI iron.", "scope_zh": "面向醫療設備製造商的產品安全工具，用以滿足 FDA/法規網路安全要求：SBOM 產生與管理、二進位/韌體成分分析、上市前後漏洞監控、密碼學/PKI，以及嵌入式地端執行期防護。買家獨特（設備製造商而非醫院）；以廠商託管 SaaS 交付，韌體分析運算在廠商端執行，買方不採購 SMCI 硬體。", "role": ["workflow", "analytics-artificial-intelligence", "integration"], "data_modality": ["documents", "artificial-intelligence-models"], "hardware_profile": [], "hardware_opportunity": 1, "primary_buyer": "original-equipment-manufacturer", "segments": ["medical-technology-in-vitro-diagnostics", "biotechnology-pharmaceutical"], "vendors": ["MedCrypt (Helm)", "Cybellum", "Finite State", "Sternum"], "confidence": "B", "source": "Finite State / Cybellum / MedCrypt Helm / Sternum vendor sites; ABI Research SBOM for Medical Devices; FDA premarket/postmarket cybersecurity guidance — distinct OEM buyer confirmed. SaaS-delivered; firmware/binary analysis compute is vendor-cloud-side, so no SMCI customer-side hardware (proposed HPC-CPU profile removed).", "_deep": 0}, {"id": "hospital-bms-building-automation-hvac-controls", "parent": "hospital-bms", "name_en": "Building Automation System (BAS/BMS) — HVAC & Facility Controls", "name_zh": "楼宇自动化系统（BAS/BMS）——暖通空调与设施控制", "name_full": "Hospital Building Automation System — HVAC, pressure-relationship, lighting and life-safety supervisory control", "scope_en": "The core building-automation / supervisory-control layer that monitors and controls hospital HVAC, room pressure relationships (OR/isolation), chillers, lighting, medical-gas and life-safety equipment. Sold as edge controllers plus an on-premise supervisory server/workstation; in acute hospitals the supervisory server and network are typically deployed redundantly because loss of pressure/HVAC control is a patient-safety event.", "scope_zh": "楼宇自动化/监控层，监测并控制医院暖通空调、房间压差（手术室/隔离病房）、冷水机组、照明、医用气体及生命安全设备。以边缘控制器加本地监控服务器/工作站形式销售；在急症医院中，因失去压差/暖通控制属于患者安全事件，监控服务器与网络通常冗余部署。", "role": ["infrastructure-platform", "workflow", "data-acquisition"], "data_modality": ["time-series"], "hardware_profile": ["edge-industrial", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Johnson Controls (Metasys)", "Siemens (Desigo CC)", "Honeywell", "Schneider Electric (EcoStruxure Building Operation)", "Trane"], "confidence": "A", "source": "HFM Magazine 'Building control systems keep hospitals in sync'; Johnson Controls Healthcare BAS page; vendor product pages (Metasys, Desigo CC, EcoStruxure Building Operation)", "_deep": 2}, {"id": "hospital-bms-gxp-environmental-monitoring", "parent": "hospital-bms", "name_en": "GxP Environmental / Cold-Chain Monitoring System (EMS)", "name_zh": "GxP 环境与冷链监测系统（EMS）", "name_full": "Continuous environmental monitoring for regulated storage — temperature, humidity, differential pressure with 21 CFR Part 11 audit trail", "scope_en": "Continuous, validated monitoring of temperature, humidity and differential pressure for regulated storage in hospital pharmacy, clinical labs, blood banks and vaccine cold chain. Distinct from BAS: it is compliance software (FDA 21 CFR Part 11 / EU GMP Annex 11) with tamper-evident audit trails, alarming and long-term retention. Runs on wireless/wired sensor networks feeding an on-prem (e.g. viewLinc Enterprise Server) or hybrid time-series data store that must guarantee no data loss.", "scope_zh": "对医院药房、临床实验室、血库及疫苗冷链等受监管存储进行连续、经验证的温度、湿度、压差监测。区别于 BAS：这是合规软件（FDA 21 CFR Part 11 / EU GMP Annex 11），具备防篡改审计追踪、报警与长期保留。运行于无线/有线传感器网络，数据汇入必须保证不丢失的本地（如 viewLinc 企业服务器）或混合时序数据存储。", "role": ["data-acquisition", "system-of-record", "workflow"], "data_modality": ["time-series", "documents"], "hardware_profile": ["edge-industrial", "high-availability-redundant", "capacity-archive-storage"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["hospital-health-system", "diagnostic-reference-laboratory", "biotechnology-pharmaceutical", "academic-medical-center"], "vendors": ["Vaisala (viewLinc)", "Rees Scientific (Centron)", "Ellab", "ELPRO", "Kaye (Amphenol)", "Rotronic / Process Sensing Technologies"], "confidence": "A", "source": "Vaisala viewLinc CMS page (on-prem Enterprise Server vs cloud) and 21 CFR Part 11 application notes; Rees Scientific hospital pharmacy/blood-bank monitoring; Ellab, ELPRO, Rotronic RMS GxP pages", "_deep": 2}, {"id": "hospital-bms-building-analytics-fdd", "parent": "hospital-bms", "name_en": "Building Analytics / Fault Detection & Diagnostics (FDD)", "name_zh": "楼宇分析 / 故障检测与诊断（FDD）", "name_full": "Analytics overlay for automated fault detection, energy optimization and equipment diagnostics on hospital building systems", "scope_en": "An analytics/AI overlay that ingests BAS and meter data to automatically detect equipment faults, rank them by cost and patient-comfort impact, perform root-cause diagnosis and optimize energy. Real distinct vendors, but web-confirmed as predominantly hyperscaler-hosted cloud SaaS (Clockworks on Azure), so the SMCI pull is effectively nil — corrected to an empty hardware profile and minimal opportunity. Engagement, if any, is co-sell through the analytics operator (occasional on-prem historian), not direct hospital iron; this node is the honest 'no-play' edge of the parent.", "scope_zh": "一层分析/AI 叠加系统，接入 BAS 与计量数据，自动检测设备故障、按成本与患者舒适度影响排序、进行根因诊断并优化能耗。厂商真实且独立，但经核实主要以超大规模云托管 SaaS 交付（Clockworks 运行于 Azure），因此对 SMCI 的拉动实质为零——已更正为空硬件画像与最小机会。若有参与，为通过分析运营商联合销售（偶有本地历史库），并非医院直购硬件。", "role": ["analytics-artificial-intelligence", "workflow"], "data_modality": ["time-series", "artificial-intelligence-models"], "hardware_profile": [], "hardware_opportunity": 1, "primary_buyer": "operator", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Clockworks Analytics", "Cimetrics", "Schneider Electric (EcoStruxure Building Advisor)", "Johnson Controls (OpenBlue)", "Facilio"], "confidence": "B", "source": "Memoori Clockworks Analytics profile; Microsoft customer story (Clockworks on Azure); Clockworks hospital FDD case study 'When Failure Isn't an Option'; Cimetrics building analytics materials", "_deep": 0}, {"id": "capacity-command-center-bed-management-patient-placement", "parent": "capacity-command-center", "name_en": "Real-Time Bed Management & Patient Placement", "name_zh": "实时床位管理与患者安置", "name_full": "Real-Time Bed Management, Bed Board & Patient Placement Systems", "scope_en": "Transactional real-time bed board and patient-placement engines that track every bed's status (clean/dirty/occupied/isolation), match incoming patients to beds, and orchestrate ADT movement and environmental-services/transport requests. This is the operational system-of-record for bed state across a facility or campus, running 24/7 and historically deployed in the hospital data center (though vendors increasingly offer cloud variants).", "scope_zh": "以事务型实时床位看板与患者安置引擎为核心，跟踪每张床位状态（清洁/待清洁/占用/隔离），将入院患者匹配到床位，并协调ADT流转、环境清洁与转运请求。它是院区床位状态的运营系统级记录，全天候运行，传统上部署在医院数据中心（供应商亦日益提供云端版本）。", "role": ["system-of-record", "workflow", "integration"], "data_modality": ["transactional", "time-series"], "hardware_profile": ["high-availability-redundant", "nvme-performance-storage"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["TeleTracking", "Epic (Grand Central)", "Oracle Health / Cerner (Capacity Management)", "Care Logistics"], "confidence": "A", "source": "KLAS Patient Flow / Capacity Optimization Management 2023; IntuitionLabs Epic Grand Central profile; vendor sites (TeleTracking, Oracle Health)", "_deep": 0}, {"id": "capacity-command-center-transfer-center-patient-logistics", "parent": "capacity-command-center", "name_en": "Transfer Center & Patient Logistics Orchestration", "name_zh": "转诊中心与患者物流协调", "name_full": "Inter-Facility Transfer Center, On-Call Scheduling & Access Orchestration", "scope_en": "Centralized transfer-center platforms that coordinate inter- and intra-facility patient transfers, on-call physician scheduling, referral intake and system-level load balancing across a multi-hospital network. Owned by enterprise access/transfer teams (a distinct buyer from unit-level bed management); workflow-, telephony- and integration-heavy, increasingly delivered as cloud SaaS, so on-prem iron pull is light.", "scope_zh": "以集中式转诊中心平台协调院际与院内患者转运、值班医师排班、转诊受理，以及跨多院区网络的系统级负载均衡。由企业级接入/转诊团队负责（与病区级床位管理属不同买方）；以工作流、电话通信与集成为主，日益以云SaaS形式交付，本地硬件拉动较轻。", "role": ["workflow", "integration", "data-acquisition"], "data_modality": ["transactional", "documents"], "hardware_profile": ["high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Central Logic / ABOUT Healthcare", "TeleTracking", "Conduit Health Partners", "Epic (Transfer Center)"], "confidence": "A", "source": "Central Logic rebrand-to-ABOUT PR (Oct 2021, HIT Consultant); KLAS 'Central Logic (ABOUT Healthcare) Transfer Center' product review; HIT Consultant (Conduit Health Partners)", "_deep": 0}, {"id": "capacity-command-center-predictive-digital-twin-ai", "parent": "capacity-command-center", "name_en": "Predictive Capacity Command Center & Digital Twin", "name_zh": "预测式容量指挥中心与数字孪生", "name_full": "AI/ML Predictive Command Center, Forecasting & Operational Digital Twin", "scope_en": "The analytics-and-AI tier of the market: machine-learning demand/discharge forecasting, real-time command-center tiles, and probabilistic operational digital twins (discrete-event simulation) that model seasonal surges, staffing and surgical-schedule scenarios before acting. VERIFICATION CORRECTION: the marquee vendors deliver predominantly via cloud/hosted platforms — Qventus on AWS, TeleTracking+Palantir on Foundry/AIP, GE HealthCare Command Center as a ~5-month hosted engagement — and the workload is tabular time-series ML plus CPU simulation, not large-scale deep learning. The on-prem SMCI pull is therefore CPU/simulation compute plus fast storage, NOT a GPU flagship; it concentrates in large health systems that run their command-center/data platform (e.g., Palantir Foundry) in their own data center alongside legacy on-prem bed systems.", "scope_zh": "本市场中以分析与AI为重的层级：机器学习需求/出院预测、实时指挥中心指标块，以及在决策前以离散事件仿真模拟季节性高峰、人力与手术排程情景的概率型运营数字孪生。核验修正：主要供应商以云/托管平台交付（Qventus在AWS、TeleTracking+Palantir在Foundry/AIP、GE HealthCare指挥中心为约五个月的托管交付项目），且负载为表格型时间序列ML加CPU仿真，而非大规模深度学习。因此本地SMCI拉动为CPU/仿真算力加高速存储，而非GPU旗舰级，主要集中于在自有数据中心运行指挥中心/数据平台（如Palantir Foundry）并与本地遗留床位系统并存的大型医疗系统。", "role": ["analytics-artificial-intelligence", "workflow", "infrastructure-platform"], "data_modality": ["time-series", "simulation", "artificial-intelligence-models", "transactional"], "hardware_profile": ["high-performance-computing-cpu", "nvme-performance-storage"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["GE HealthCare (Command Center + Digital Twin)", "TeleTracking (Operations IQ + Palantir Foundry/AIP)", "Qventus", "LeanTaaS", "Oracle Health (Command Center)"], "confidence": "A", "source": "GE HealthCare Command Center / Digital Twin product pages (hosted ~5-mo engagement); TeleTracking-Palantir partnership PR (Jun 5 2025, Foundry/AIP); Qventus security page (AWS/SOC2/HIPAA); KLAS Capacity Optimization Management 2023 / Best in KLAS 2026", "_deep": 2}, {"id": "capacity-command-center-perioperative-or-infusion-optimization", "parent": "capacity-command-center", "name_en": "Perioperative OR & Infusion Capacity Optimization", "name_zh": "围手术期手术室与输注容量优化", "name_full": "OR Block/Utilization & Infusion Chair Capacity Optimization", "scope_en": "ML-driven asset-utilization optimization for the surgical services and infusion service lines — OR block release/exchange, robotic/room utilization and infusion-chair scheduling — sold to a distinct buyer (perioperative and cancer-center operations) rather than bed/flow teams. A recognized KLAS Capacity Optimization Management segment, but SaaS-light and delivered predominantly on public cloud (LeanTaaS/Qventus AWS-based), so its direct SMCI iron pull is minimal; included for completeness and marked accordingly.", "scope_zh": "面向手术服务与输注服务条线的ML驱动资产利用率优化——手术室时段释放/交换、机器人/手术间利用率与输注座椅排程——销售给不同买方（围手术期与肿瘤中心运营），而非床位/流转团队。属公认的KLAS容量优化管理细分，但偏轻量SaaS且主要以公有云交付（LeanTaaS/Qventus基于AWS），对SMCI硬件的直接拉动极小；为完整性纳入并如实标注。", "role": ["analytics-artificial-intelligence", "workflow"], "data_modality": ["time-series", "artificial-intelligence-models", "transactional"], "hardware_profile": [], "hardware_opportunity": 1, "primary_buyer": "operator", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["LeanTaaS (iQueue for Operating Rooms / Infusion Centers)", "Qventus (Perioperative)", "Hospital IQ (now LeanTaaS)"], "confidence": "B", "source": "KLAS Capacity Optimization Management 2023 / Best in KLAS 2026; LeanTaaS iQueue product materials; LeanTaaS acquisition of Hospital IQ (2022); Qventus newsroom (AWS-based SaaS)", "_deep": 0}, {"id": "ngs-lab-lims-enterprise-configurable-platform", "parent": "ngs-lab-lims", "name_en": "Enterprise Configurable Genomics LIMS (research core & biopharma)", "name_zh": "企業級可配置基因組學 LIMS（研究核心實驗室與生物製藥）", "name_full": "Enterprise configurable genomics/NGS LIMS platforms for high-throughput sequencing core labs, biopharma and CRO/CDMO genomics operations — sample accessioning, library-prep workflow enforcement, pooling/indexing, run scheduling and instrument integration", "scope_en": "Highly configurable LIMS/ELN platforms that run the wet-lab side of high-throughput NGS: sample accessioning and lineage, library-prep SOP enforcement, plate/pooling and index-clash management, sequencing-run scheduling, sample-sheet generation and bidirectional instrument integration. Sold to sequencing core labs, biopharma R&D and CRO/CDMO genomics groups. Workload is a transactional metadata/orchestration DB with HA; compute-heavy secondary analysis lives elsewhere.", "scope_zh": "高度可配置的 LIMS/ELN 平台，管理高通量 NGS 的濕實驗室環節：樣本登記與譜系追蹤、文庫製備 SOP 強制執行、微孔板/混樣與索引衝突管理、測序運行排程、樣本表生成及與儀器的雙向整合。客戶為測序核心實驗室、生物製藥研發及 CRO/CDMO 基因組學團隊。負載為交易型元數據/編排資料庫加高可用；重運算的二次分析不在此範疇。", "role": ["workflow", "system-of-record", "integration", "data-acquisition"], "data_modality": ["transactional", "documents", "omics"], "hardware_profile": ["high-availability-redundant", "nvme-performance-storage"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["biotechnology-pharmaceutical", "contract-research-organization", "academic-medical-center", "diagnostic-reference-laboratory"], "vendors": ["Illumina Clarity LIMS", "L7 Informatics (L7|ESP)", "Sapio Sciences", "LabVantage", "Thermo Fisher SampleManager", "Benchling"], "confidence": "A", "source": "Illumina Clarity LIMS product pages; L7 Informatics 2026 LIMS comparison (l7informatics.com); Sapio Sciences LIMS pages; genomics-LIMS roundups. Verified: distinct research/biopharma-core buyer; 6 named vendors all commercially active in NGS LIMS.", "_deep": 2}, {"id": "ngs-lab-lims-clinical-regulated-diagnostic", "parent": "ngs-lab-lims", "name_en": "Clinical / CLIA-Regulated Diagnostic NGS LIMS", "name_zh": "臨床/CLIA 監管的診斷級 NGS LIMS", "name_full": "CLIA/CAP-regulated NGS laboratory information management for molecular diagnostic and reference labs — validated wet-lab workflows, chain of custody, batch/QC gating and audit-ready run tracking for clinical sequencing (oncology, hereditary, infectious disease)", "scope_en": "NGS LIMS purpose-built for regulated clinical diagnostic sequencing (CLIA/CAP, oncology/hereditary/ID panels): validated and locked wet-lab workflows, full chain of custody and sample lineage, QC/batch gating before sequencing, and audit-ready run and reagent-lot tracking. Distinct buyer (clinical molecular labs, reference labs, hospital molecular pathology) and distinct regulatory posture from research LIMS — confirmed by clinical-only vendors such as Sunquest/Clinisys Mitogen. Transactional workload with strong HA/DR and long-term audit retention; interpretation/reporting sits in a separate tertiary market.", "scope_zh": "專為受監管的臨床診斷測序（CLIA/CAP，腫瘤/遺傳/感染病 panel）打造的 NGS LIMS：經驗證並鎖定的濕實驗室流程、完整樣本監管鏈與譜系、測序前 QC/批次放行，以及可審計的運行與試劑批次追蹤。買方（臨床分子實驗室、參比實驗室、醫院分子病理）與監管要求均與研究型 LIMS 不同，Sunquest/Clinisys Mitogen 等臨床專用廠商證實此區隔。負載為交易型，強調高可用/災備與長期審計留存；解讀/報告屬於獨立的三級市場。", "role": ["workflow", "system-of-record", "integration"], "data_modality": ["transactional", "documents", "omics"], "hardware_profile": ["high-availability-redundant", "disaster-recovery-backup", "nvme-performance-storage"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["diagnostic-reference-laboratory", "hospital-health-system", "academic-medical-center"], "vendors": ["Illumina Clarity LIMS (Clinical / GenoLogics)", "L7 Informatics", "Sapio Sciences (clinical diagnostics)", "Sunquest / Clinisys Mitogen"], "confidence": "B", "source": "GenoLogics/Illumina Clarity LIMS for CLIA-certified NGS (Technology Networks, GenomeWeb); Sapio clinical-diagnostics LIMS pages; L7 Informatics regulated-lab positioning; Sunquest/Clinisys Mitogen molecular-diagnostics platform. Split from child 1 confirmed by clinical-only vendor (Mitogen) + CLIA/CAP regulatory posture.", "_deep": 2}, {"id": "ngs-lab-lims-sequencer-run-control-basecalling", "parent": "ngs-lab-lims", "name_en": "Sequencer Run-Control & Live Basecalling Software", "name_zh": "測序儀運行控制與實時鹼基識別軟體", "name_full": "Instrument-vendor run-control and primary-analysis software (sequencer control, real-time basecalling/demultiplexing) — the run-management layer physically adjacent to the sequencer, pulling GPU/edge compute (Dorado)", "scope_en": "The run-management/primary-analysis layer that drives the sequencer itself: instrument control, real-time signal-to-basecall conversion and on-instrument demultiplexing. This is the ONE NGS-LIMS sub-market with a genuine SMCI GPU pull — Oxford Nanopore Dorado requires an NVIDIA GPU (Pascal+, ≥8GB vRAM; optimized for A100/H100) for live/re-basecalling, so labs buy GPU/edge servers adjacent to the sequencer for off-instrument or higher-throughput basecalling. (Illumina DRAGEN is FPGA-accelerated rather than NVIDIA-GPU, so the GPU-server story rests on Nanopore.) The OEM-integrated path (GridION/PromethION) uses ONT's own compute and is NOT an SMCI BOM; the SMCI-relevant buyer is the lab purchasing its own GPU iron.", "scope_zh": "驅動測序儀本身的運行控制/一次分析層：儀器控制、實時信號到鹼基的轉換及儀器端拆分。這是 NGS-LIMS 中唯一具備真正 SMCI GPU 拉動的子市場——Oxford Nanopore 的 Dorado 需 NVIDIA GPU（Pascal 以上、8GB+ 顯存，A100/H100 最佳化）進行實時/重新鹼基識別，實驗室因而在測序儀旁採購 GPU/邊緣伺服器以進行離線或高通量鹼基識別。（Illumina DRAGEN 為 FPGA 加速而非 NVIDIA GPU，故 GPU 伺服器機會主要來自 Nanopore。）OEM 整合路徑（GridION/PromethION）使用 ONT 自有運算，並非 SMCI BOM；SMCI 相關買方為自購 GPU 硬體的實驗室。", "role": ["data-acquisition", "analytics-artificial-intelligence", "infrastructure-platform"], "data_modality": ["omics", "time-series", "artificial-intelligence-models"], "hardware_profile": ["gpu-server", "edge-industrial", "nvme-performance-storage"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["academic-medical-center", "biotechnology-pharmaceutical", "diagnostic-reference-laboratory", "medical-technology-in-vitro-diagnostics"], "vendors": ["Oxford Nanopore (MinKNOW / Dorado)", "PacBio (SMRT Link)", "Illumina (Local Run Manager / DRAGEN)", "Thermo Fisher (Ion Torrent Suite)"], "confidence": "A", "source": "Oxford Nanopore Dorado GPU requirements CONFIRMED via nanoporetech/dorado GitHub + HPC docs (≥8GB VRAM, Pascal+, A100/H100 optimized); Illumina DRAGEN/Local Run Manager; PacBio SMRT Link server docs; Thermo Ion Torrent Suite. Note DRAGEN=FPGA not NVIDIA GPU.", "_deep": 1}, {"id": "ngs-lab-lims-opensource-academic-core", "parent": "ngs-lab-lims", "name_en": "Open-Source / Self-Hosted Academic Core-Lab NGS LIMS", "name_zh": "開源/自托管的學術核心實驗室 NGS LIMS", "name_full": "Open-source and self-hosted NGS LIMS for academic sequencing cores — sample submission portals, library/run tracking and reporting deployed on customer-owned on-prem servers (MISO, iSkyLIMS, GNomEx)", "scope_en": "Free/open-source, self-hosted LIMS used by academic and hospital sequencing cores to run submission portals, library and run tracking, statistics and bioinformatics-service request management. Deployed on customer-owned on-prem servers rather than SaaS — the strongest on-prem footprint in this parent (a modest but direct SMCI iron pull per core). Distinct academic buyer and distinct commercial model (open-source, integrator/institute-supported rather than sold) from the enterprise platforms. Caveat: 'vendors' here are OSS projects, not commercial sellers.", "scope_zh": "學術與醫院測序核心實驗室使用的免費/開源自托管 LIMS，運行送樣門戶、文庫與運行追蹤、統計及生物信息服務請求管理。部署於客戶自有的本地伺服器而非 SaaS，是本父市場中最強的本地佔用（每個核心實驗室帶來適度但直接的 SMCI 硬體拉動）。買方（學術）與商業模式（開源、由整合商/機構支持而非銷售）均有別於企業級平台。注意：此處「廠商」為開源項目而非商業銷售方。", "role": ["workflow", "system-of-record", "data-acquisition", "integration"], "data_modality": ["transactional", "omics", "documents"], "hardware_profile": ["nvme-performance-storage", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["academic-medical-center", "diagnostic-reference-laboratory"], "vendors": ["MISO LIMS (Earlham Institute; now maintained by OICR)", "iSkyLIMS (BU-ISCIII)", "GNomEx (HCI / GenoLogics origin, legacy)"], "confidence": "B", "source": "MISO LIMS GitHub/readthedocs (miso-lims, GPLv3, OICR-maintained); iSkyLIMS (BU-ISCIII, LIMSWiki); GNomEx open-source genomics LIMS (HCI). All three CONFIRMED real. Caveat: OSS projects, not commercial vendors — retained for genuine on-prem SMCI angle + distinct academic buyer.", "_deep": 3}, {"id": "clinical-genomics-reporting-somatic-oncology", "parent": "clinical-genomics-reporting", "name_en": "Somatic / Oncology Variant Interpretation & Reporting", "name_zh": "体细胞/肿瘤变异解读与报告", "name_full": "Somatic / Oncology NGS Variant Interpretation, Therapy & Trial Matching, and Clinical Reporting", "scope_en": "Tertiary-analysis platforms that classify tumor-profiling somatic variants (SNV/CNV/fusion/TMB/MSI), assign oncogenicity/tier per AMP/ASCO/CAP and ClinGen-CGC-VICC, match to therapies and clinical trials, and generate the signed molecular-oncology report. Buyers are molecular oncology and pathology labs. Predominantly cloud SaaS; large reference/pathology labs and pharma companion-diagnostic programs deploy on-prem or dedicated-tenant.", "scope_zh": "对肿瘤体细胞变异（点突变/拷贝数/融合/TMB/MSI）进行分类分级（AMP/ASCO/CAP、ClinGen-CGC-VICC致癌性指南）、匹配靶向治疗与临床试验并生成分子肿瘤报告的三级分析平台。买方为分子肿瘤与病理实验室；以云SaaS为主，大型参比/病理实验室及药企伴随诊断项目采用本地或专属部署。", "role": ["workflow", "analytics-artificial-intelligence"], "data_modality": ["omics", "documents", "artificial-intelligence-models"], "hardware_profile": ["nvme-performance-storage", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["diagnostic-reference-laboratory", "academic-medical-center", "hospital-health-system", "medical-technology-in-vitro-diagnostics"], "vendors": ["QIAGEN QCI Interpret", "PierianDx (Velsera)", "Roche NAVIFY Mutation Profiler", "Fabric Genomics", "Golden Helix VSClinical"], "confidence": "B", "source": "QIAGEN Digital Insights clinical-insights portfolio (QCI Interpret somatic); Pierian/Velsera merger (GenomeWeb); Roche NAVIFY Mutation Profiler product page (active 2025); AMP/ASCO/CAP consensus PMC5707196; ClinGen/CGC/VICC oncogenicity S1098360022000016; PMC11949535 tertiary-platform comparison.", "_deep": 1}, {"id": "clinical-genomics-reporting-germline-hereditary", "parent": "clinical-genomics-reporting", "name_en": "Germline / Hereditary Rare-Disease Interpretation & Reporting", "name_zh": "胚系/遗传罕见病变异解读与报告", "name_full": "Germline Variant Interpretation, Phenotype-Driven Prioritization (HPO) and Rare-Disease Clinical Reporting", "scope_en": "Tertiary-analysis platforms for germline/hereditary testing that ingest a proband (and trio) VCF plus HPO phenotype terms, apply explainable-AI/ML variant prioritization, auto-score ACMG/AMP pathogenicity criteria, and produce the diagnostic report. Buyers are clinical-genetics and rare-disease labs. Cloud SaaS dominant; national genomic-medicine programs and sovereign settings drive on-prem/dedicated deployment, and the AI prioritization carries a GPU pull.", "scope_zh": "面向胚系/遗传检测的三级分析平台：输入先证者（及三人组）VCF与HPO表型词，采用可解释AI/ML进行变异优先级排序、按ACMG/AMP自动打分并生成诊断报告。买方为临床遗传与罕见病实验室。以云SaaS为主；国家基因组医学计划与主权化部署推动本地化，AI排序带来GPU需求。", "role": ["workflow", "analytics-artificial-intelligence"], "data_modality": ["omics", "documents", "artificial-intelligence-models"], "hardware_profile": ["gpu-server", "nvme-performance-storage", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["diagnostic-reference-laboratory", "academic-medical-center", "hospital-health-system"], "vendors": ["Congenica", "Illumina Emedgene", "Genoox Franklin (QIAGEN)", "Fabric Genomics", "Golden Helix VSClinical"], "confidence": "B", "source": "Illumina Emedgene germline product page (explainable-AI, HPO-driven); Congenica AI ranking; Fabric Genomics Phevor phenotype prioritization; QIAGEN acquisition of Genoox/Franklin CONFIRMED May 2025 (BusinessWire/QIAGEN newsroom, $70M); PMC11976766 genotype-phenotype AI diagnostic-yield.", "_deep": 2}, {"id": "clinical-genomics-reporting-knowledge-base-annotation", "parent": "clinical-genomics-reporting", "name_en": "Variant Knowledge-Base & Annotation Engine", "name_zh": "变异知识库与注释引擎", "name_full": "Clinical Variant Knowledge Base, Literature-Mined Evidence and Annotation Engine (cross-referenced datasource layer)", "scope_en": "The curated cross-referenced knowledge/annotation layer sold as a distinct product beneath interpretation UIs: aggregated clinical datasources (ClinVar, gnomAD, OncoKB, CKB), literature-mined variant evidence and proprietary curated databases queried via UI/API. Distinct from the reporting workflow — many labs and biopharma license the KB/annotation engine and run it on-prem or dedicated-tenant to keep patient data isolated, which drives the real storage, memory and HA pull in this parent.", "scope_zh": "在解读界面之下、作为独立产品销售的策展交叉引用知识/注释层：聚合临床数据源（ClinVar、gnomAD、OncoKB、CKB）、文献挖掘的变异证据与专有策展数据库，经UI/API查询。与报告工作流不同——众多实验室与生物制药以本地/专属方式部署KB与注释引擎以隔离患者数据，构成本父类中真正的存储、内存与高可用需求。", "role": ["integration", "analytics-artificial-intelligence"], "data_modality": ["omics", "documents", "real-world-data"], "hardware_profile": ["nvme-performance-storage", "capacity-archive-storage", "high-memory", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["diagnostic-reference-laboratory", "academic-medical-center", "biotechnology-pharmaceutical", "medical-technology-in-vitro-diagnostics"], "vendors": ["Saphetor VarSome Clinical", "Genomenon Mastermind", "QIAGEN HGMD", "SOPHiA GENETICS Alamut", "MSK OncoKB"], "confidence": "B", "source": "VarSome Clinical (150+ datasources, regional cloud/on-prem deployments); Genomenon Mastermind (literature-mined, integrated into Fabric/Congenica); QIAGEN HGMD; SOPHiA GENETICS Alamut (ex-Interactive Biosoftware); MSK OncoKB precision-oncology KB; PMC8574624 knowledge-bases review (OncoKB, CIViC, HGMD).", "_deep": 2}, {"id": "rd-lab-informatics-eln-experiment-documentation", "parent": "rd-lab-informatics", "name_en": "Electronic Lab Notebook (ELN) — Experiment Documentation & Collaboration", "name_zh": "电子实验记录本（实验记录与协作）", "name_full": "Electronic Lab N let ARCHIVE_LOADED=false, _archiveWaiters=[];
function loadArchive(cb){
  if(ARCHIVE_LOADED){cb&&cb();return;}
  _archiveWaiters.push(cb);
  if(_archiveWaiters.length>1)return;                 // a load is already in flight — just queue the cb
  const done=()=>{ARCHIVE_LOADED=true;const w=_archiveWaiters;_archiveWaiters=[];w.forEach(f=>f&&f());};
  const sc=document.createElement('script');sc.src='taxonomy_tree.js';
  sc.onload=()=>{(window.__ARCHIVE__||[]).forEach(x=>{if(!SUBBYID[x.id]){SUBCATS.push(x);SUBBYID[x.id]=x;}});done();};
  sc.onerror=()=>{done();};                            // archive missing/blocked — keep L1-only, don't crash
  document.head.appendChild(sc);
}

function hqParse(v){
  const hq=v.headquarters; if(!hq)return {region:'Unknown',country:null,state:null};
  const toks=String(hq).split(',').map(t=>t.replace(/[)]/g,'').trim()).filter(Boolean);
  const last=toks.length?toks[toks.length-1]:'';
  const isUS=/\b(USA|United States)\b/.test(hq)||US_STATES_SET.has(last);
  if(isUS){let st=null;for(let i=toks.length-1;i>=0;i--){if(US_STATES_SET.has(toks[i])){st=toks[i];break;}}return {region:'North America',country:'USA',state:st};}
  if(last==='Canada'||last==='Mexico')return {region:'North America',country:last,state:null};
  if(EU_SET.has(last))return {region:'Europe',country:last,state:null};
  if(APAC_SET.has(last))return {region:'Asia-Pacific',country:last,state:null};
  if(ME_SET.has(last))return {region:'Middle East',country:last,state:null};
  if(/United States/.test(hq))return {region:'North America',country:'USA',state:null};
  return {region:'Other',country:last||null,state:null};
}

// bundle-fit score (0-100): hardware pull (the anchor) + coverage breadth + US share + Fortune + US-region
function bundleScore(v){
  const val=vendorVal(v);
  const hw=Math.min(1,(val.flag*2+val.hot)/6);
  const cover=coverageOf(v);
  const cov=Math.min(1,cover.length/3);
  const share=usShareOf(v);
  const sh=Math.min(1,(share||0)/50);
  const f=fortuneOf(v);
  const ft=f?((FORT_WT[f.list]||0)/3):0;
  const p=hqParse(v);
  const rg=p.country==='USA'?1:(p.region==='North America'?0.7:0.3);
  const score=Math.round(hw*35+cov*20+sh*20+ft*15+rg*10);
  return {score,hw,cov,sh,ft,rg,val,cover,region:p.region,state:p.state,country:p.country,fort:f,share};
}

  function treeNodeInto(container,obj,depth){

  function groupsOf(c,axis){
    if(axis==='hardware_opportunity')return [String(c.hardware_opportunity)];
    if(axis==='bucket')return [bucketOf(c)];
    if(axis==='primary_buyer')return [c.primary_buyer];
    if(axis==='hardware_buyer')return c.hardware_buyer.slice();
    if(axis==='play')return (c.plays&&c.plays.length)?c.plays.slice():['(no play)'];
    if(axis==='hardware_profile')return (c.hardware_profile&&c.hardware_profile.length)?c.hardware_profile.slice():['(no hardware)'];
    if(axis==='domain')return [c.domain];
    if(axis==='compute')return [computeClassOf(c)];
    if(axis==='ai')return [isAI(c)?T('AI-driven','AI 驅動'):T('No-AI','非 AI')];
    return (c[axis]||[]).slice();
  }

  function render(){
    const bk=fBucket.value,seg2=fSeg.value,
          hw=+fHw.value||0,cmp=fCompute.value,gp=fGroup.value,q=fTxt.value.toLowerCase();
    const shown=cats.filter(c=>{
      if(catFilter&&!catFilter.includes(c.id))return false;
      if(hotFilter&&(c.hardware_opportunity_by_buyer[hotFilter.buyer]||0)<hotFilter.min)return false;
      if(cmp&&computeClassOf(c)!==cmp)return false;
      if(bk&&bucketOf(c)!==bk)return false;
      if(seg2&&!(c.segments||[]).includes(seg2))return false;
      if(hw&&c.hardware_opportunity<hw)return false;
      if(q&&!((c.name_en+' '+c.name_zh+' '+(c.infrastructure_notes||'')).toLowerCase().includes(q)))return false;
      return true;
    });
    clear(treePane);
    cnt.textContent=shown.length+' / '+cats.length+T(' shown',' 顯示')+(hotFilter?' · HOT_'+hotFilter.buyer:'');
    // auto-collapse groups when browsing many; keep open when narrowed, and always open the group holding the selected category
    const sel=(selected&&shown.find(c=>c.id===selected.id))||shown[0]||null;
    const openIf=list=>shown.length<=12||(sel&&list.indexOf(sel)>=0);
    if(gp==='play'){playTree(shown);}   // the Play spine — its own 4-level renderer (Play→AI/No-AI→category→子市場)
    else if(gp==='stakeholder'){STAKE.forEach(([k,lab])=>{const li=shown.filter(c=>stakeKey(c)===k);l1node(lab,li,false,openIf(li));});}

function vfMatch(v){

    if(VF.fortune==='any'){if(!f)return false;}

    else if(!f||f.list!==VF.fortune)return false;}
  if(VF.cover.size){const cov=new Set(coverageOf(v));let ok=false;VF.cover.forEach(k=>{if(cov.has(k))ok=true;});if(!ok)return false;}
  if(VF.share){const sh=usShareOf(v);if(VF.share==='has'){if(sh==null)return false;}else if(sh==null||sh<+VF.share)return false;}

  if(VF.rich&&richnessOf(v).tier!==VF.rich)return false;
  return true;
}

    ['leaderboards',T('Leaderboards','榜單'),renderLeaderboardsInto]],'registry');
}
function goVendorsBoard(){goTab('vendors');if(_vendorsNav)_vendorsNav.pick('leaderboards');}

// ================= i18n wiring: render all tabs + language toggle =================
const TAB_ZH={taxonomy:'探索',method:'方法',vendors:'廠商'};
function relabelTabs(){TABS.forEach(([id,label])=>{if(NAVBTN[id])NAVBTN[id].textContent=LANG==='zh'?(TAB_ZH[id]||label):label;});}
function renderAll(){setBuilt();renderTaxonomy();renderMethod();renderVendors();}
renderAll();
$('#langtog').onclick=()=>{LANG=(LANG==='zh')?'en':'zh';$('#langtog').textContent=(LANG==='zh')?'EN':'中文';relabelTabs();renderAll();window.scrollTo(0,0);};
// deep-link restore: opening a shared #v/… URL lands on the Vendors tab with that filtered view applied
if((location.hash||'').indexOf('#v/')===0){goTab('vendors');if(window._restoreVendorView)window._restoreVendorView();}
</script>
