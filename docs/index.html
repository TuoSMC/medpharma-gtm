<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMCI MedPharma GTM Playbook</title>
<style>
:root{
  /* neutrals — whisper-cool (hue 255), instrument feel */
  --bg:oklch(0.984 0.004 255); --panel:oklch(1 0 0); --ink:oklch(0.27 0.013 255); --muted:oklch(0.47 0.014 255); --line:oklch(0.905 0.006 255);
  --accent:oklch(0.55 0.16 255); --accentbg:oklch(0.955 0.028 255);
  /* semantic shelf — equal weight, hue-only variation, so meanings read as one system */
  --hw1:oklch(0.62 0.02 255); --hw2:oklch(0.60 0.14 255); --hw3:oklch(0.66 0.15 60); --hw4:oklch(0.575 0.18 25);
  --u-crit:oklch(0.575 0.18 25); --u-high:oklch(0.66 0.15 60); --u-med:oklch(0.72 0.13 90); --u-low:oklch(0.60 0.02 255);
  --a:oklch(0.56 0.15 150); --b:oklch(0.55 0.16 290); --c:oklch(0.62 0.16 50); --d:oklch(0.57 0.10 200);
  /* design tokens (P2 unified system) — snapped scales; 0 pre-existing --s* usages so redefining shifts nothing until each ad-hoc px is migrated */
  --s0:2px; --s1:4px; --s2:6px; --s3:8px; --s4:12px; --s5:16px; --s6:24px;   /* spacing — instrument-dense */
  --r-tag:6px; --r-card:12px; --r-pill:999px; --r-dot:50%;                   /* radius — hard-fact / surface / round / circle */
  --f-1:10px; --f-2:11px; --f-3:12px; --f-4:13px; --f-5:14px; --f-6:15px;    /* type ramp — half-px noise removed */
  --f-d1:17px; --f-d2:24px; --f-d3:40px;                                     /* display sizes */
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:oklch(0.20 0.012 255); --panel:oklch(0.245 0.014 255); --ink:oklch(0.94 0.008 255); --muted:oklch(0.705 0.016 255); --line:oklch(0.325 0.014 255);
    --accent:oklch(0.72 0.13 255); --accentbg:oklch(0.315 0.05 255);
    --hw1:oklch(0.63 0.02 255); --hw2:oklch(0.68 0.13 255); --hw3:oklch(0.73 0.14 60); --hw4:oklch(0.665 0.17 25);
    --u-crit:oklch(0.665 0.17 25); --u-high:oklch(0.73 0.14 60); --u-med:oklch(0.79 0.12 90); --u-low:oklch(0.66 0.02 255);
    --a:oklch(0.68 0.15 150); --b:oklch(0.665 0.15 290); --c:oklch(0.70 0.15 50); --d:oklch(0.66 0.10 200);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang TC","Microsoft JhengHei",sans-serif;
  font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* functional micro-motion only (no decoration); honor reduced-motion */
button,summary,a,.trow,.pitem,.mkitem,.prow,.lplay,.ldoor,.dchip,.sfstage,.vn,.pcat,.msn,.tnode{
  transition:background-color .14s cubic-bezier(.22,1,.36,1),border-color .14s cubic-bezier(.22,1,.36,1),color .14s cubic-bezier(.22,1,.36,1)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-tag)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
header{padding:var(--s6) clamp(16px,3vw,44px);border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:var(--f-d1);letter-spacing:.2px}
.sub{color:var(--muted);font-size:var(--f-3);margin-top:3px}
.byline{color:var(--ink);font-size:var(--f-3);font-weight:700;margin-top:4px;letter-spacing:.2px}
nav{display:flex;gap:var(--s1);flex-wrap:wrap;padding:var(--s4) clamp(16px,3vw,44px) 0;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:61px;z-index:5}
nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;
  padding:var(--s3) var(--s5);border-radius:var(--r-tag) var(--r-tag) 0 0;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);background:var(--accentbg)}
main{max-width:none;margin:0 auto;padding:var(--s6) clamp(16px,3vw,44px) 60px}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:var(--s4)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s5) 15px}
.card h3{margin:0 0 2px;font-size:var(--f-5)}
.zh{color:var(--muted);font-size:var(--f-3);margin-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);margin:5px 0}
.chip{font-size:var(--f-2);padding:var(--s0) var(--s3);border-radius:var(--r-pill);background:var(--accentbg);color:var(--accent);white-space:nowrap}
.chip.dim{background:transparent;border:1px solid var(--line);color:var(--muted)}
.hwc{font-size:var(--f-1);padding:var(--s0) var(--s3);border-radius:var(--r-tag);background:var(--accentbg);color:var(--accent);font-weight:600;white-space:nowrap}
.tagk{font-size:var(--f-1);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:4px;align-self:center}
.hw{display:inline-block;min-width:20px;text-align:center;font-weight:700;color:#fff;border-radius:var(--r-tag);padding:var(--s0) var(--s3);font-size:var(--f-2)}
.hw1{background:var(--hw1)}.hw2{background:var(--hw2)}.hw3{background:var(--hw3)}.hw4{background:var(--hw4)}
.bkt{font-size:var(--f-1);font-weight:700;padding:var(--s0) var(--s3);border-radius:var(--r-tag);text-transform:uppercase;letter-spacing:.4px}
.bon{background:var(--a);color:#fff}
.bcl{background:transparent;border:1px solid var(--line);color:var(--muted)}
.by{font-size:var(--f-1);font-weight:700;padding:var(--s0) var(--s3);border-radius:var(--r-tag);color:#fff;text-transform:uppercase;letter-spacing:.3px}
.bcust{background:var(--a)}.boper{background:var(--b)}.boem{background:var(--c)}.bhyp{background:var(--hw1)}
.byo{font-size:var(--f-1);padding:var(--s0) var(--s2);border-radius:var(--r-pill);border:1px solid var(--line);color:var(--muted)}
.rollup{font-size:var(--f-3);margin:-6px 0 12px;color:var(--muted)}
.rollup b{color:var(--ink)}
.ckbox{display:inline-flex;align-items:center;gap:var(--s2);font-size:var(--f-3);color:var(--muted);border:1px solid var(--line);border-radius:var(--r-tag);padding:var(--s2) var(--s3)}
.grouphdr{font-size:var(--f-4);font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:var(--s3);border-bottom:1px solid var(--line);padding-bottom:6px}
.subhdr{font-size:var(--f-2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:10px 0 6px}
.backbtn{position:sticky;top:64px;z-index:6;align-items:center;gap:var(--s1);font-family:inherit;font-size:var(--f-3);font-weight:600;color:var(--accent);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-tag);padding:var(--s2) var(--s4);cursor:pointer;margin:2px 0 6px}
.backbtn:hover{border-color:var(--accent);background:var(--accentbg)}
.twopane{display:grid;grid-template-columns:minmax(300px,5fr) 7fr;gap:var(--s5);align-items:start;margin-top:6px}
@media(max-width:840px){.twopane{grid-template-columns:1fr}}
.tree{font-size:var(--f-4);min-width:0}
.detail{position:sticky;top:118px}
@media(max-width:840px){.detail{position:static}}
.tnode{display:flex;align-items:center;gap:var(--s3);font-weight:700;cursor:pointer;padding:var(--s3) 0 var(--s2);border-bottom:1px solid var(--line);margin-top:10px}
.tnode .tcar{color:var(--accent);font-size:var(--f-1);width:10px}
.tnode .tcount{color:var(--muted);font-weight:600;font-size:var(--f-3)}
.tnode .tflag{font-size:var(--f-1);font-weight:700;color:var(--hw4);border:1px solid var(--hw4);border-radius:var(--r-tag);padding:0 var(--s2)}
.tnode .thot{font-size:var(--f-1);font-weight:700;color:var(--a);border:1px solid var(--a);border-radius:var(--r-tag);padding:0 var(--s2)}
.vflag{font-size:var(--f-1);font-weight:700;color:var(--hw4);border:1px solid var(--hw4);border-radius:var(--r-tag);padding:0 var(--s2)}
.vhot{font-size:var(--f-1);font-weight:700;color:var(--a);border:1px solid var(--a);border-radius:var(--r-tag);padding:0 var(--s2)}
.master{border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s4) var(--s5);margin:4px 0 16px;background:var(--panel)}
.master h3{font-size:var(--f-6)}
.mkpi{display:flex;flex-wrap:wrap;gap:var(--s6);margin:8px 0 6px}
.mk{display:flex;flex-direction:column;line-height:1.05}
.mk b{font-size:var(--f-d2)}.mk span{font-size:var(--f-2);color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.mk.k-flag b{color:var(--hw4)}.mk.k-hot b{color:var(--a)}.mk.k-lead b{color:var(--accent)}
.msec{margin:4px 0 0;border-top:1px solid var(--line);padding-top:4px}
.msec>summary{font-size:var(--f-2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);cursor:pointer;list-style:none;padding:var(--s2) 0}
.msec>summary::-webkit-details-marker{display:none}
.msec>summary::before{content:"\25be  ";color:var(--accent)}
.msec:not([open])>summary::before{content:"\25b8  "}
.mrow{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s3);padding:var(--s2) var(--s2);border-radius:var(--r-tag);font-size:var(--f-4)}
.mrow:hover{background:var(--accentbg)}
.mlabel{flex:1 1 200px;min-width:150px;overflow-wrap:anywhere;font-weight:600}
.mbadges{display:flex;gap:var(--s2);flex:0 0 auto}
.mtop{display:flex;flex-wrap:wrap;gap:var(--s1);justify-content:flex-end;flex:1 1 220px}
/* legend: defines + links the 3 signals (count lives here too) */
.mlegend{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);margin:10px 0 8px}
@media(max-width:760px){.mlegend{grid-template-columns:1fr}}
.mleg{border:1px solid var(--line);border-radius:var(--r-tag);padding:var(--s3) var(--s4);background:var(--bg)}
.mleg.g-flag{border-color:color-mix(in oklch,var(--hw4) 45%,var(--line))}.mleg.g-hot{border-color:color-mix(in oklch,var(--a) 45%,var(--line))}.mleg.g-lead{border-color:color-mix(in oklch,var(--accent) 45%,var(--line))}
.mleg.g-flag .llab{color:var(--hw4)}.mleg.g-hot .llab{color:var(--a)}.mleg.g-lead .llab{color:var(--accent)}
.mleg .lh{display:flex;align-items:baseline;gap:var(--s3)}
.mleg .ln{font-size:var(--f-d2);font-weight:800;line-height:1}
.mleg.g-flag .ln{color:var(--hw4)}.mleg.g-hot .ln{color:var(--a)}.mleg.g-lead .ln{color:var(--accent)}
.mleg .llab{font-weight:700;font-size:var(--f-4)}
.mleg .lv{margin-left:auto;font-size:var(--f-1);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);border:1px solid var(--line);border-radius:var(--r-pill);padding:var(--s0) var(--s3);white-space:nowrap}
.mleg .ld{font-size:var(--f-2);color:var(--muted);margin-top:5px;line-height:1.4}
.mleg .lq{font-size:var(--f-2);font-weight:600;margin-top:4px}
.mleg.g-flag .lq{color:var(--hw4)}.mleg.g-hot .lq{color:var(--a)}.mleg.g-lead .lq{color:var(--accent)}
.mpath{font-size:var(--f-3);color:var(--muted);background:var(--accentbg);border-radius:var(--r-tag);padding:var(--s3) var(--s4);margin:0 0 6px;line-height:1.5}
.mpath b{color:var(--ink)}
/* pipeline: aligned opportunity matrix per play */
.play-h{display:flex;align-items:baseline;gap:var(--s4);margin:14px 0 5px;flex-wrap:wrap}
.play-h .pl{font-weight:700;font-size:var(--f-4)}
.play-h .ps{font-size:var(--f-2);color:var(--muted)}
.ptbl{display:grid;grid-template-columns:minmax(min(150px,40%),1.25fr) minmax(min(140px,40%),2fr) auto;border:1px solid var(--line);border-radius:var(--r-tag);overflow:hidden}
.ptbl .ph{font-size:var(--f-1);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);background:var(--panel);padding:var(--s2) var(--s4);border-bottom:1px solid var(--line)}
.ptbl .pc{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);font-size:var(--f-3);display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;min-width:0}
.ptbl .pc.last{border-bottom:none}
.pcat{font-weight:600;cursor:pointer;overflow-wrap:anywhere}
.pcat:hover{color:var(--accent)}
.pc .cb{font-size:var(--f-1);font-weight:700;border-radius:var(--r-tag);padding:0 var(--s2);white-space:nowrap;text-transform:uppercase;letter-spacing:.3px}
.pc .cb.f{color:var(--hw4);border:1px solid var(--hw4)}.pc .cb.h{color:var(--a);border:1px solid var(--a)}
.pven{color:var(--muted);overflow-wrap:anywhere}.pven b{color:var(--ink);font-weight:600}
.prank{justify-content:flex-end;text-align:right}
.prank .rb{font-size:var(--f-1);font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:var(--r-tag);padding:0 var(--s2);white-space:nowrap}
.prank .rn{font-size:var(--f-1);color:var(--muted);white-space:nowrap}
.tbody{padding-left:2px}
.tsub{font-size:var(--f-1);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:8px 0 3px}
.trow{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-radius:var(--r-tag);cursor:pointer}
.trow:hover{background:var(--accentbg)}
.trow:hover{background:var(--accentbg)}
.trow.sel{background:var(--accentbg);box-shadow:inset 3px 0 0 var(--accent)}
.trow .tname{flex:1;min-width:0;overflow-wrap:anywhere}
.trow .tby{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.tby.bcust{background:var(--a)}.tby.boper{background:var(--b)}.tby.boem{background:var(--c)}.tby.bhyp{background:var(--muted)}
/* Play spine — the 4-level accordion (Play → AI/No-AI → category → 子市場): progressive indent + sub caret */
.tnode.l1play{margin-top:6px}
.tnode.l2ai{margin-top:3px;padding-left:14px;font-size:var(--f-3);font-weight:600;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);border-bottom:1px dashed var(--line)}
.tnode.l2ai .tcar{color:var(--muted)}
.trow.l3cat{padding-left:16px}
.tcar.sub{color:var(--accent);cursor:pointer;width:12px;text-align:center}
.tcar.sub:hover{color:var(--ink)}
.tcar.ph{width:12px;visibility:hidden}
.l4wrap{padding-left:8px;margin-left:24px;border-left:1px solid var(--line)}
.trow.l4sub{padding:2px var(--s3);font-size:var(--f-3);opacity:.92}
.trow.l4sub .tname{font-weight:500}
@keyframes subhitflash{0%{background:var(--hw4);color:#fff}100%{background:transparent}}
.subhit{animation:subhitflash 1.5s ease-out}
/* sub-market detail card — breadcrumb up the tree (root category › … › this node) */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:var(--f-2);margin-bottom:4px}
.crumb .crumblink{color:var(--accent);cursor:pointer;overflow-wrap:anywhere}
.crumb .crumblink:hover{text-decoration:underline}
.crumb .crumbcur{color:var(--muted);font-weight:600;overflow-wrap:anywhere}
.crumb .crumbsep{color:var(--muted)}
.tiers6{margin:12px 0}
.tier6{display:grid;grid-template-columns:92px 1fr;gap:var(--s4);padding:var(--s3) 0 var(--s3) var(--s5);position:relative;border-left:1px solid var(--line)}
.tier6:before{content:"";position:absolute;left:-5px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.tier6 .tlab{font-size:var(--f-2);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding-top:2px}
.tier6 .tcont{font-size:var(--f-4);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.flowstrip{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1)}
.fbox{border:1px solid var(--accent);color:var(--accent);border-radius:var(--r-tag);padding:var(--s0) var(--s3);font-size:var(--f-3);background:var(--accentbg)}
.farrow{color:var(--muted);font-weight:700}
.dsec{margin:14px 0}
.subcard{border:1px solid var(--line);border-radius:var(--r-card);padding:var(--s3);margin:var(--s2) 0;background:var(--panel)}
.subcard>.row:first-child{margin-top:0}
/* vendor-intel — one full-width ROW per vendor; intel vendors expand a bordered drawer.
   NOTE: uses .vintel-list (NOT .vlist — that class is owned by the Vendors-tab registry column). */
.vintel-list{display:flex;flex-direction:column;gap:var(--s1);margin-top:var(--s1)}
.vitem{border:1px solid var(--line);border-radius:var(--r-tag);background:var(--panel);overflow:hidden}
.vitem.plain{border-style:dashed;background:transparent}
.vrow2{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3)}
.vitem.has-intel .vrow2{cursor:pointer}
.vitem.has-intel .vrow2:hover{background:var(--accentbg)}
.vrow2 .vcar{flex:0 0 auto;width:10px;color:var(--accent);font-size:var(--f-1)}
.vrow2 .vnm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:var(--f-2)}
.vitem.plain .vnm{font-weight:400;color:var(--muted)}
.vintelbox{border-top:1px solid var(--line);background:var(--bg);padding:var(--s3)}
.vintelbox .vir{display:flex;gap:var(--s3);margin:var(--s1) 0;font-size:var(--f-2)}
.vintelbox .vir:first-child{margin-top:0}
.vintelbox .vil{flex:0 0 76px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-size:var(--f-1);font-weight:700;padding-top:2px}
.vintelbox .viv{flex:1;min-width:0;overflow-wrap:anywhere}
.vintelbox .viprod{margin:2px 0}
.isvtag{font-size:var(--f-1);font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:var(--s0) var(--s2);border-radius:var(--r-tag);background:var(--accentbg);color:var(--accent)}
.depbadge{font-size:var(--f-1);font-weight:700;padding:var(--s0) var(--s2);border-radius:var(--r-tag);color:#fff;flex:0 0 auto;white-space:nowrap}
.depbadge.dep-onprem{background:var(--hw4)}.depbadge.dep-hybrid{background:var(--hw3)}.depbadge.dep-cloud{background:var(--muted)}.depbadge.dep-unk{background:var(--line);color:var(--muted)}
.basisbadge{font-size:var(--f-1);margin-left:4px;padding:0 var(--s1);border-radius:var(--r-tag);border:1px solid var(--muted);color:var(--muted);text-transform:uppercase}
/* collapsible sub-market subcards in the category detail — kills the tall wall + the click conflict */
.subhd{display:flex;align-items:center;gap:var(--s2);cursor:pointer;flex-wrap:wrap}
.subhd .scar{flex:0 0 auto;width:10px;color:var(--accent);font-size:var(--f-1)}
.subhd .snm{font-weight:700;font-size:var(--f-4);flex:1;min-width:140px}
.subhd:hover .snm{color:var(--accent)}
.subcnt{font-size:var(--f-1);color:var(--muted);white-space:nowrap}
.subbody{margin-top:var(--s2)}
.drilllink{display:inline-block;margin-top:var(--s2);font-size:var(--f-2);color:var(--accent);cursor:pointer;font-weight:600}
.drilllink:hover{text-decoration:underline}
.dsec .dsh{font-size:var(--f-2);font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px}
/* battle card: the actionable sell layer at the top of a category */
.battle{border-radius:var(--r-card);background:var(--accentbg);padding:var(--s4) 13px;margin:10px 0 6px}
.brow{display:grid;grid-template-columns:104px 1fr;gap:var(--s4);align-items:baseline;padding:var(--s2) 0}
.brow+.brow{border-top:1px solid var(--line)}
.blab{font-size:var(--f-1);font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--muted)}
.bval{font-size:var(--f-3);line-height:1.45}
.rarch{display:flex;flex-wrap:wrap;gap:var(--s2)}
.raxx{font-size:var(--f-2);font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:var(--r-tag);padding:var(--s0) var(--s3)}

formance-storage": "rack", "capacity-archive-storage": "cluster"}, "plays": ["play-b"], "vendors": ["dnanexus", "illumina", "nvidia", "qiagen", "sentieon", "seqera", "velsera"], "evidence_note": null, "workload_envelope": {"scaling_driver": "genomes sequenced per week and per-sample coverage depth", "gpu_role": "mixed", "capacity_band": "petabyte-plus", "availability_class": "standard", "latency_class": "batch", "data_growth": "explosive", "io_pattern": "high-throughput-parallel", "concurrency": "high", "retention_horizon": null, "per_unit_data_size": {"value_low": 80, "value_high": 200, "unit": "GB per human whole-genome sample, aligned BAM through full fileset", "confidence": "C", "source": "massgenomics.org, 'Brace Yourself for Large-Scale Whole Genome Sequencing' (2014) — http://massgenomics.org/2014/11/brace-yourself-for-large-scale-whole-genome-sequencing.html"}, "sources": ["massgenomics.org, 'Brace Yourself for Large-Scale Whole Genome Sequencing' (2014) — http://massgenomics.org/2014/11/brace-yourself-for-large-scale-whole-genome-sequencing.html"], "notes": null}, "detail": {"purpose_en": "Turns raw sequencer output into biological meaning — aligning reads to a reference genome and calling variants (secondary analysis), then annotating and interpreting them at cohort scale (tertiary). It exists because sequencers emit terabytes of raw reads that are useless until computationally processed into variant calls and insight.", "purpose_zh": "將定序儀輸出的原始序列讀段轉化為生物學意義——比對到參考基因組並進行變異點判讀（二級分析），再於世代層級進行註釋與詮釋（三級分析）。定序儀產生數TB原始讀段，必須經運算處理成變異結果與洞見才有價值，此為其存在原因。", "smci_en": "HPC CPU-dense compute nodes handle alignment and variant calling, paired with GPU servers for accelerated callers and ML, NVMe all-flash for pipeline scratch, and high-capacity archive JBOD for cohort storage — sized as a cluster.", "smci_zh": "以HPC高密度CPU運算節點負責比對與變異判讀，搭配GPU伺服器加速判讀與機器學習，NVMe全快閃作為流程暫存，並以大容量歸檔JBOD存放世代資料——以叢集規模部署。", "tech_en": "CPU-heavy alignment and variant-calling pipelines (BWA/GATK-style) run alongside GPU-accelerated callers; large NVMe scratch absorbs the burst I/O of pipeline runs while object and capacity storage hold reference genomes and cohort archives. It mixes CPU-HPC and GPU nodes and becomes a cloud-repatriation candidate once load is sustained.", "tech_zh": "以CPU為主的比對與變異判讀流程（BWA/GATK類）搭配GPU加速判讀器；流程執行時以大容量NVMe暫存承接爆發式I/O，物件與容量儲存存放參考基因組與世代資料庫。混合CPU-HPC與GPU節點，負載持續時為雲端回遷候選。", "usage_flow": [{"en": "Ingest raw reads (BCL/FASTQ)", "zh": "匯入原始讀段 (BCL/FASTQ)"}, {"en": "Align to reference genome", "zh": "比對參考基因組"}, {"en": "Call variants (secondary)", "zh": "變異點判讀（二級）"}, {"en": "Annotate & filter (tertiary)", "zh": "註釋與過濾（三級）"}, {"en": "Store & hand off curated calls", "zh": "儲存並交付判讀結果"}]}}, {"id": "mes-ebr", "name_en": "MES / EBR (Manufacturing Execution)", "name_zh": "製造執行系統 / 電子批次紀錄", "name_full": "Manufacturing Execution System / Electronic Batch Record", "domain": "manufacturing-quality-supply-chain", "home_stakeholder": "other", "lifecycle": ["manufacturing"], "role": ["system-of-record", "workflow"], "data_modality": ["transactional", "time-series", "documents"], "deployment": ["on-premises", "edge", "private-cloud", "software-as-a-service"], "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization", "medical-technology-in-vitro-diagnostics"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3, "operator": 1}, "infrastructure_notes": "Redundant plant server pairs, industrial edge per line, DR site; GxP/Part 11 → validated-change documentation is part of the sale", "hardware_profile": ["edge-industrial", "high-availability-redundant", "disaster-recovery-backup"], "hardware_profile_sizing": {"edge-industrial": "node", "high-availability-redundant": "node", "disaster-recovery-backup": "node"}, "plays": ["play-c"], "vendors": ["critical-manufacturing", "emerson", "koerber", "mastercontrol", "rockwell-automation", "siemens", "tulip-interfaces"], "evidence_note": null, "workload_envelope": {"scaling_driver": "concurrent production lines and electronic-batch-record steps executed per shift", "gpu_role": "none", "capacity_band": "none", "availability_class": "mission-critical", "latency_class": "real-time", "data_growth": "moderate", "io_pattern": "random-transactional", "concurrency": "moderate", "retention_horizon": "medium", "per_unit_data_size": null, "sources": ["FDA 21 CFR 211.180 — any production, control, or distribution record specifically associated with a batch shall be retained for at least one year after the batch expiration date (eCFR: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-C/part-211/subpart-J/section-211.180)"], "notes": null}, "detail": {"purpose_en": "A Manufacturing Execution System with Electronic Batch Record digitizes and enforces the recipe on the shop floor, guiding operators step by step through each production batch and capturing a complete, review-by-exception electronic record. It exists to replace paper batch records, enforce GxP compliance, and prove every batch was made right.", "purpose_zh": "製造執行系統（MES）搭配電子批次紀錄（EBR），將配方數位化並在生產現場強制執行，逐步引導操作員完成每一批次生產，同時擷取完整、可「例外審查」的電子紀錄。其存在目的是取代紙本批次紀錄、落實 GxP 法規遵循，並證明每一批次都依規範製造。", "smci_en": "Fits redundant HA server pairs per plant plus rugged industrial-edge nodes at each line, backed by a DR/backup node at a second site; typically sized at the node/pair level rather than large clusters. Because it is GxP/Part 11, a controlled BOM and validated-change documentation ship with the hardware.", "smci_zh": "適配每廠一組高可用（HA）冗餘伺服器對，加上每條產線的強固型工業邊緣節點，並於異地配置一台 DR/備份節點；規模多為節點／伺服器對層級，而非大型叢集。因屬 GxP/Part 11 環境，硬體須隨附受控 BOM 與驗證變更文件。", "tech_en": "As a system-of-record and workflow engine, MES/EBR runs a transactional database of recipes, orders and material genealogy, ingests time-series parameters from equipment and process control, and stores review documents and e-signatures under 21 CFR Part 11. It integrates downward to SCADA/PLC/historian and upward to ERP, and must run continuously with deterministic response so a line never stalls.", "tech_zh": "作為紀錄系統與工作流程引擎，MES/EBR 維護配方、工單與物料譜系的交易型資料庫，從設備與製程控制擷取時序參數，並依 21 CFR Part 11 儲存審查文件與電子簽章。它向下整合 SCADA/PLC/歷史資料庫、向上整合 ERP，且須以確定性反應持續運行，避免產線停擺。", "usage_flow": [{"en": "Author & release recipe", "zh": "編寫並發放配方"}, {"en": "Execute batch steps on line", "zh": "產線逐步執行批次"}, {"en": "Capture data & e-signatures", "zh": "擷取數據與電子簽章"}, {"en": "Review by exception", "zh": "例外審查"}, {"en": "Release & archive batch record", "zh": "放行並歸檔批次紀錄"}]}}, {"id": "ehr-emr-core", "name_en": "EHR/EMR Core System", "name_zh": "電子病歷核心系統（EHR/EMR）", "name_full": "Electronic Health Record / Electronic Medical Record Core System", "domain": "hospital-clinical-core", "home_stakeholder": "doctor", "lifecycle": ["clinical"], "role": ["system-of-record", "workflow"], "data_modality": ["transactional", "documents"], "deployment": ["on-premises", "private-cloud", "hybrid", "vendor-managed"], "segments": ["hospital-health-system", "academic-medical-center"], "hospital_view": {"stakeholder": ["patient", "clinician"], "dimension": ["clinical", "admin"]}, "hardware_opportunity": 4, "hardware_buyer": ["customer", "operator"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 4, "operator": 4}, "infrastructure_notes": "Large HA database clusters, virtualization/VDI farms for clinician access, and full DR sites; sized by bed count, concurrent users, and uptime SLAs. Refresh cycles and DR site builds are the main deal triggers.", "hardware_profile": ["nvme-performance-storage", "high-availability-redundant", "disaster-recovery-backup"], "hardware_profile_sizing": {"nvme-performance-storage": "rack", "high-availability-redundant": "cluster", "disaster-recovery-backup": "rack"}, "plays": ["play-d"], "vendors": ["altera-digital-health", "athenahealth", "athenahealth-2", "dedalus", "eclinicalworks", "epic-systems", "greenway", "meditech", "modmed", "netsmart", "nextech", "oracle-health", "veradigm", "wellsky"], "evidence_note": null, "workload_envelope": {"scaling_driver": "concurrent clinicians and staffed bed count", "gpu_role": "none", "capacity_band": "hundreds-of-terabytes", "availability_class": "mission-critical", "latency_class": "interactive", "data_growth": "moderate", "io_pattern": "random-transactional", "concurrency": "high", "retention_horizon": "long", "per_unit_data_size": null, "sources": ["42 CFR 482.24(b)(1) CMS Condition of Participation: Medical record services — hospitals must retain medical records at least five years (eCFR: https://www.ecfr.gov/current/title-42/chapter-IV/subchapter-G/part-482/subpart-C/section-482.24)"], "notes": null}, "detail": {"purpose_en": "The central patient record and clinical workflow system for the health system — orders, results, notes, medication and documentation — and the transactional system of record for patient data across the enterprise.", "purpose_zh": "全院核心病歷與臨床作業系統，統整醫囑、檢驗結果、病歷紀錄、給藥與臨床文件，是全院病人資料的交易型記錄系統。", "smci_en": "HA-redundant database cluster nodes backed by NVMe all-flash for the transactional DB, virtualization hosts for the VDI farm, and a DR-site server pair; scaling from rack to cluster. Refresh cycles and DR-site builds are the main deal triggers.", "smci_zh": "交易資料庫採用搭配 NVMe 全快閃的高可用備援叢集節點，另配虛擬化／VDI 主機與異地備援站點的伺服器對，規模由機櫃到叢集；汰換週期與異地備援站建置是主要商機切入點。", "tech_en": "A large transactional relational database runs on high-availability clusters, fronted by virtualization/VDI farms for clinician access and integration engines for data exchange. DR replication and strict uptime SLAs are mandatory; capacity is sized by concurrent users, staffed bed count and refresh cycles.", "tech_zh": "以大型交易型關聯資料庫執行於高可用叢集，前端搭配虛擬化／VDI 農場供臨床端存取，並以整合引擎進行資料交換；具異地備援複寫與嚴格的可用性 SLA，容量依同時上線人數、床數與汰換週期決定。", "usage_flow": [{"en": "Clinician logs in", "zh": "醫師登入"}, {"en": "Order/document at point of care", "zh": "於照護端下醫囑或紀錄"}, {"en": "Transactional DB commit", "zh": "交易資料庫寫入"}, {"en": "Exchange via HL7/FHIR", "zh": "以 HL7/FHIR 整合交換"}, {"en": "Replicate to DR site", "zh": "複寫至異地備援"}]}}, {"id": "cdss-clinical-ai", "name_en": "Clinical Decision Support & Clinical AI (CDSS)", "name_zh": "臨床決策支援系統（CDSS）與臨床人工智慧應用", "name_full": "Clinical Decision Support System and Clinical Artificial Intelligence Applications", "domain": "hospital-clinical-core", "home_stakeholder": "doctor", "lifecycle": ["clinical"], "role": ["analytics-artificial-intelligence", "workflow", "regulated-software-as-a-medical-device"], "data_modality": ["transactional", "documents", "artificial-intelligence-models"], "deployment": ["software-as-a-service", "hybrid", "on-premises"], "segments": ["hospital-health-system", "academic-medical-center"], "hospital_view": {"stakeholder": ["clinician"], "dimension": ["clinical"]}, "hardware_opportunity": 3, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "operator", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 2, "operator": 3}, "infrastructure_notes": "Mostly rides on EHR or cloud infrastructure; emerging pull is on-prem GPU inference nodes where PHI rules force local hosting of clinical LLM/ambient-AI workloads. Sized by inference concurrency, not data volume.", "hardware_profile": ["gpu-server"], "hardware_profile_sizing": {"gpu-server": "node"}, "plays": ["play-a"], "vendors": ["abridge", "aidoc", "ambience", "corti", "deepscribe", "microsoft-nuance", "nabla", "suki", "wolters-kluwer-health"], "evidence_note": null, "workload_envelope": {"scaling_driver": "concurrent inference requests and number of deployed clinical models", "gpu_role": "inference", "capacity_band": "none", "availability_class": "standard", "latency_class": "interactive", "data_growth": "low", "io_pattern": "random-transactional", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": null}, "detail": {"purpose_en": "Delivers alerts, guideline recommendations and AI predictions (risk scores, ambient clinical documentation, clinical LLMs) into the clinician's workflow at the point of care to support clinical decisions.", "purpose_zh": "在照護現場把警示、指引建議與 AI 預測（風險評分、環境式病歷記錄、臨床大型語言模型）帶入臨床工作流程，協助臨床決策。", "smci_en": "Single- or multi-GPU inference server nodes to host clinical models and LLMs locally where PHI forbids the cloud; starts at node scale and grows to a small cluster as the number of deployed models rises.", "smci_zh": "在 PHI 禁止上雲時，以單／多 GPU 推論伺服器節點在本地承載臨床模型與 LLM；由節點級起步，隨部署模型數增加擴展為小型叢集。", "tech_en": "Combines rules engines with ML models and LLMs. It mostly rides on EHR or cloud infrastructure, but PHI rules increasingly force on-prem GPU inference nodes to host clinical LLM and ambient-AI workloads locally. Sizing is driven by inference concurrency and the number of deployed models, not by data volume.", "tech_zh": "結合規則引擎與機器學習模型及大型語言模型；多半依附於 EHR 或雲端，但 PHI（受保護健康資訊）規範日益要求以本地端 GPU 推論節點承載臨床 LLM 與環境式 AI；規模取決於推論並行量與部署模型數，而非資料量。", "usage_flow": [{"en": "Pull EHR context", "zh": "擷取病歷情境"}, {"en": "Run model inference", "zh": "執行模型推論"}, {"en": "Generate alert/recommendation", "zh": "產生警示或建議"}, {"en": "Surface in EHR workflow", "zh": "於病歷流程呈現"}, {"en": "Clinician acts + feeds back", "zh": "醫師採取行動與回饋"}]}}, {"id": "ris-cvis-workflow", "name_en": "Radiology & Cardiology Information Systems (RIS/CVIS)", "name_zh": "放射科資訊系統與心血管資訊系統（RIS/CVIS）", "name_full": "Radiology Information System and Cardiovascular Information System", "domain": "hospital-clinical-core", "home_stakeholder": "doctor", "lifecycle": ["clinical"], "role": ["workflow", "system-of-record", "data-acquisition", "integration"], "data_modality": ["transactional", "images", "time-series", "documents"], "deployment": ["on-premises", "private-cloud", "hybrid"], "segments": ["hospital-health-system", "academic-medical-center"], "hospital_view": {"stakeholder": ["clinician", "devi d": "terabyte", "availability_class": "high-availability", "latency_class": "real-time", "data_growth": "moderate", "io_pattern": "sequential-throughput", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": null}, "detail": {"purpose_en": "A central-station monitoring and clinical surveillance system that continuously ingests bedside physiological waveforms and vitals across ICU and monitored beds, driving alarms and early-warning analytics.", "purpose_zh": "中央監視站與臨床監測系統，持續擷取加護病房與監測床位的床邊生理波形與生命徵象，驅動警報與早期預警分析。", "smci_en": "HA-redundant server pairs with an NVMe fast tier for waveform ingest, plus industrial edge gateways at the bedside/unit; node/pair scale. The larger motion is an OEM design-win through the monitoring device maker; hospital-owned surveillance analytics is the smaller direct pull.", "smci_zh": "以高可用備援伺服器對搭配 NVMe 高速層承載波形匯入，並在床邊／單位配置工業級邊緣閘道；節點／伺服器對規模。最大宗機會是透過監測儀器廠商的 OEM 設計導入，醫院自有的監測分析則屬較小的直接商機。", "tech_en": "Redundant on-prem server pairs and bedside/edge gateways ingest continuous high-rate waveforms; HA is mandatory because downtime is a patient-safety event. Sized by monitored-bed count and waveform retention. Central-station servers are usually OEM-supplied by the monitoring vendor as part of the FDA-cleared system.", "tech_zh": "以冗餘的本地伺服器對與床邊／邊緣閘道匯入高取樣率的連續波形；因停機即屬病安事件，高可用為必要；規模依監測床數與波形保存決定；中央站伺服器通常由監測儀器廠商作為 FDA 核准系統的一部分供應。", "usage_flow": [{"en": "Bedside devices stream waveforms", "zh": "床邊裝置串流波形"}, {"en": "Edge gateway ingest", "zh": "邊緣閘道匯入"}, {"en": "Central HA server store", "zh": "中央高可用伺服器儲存"}, {"en": "Surveillance analytics + alarms", "zh": "監測分析與警報"}, {"en": "Notify clinician", "zh": "通知臨床端"}]}}, {"id": "telehealth-platform", "name_en": "Telehealth / Virtual Care Platform", "name_zh": "遠距醫療與虛擬照護平台", "name_full": "Telehealth and Virtual Care Platform", "domain": "hospital-clinical-core", "home_stakeholder": "patient", "lifecycle": ["clinical"], "role": ["workflow", "integration"], "data tera", "epic-systems", "intelichart", "klara", "luma-health", "meditech", "notable", "oracle-health", "relatient", "simple-interact", "solutionreach"], "evidence_note": null, "workload_envelope": {"scaling_driver": "registered patient count and peak concurrent portal login burst", "gpu_role": "none", "capacity_band": "none", "availability_class": "best-effort", "latency_class": "interactive", "data_growth": "low", "io_pattern": "light", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": null}, "detail": {"purpose_en": "A patient portal and engagement platform gives patients online self-service access to their records, test results, appointment requests, secure messaging, and bill payment, extending the health system's front door beyond the clinic. It exists to raise patient satisfaction, deflect call-center load, and meet patient-access requirements.", "purpose_zh": "病患入口網站與互動平台讓病患透過線上自助方式查閱病歷、檢驗結果、預約掛號、安全訊息往來與帳單繳費，把醫療體系的「大門」延伸到院外。它的存在是為了提升病患滿意度、減輕客服中心負荷，並滿足病患資料存取的法規要求。", "smci_en": "Hardware pull at the customer is minimal and SaaS-diluted; where a hospital self-hosts the DMZ web/app tier, a small pair of general-purpose rack or multi-node servers with HA is sufficient, node-scale rather than rack- or cluster-scale.", "smci_zh": "此類在客戶端的硬體需求極小且因 SaaS 化而稀釋；若醫院自建 DMZ Web/應用層，僅需一組小型通用型機架或多節點伺服器搭配高可用配置即可，屬節點級規模，而非機架或叢集級。", "tech_en": "The platform is a web/mobile application tier holding mostly transactional records and documents, integrating to the EHR/HIS over HL7/FHIR APIs so it renders data rather than owning it. It is overwhelmingly delivered as multi-tenant SaaS on public cloud; where a hospital self-hosts, only a small web/app (DMZ) front-end tier tethers to the on-prem HIS, sized by registered-patient count and peak login bursts.", "tech_zh": "此平台是一層 Web/行動應用，主要承載交易紀錄與文件，透過 HL7/FHIR 介面與電子病歷/HIS 整合，因此是「呈現」資料而非「持有」資料。它絕大多數以多租戶 SaaS 形式部署於公有雲；少數醫院自建時，也僅是一層對外（DMZ）Web/應用前端銜接院內 HIS，規模取決於註冊病患數與登入尖峰併發量。", "usage_flow": [{"en": "Patient registers / logs in", "zh": "病患註冊或登入"}, {"en": "Portal pulls data from EHR/HIS", "zh": "入口從電子病歷/HIS 拉取資料"}, {"en": "Patient views results & messages", "zh": "病患查閱結果與訊息"}, {"en": "Books appointments / pays bills", "zh": "預約掛號、線上繳費"}, {"en": "Actions sync back to source systems", "zh": "操作同步回源系統"}]}}, {"id": "patient-access-scheduling", "name_en": "Patient Access & Scheduling", "name_zh": "掛號排程與報到叫號", "name_full": "Patient Access and Scheduling", "domain": "hospital-business-administration", "home_stakeholder": "patient", "lifecycle": ["clinical", "commercial"], "role": ["workflow", "integration"], "data_modality": ["transactional"], "deployment": ["on-premises", "software-as-a-service", "hybrid"], "segments": ["hospital-health-system", "academic-medical-center", "diagnostic-reference-laboratory"], "hospital_view": {"stakeholder": ["patient", "facility"], "dimension": ["business", "ops"]}, "hardware_opportunity": 2, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 2, "operator": 2}, "infrastructure_notes": "Runs as HA VMs alongside the HIS/EHR; check-in kiosks, queue displays and ticketing terminals are edge endpoints. Sizing driven by daily outpatient visit volume and the morning registration peak — downtime is front-door visible, so HA is non-negotiable.", "hardware_profile": ["high-availability-redundant"], "hardware_profile_sizing": {"high-availability-redundant": "node"}, "plays": ["play-d"], "vendors": ["epic-systems", "experian-health", "kyruus-health", "luma-health", "meditech", "phreesia"], "evidence_note": null, "workload_envelope": {"scaling_driver": "daily outpatient visit volume and morning registration peak concurrency", "gpu_role": "none", "capacity_band": "none", "availability_class": "high-availability", "latency_class": "interactive", "data_growth": "low", "io_pattern": "random-transactional", "concurrency": "high", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": null}, "detail": {"purpose_en": "Patient access and scheduling software manages the front-of-house flow: appointment booking, registration, check-in, insurance eligibility, and queue management across outpatient and diagnostic settings. It exists to keep the patient's entry point running smoothly and to feed clean encounter data into downstream clinical and billing systems.", "purpose_zh": "病患准入與排程軟體負責「前台」流程：預約掛號、報到、身分/保險資格核驗與候診叫號管理，涵蓋門診與檢查各場景。它的存在是為了讓病患的入口環節順暢運作，並把乾淨的就診資料送往後端臨床與計費系統。", "smci_en": "Fits a small high-availability redundant server pair (general-purpose or virtualization rack nodes) co-located with the HIS/EHR — node-scale — because a front-door outage is immediately visible, so HA rather than raw capacity is the sizing constraint.", "smci_zh": "適合一組小型高可用冗餘伺服器對（通用型或虛擬化機架節點），與 HIS/EHR 並置部署，屬節點級規模；因為前台停機會立即被病患察覺，故決定規格的是高可用而非原始容量。", "tech_en": "This is a transactional workflow application, typically deployed as HA virtual machines alongside the HIS/EHR, with check-in kiosks, queue displays and ticketing terminals acting as thin edge endpoints. It integrates tightly to the record system for demographics and orders; sizing is driven by daily outpatient visit volume and the morning registration peak, where concurrency spikes hardest.", "tech_zh": "這是一套交易型工作流應用，通常以高可用虛擬機的形式與 HIS/EHR 並置部署，報到自助機、叫號顯示與取票終端則作為輕量邊緣端點。它與病歷系統緊密整合以取得基本資料與醫囑；規模由每日門診量與早晨報到尖峰決定，該時段併發量最為劇烈。", "usage_flow": [{"en": "Book appointment / register", "zh": "預約掛號、建檔"}, {"en": "Verify identity & eligibility", "zh": "核驗身分與保險資格"}, {"en": "Patient checks in (kiosk/desk)", "zh": "病患報到（自助機/櫃檯）"}, {"en": "Queue & route to service", "zh": "排隊叫號、分流至服務"}, {"en": "Encounter data to EHR/billing", "zh": "就診資料送往病歷/計費"}]}}, {"id": "rcm-billing-claims", "name_en": "Revenue Cycle Management / Billing & Claims", "name_zh": "營收循環管理（帳務計費與理賠申報）", "name_full": "Revenue Cycle Management, Billing and Claims Processing", "domain": "hospital-business-administration", "home_stakeholder": "facility", "lifecycle": ["commercial"], "role": ["system-of-record", "workflow", "analytics-artificial-intelligence"], "data_modality": ["transactional", "documents"], "deployment": ["software-as-a-service", "hybrid", "on-premises", "vendor-managed"], "segments": ["hospital-health-system", "academic-medical-center", "diagnostic-reference-laboratory"], "hospital_view": {"stakeholder": ["patient", "facility"], "dimension": ["business"]}, "hardware_opportunity": 2, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "operator", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 2, "operator": 2}, "infrastructure_notes": "Transactional DB with heavy batch claim-generation/scrubbing runs, typically co-located with EHR patient accounting on-prem or hosted-private; HA + DR mandatory since a billing stoppage halts cash flow. AI claims-scrubbing/denials inference sits mostly at the ISV or BPO operator, not the hospital.", "hardware_profile": ["gpu-server", "nvme-performance-storage", "high-availability-redundant", "disaster-recovery-backup"], "hardware_profile_sizing": {"gpu-server": "node", "nvme-performance-storage": "node", "high-availability-redundant": "node", "disaster-recovery-backup": "node"}, "plays": [], "vendors": ["availity", "epic-systems", "finthrive", "optum-change", "oracle-health", "quadax", "r1-rcm", "ssi-group", "ssi-group-2", "trubridge", "waystar"], "evidence_note": null, "workload_envelope": {"scaling_driver": "annual claim and charge-transaction volume plus concurrent batch scrubbing jobs", "gpu_role": "inference", "capacity_band": "terabyte", "availability_class": "mission-critical", "latency_class": "interactive", "data_growth": "moderate", "io_pattern": "mixed", "concurrency": "high", "retention_horizon": "long", "per_unit_data_size": null, "sources": ["https://www.ecfr.gov/current/title-42/chapter-IV/subchapter-B/part-424/subpart-P/section-424.516"], "notes": null}, "detail": {"purpose_en": "Revenue cycle management software runs the money side of care: charge capture, coding, claim generation and scrubbing, payer submission, denials management, and patient billing. It exists to convert clinical activity into paid claims and to protect the provider's cash flow.", "purpose_zh": "營收週期管理（RCM）軟體負責醫療的「金流」端：費用擷取、編碼、產生與審核申報單、送保險方、拒付管理與病患帳單。它的存在是把臨床活動轉化為可獲付的申報，並保障醫療機構的現金流。", "smci_en": "At the customer, node-scale general-purpose servers with NVMe for the transactional/batch database, an HA-redundant pair, and a DR/backup target fit best; the GPU inference footprint is small and typically belongs to the ISV/BPO co-sell rather than the hospital.", "smci_zh": "在客戶端，最適合的是節點級通用型伺服器：以 NVMe 承載交易/批次資料庫、一組高可用冗餘對，再加一個異地備援/備份標的；GPU 推論規模很小，通常屬於 ISV/BPO 協同銷售範疇而非醫院自有。", "tech_en": "At its core is a high-volume transactional database with heavy scheduled batch runs for claim generation and scrubbing, usually co-located with EHR patient accounting on-prem or hosted-private; HA plus DR is mandatory because a billing stoppage halts cash flow. AI-based claims-scrubbing and denials-prediction inference exists but sits mostly at the ISV or BPO operator rather than on hospital iron.", "tech_zh": "其核心是一套高交易量的資料庫，並帶有大量排程批次作業以產生與審核申報單，通常與電子病歷的病患帳務系統並置於院內或私有託管；高可用加上異地備援是必備的，因為計費一旦中斷即等同現金流停擺。以 AI 進行申報審核與拒付預測的推論雖然存在，但多半落在 ISV 或 BPO 營運方，而非醫院自有硬體。", "usage_flow": [{"en": "Capture charges from encounters", "zh": "自就診擷取費用"}, {"en": "Generate & scrub claims (batch)", "zh": "批次產生並審核申報單"}, {"en": "Submit to payers", "zh": "送交保險支付方"}, {"en": "Manage denials & post payments", "zh": "處理拒付、入帳"}, {"en": "Bill patient balance", "zh": "向病患開立餘額帳單"}]}}, {"id": "him-coding", "name_en": "Health Information Management & Coding", "name_zh": "病歷資訊管理與疾病分類編碼", "name_full": "Health Information Management and Medical Coding", "domain": "hospital-business-administration", "home_stakeholder": "facility", "lifecycle": ["clinical", "commercial"], "role": ["workflow", "analytics-artificial-intelligence", "system-of-record"], "data_modality": ["documents", "transactional"], "deployment": ["software-as-a-service", "on-premises", "hybrid"], "segments": ["hospital-health-system", "academic-medical-center"], "hospital_view": {"stakeholder": ["patient", "facility"], "dimension": ["admin", "business"]}, "hardware_opportunity": 3, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "operator", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 2, "operator": 3}, "infrastructure_notes": "Scanned-chart/document-imaging repositories with 7-15yr retention drive the storage footprint; legacy on-prem archives are refresh candidates. NLP computer-assisted/autonomous coding inference is mostly ISV-hosted GPU rather than customer-side.", "hardware_profile": ["gpu-server", "capacity-archive-storage"], "hardware_profile_sizing": {"gpu-server": "rack", "capacity-archive-storage": "rack"}, "plays": ["play-a"], "vendors": ["dolbey", "optum", "solventum", "trubridge"], "evidence_note": null, "workload_envelope": {"scaling_driver": "encounters coded per day and scanned-chart retention duration", "gpu_role": "inference", "capacity_band": "hundreds-of-terabytes", "availability_class": "standard", "latency_class": "interactive", "data_growth": "moderate", "io_pattern": "mixed", "concurrency": "high", "retention_horizon": "long", "per_unit_data_size": null, "sources": ["https://www.ecfr.gov/current/title-42/chapter-IV/subchapter-G/part-482/subpart-C/section-482.24"], "notes": null}, "detail": {"purpose_en": "Health information management and coding software governs the legal medical record and turns documentation into standardized diagnosis and procedure codes (ICD, CPT) for billing, reporting and compliance. It exists to keep the chart complete, retained and accurately coded.", "purpose_zh": "健康資訊管理與醫療編碼軟體掌管法定病歷，並把臨床文件轉換為標準化的診斷與處置代碼（ICD、CPT），供計費、統計與合規使用。它的存在是為了讓病歷完整、依規保存並準確編碼。", "smci_en": "At the customer, rack-scale high-capacity archive/JBOD storage for long-retention document repositories is the main pull; a modest GPU server (node/rack) applies only where a hospital chooses to host coding NLP on-prem, otherwise that GPU sits with the ISV.", "smci_zh": "在客戶端，主要需求是機架級的高容量歸檔/JBOD 儲存，用於長期保存的文件庫；只有當醫院選擇在院內自建編碼 NLP 時，才會用到一台規模有限的 GPU 伺服器（節點/機架級），否則該 GPU 落在 ISV 端。", "tech_en": "The dominant footprint is scanned-chart and document-imaging repositories held under long, multi-year retention (often 7-15 years or more depending on jurisdiction), so storage, not compute, drives sizing; legacy on-prem archives are prime refresh candidates. NLP-based computer-assisted and autonomous coding adds GPU inference, but that inference is mostly ISV-hosted rather than run on customer hardware.", "tech_zh": "其主要規模來自掃描病歷與文件影像的儲存庫，須依規長年保存（視法規常達 7 至 15 年甚至更久），因此決定規模的是儲存而非運算；老舊的院內歸檔正是汰換更新的首選標的。以 NLP 進行的電腦輔助與自動化編碼會帶來 GPU 推論，但該推論多由 ISV 託管，較少在客戶端硬體上執行。", "usage_flow": [{"en": "Capture / scan chart documents", "zh": "擷取或掃描病歷文件"}, {"en": "NLP suggests codes (CAC)", "zh": "NLP 建議代碼（電腦輔助編碼）"}, {"en": "Coder reviews & finalizes", "zh": "編碼師覆核並定稿"}, {"en": "Codes flow to billing/reporting", "zh": "代碼送往計費/統計"}, {"en": "Archive record long-term", "zh": "長期歸檔病歷"}]}}, {"id": "hospital-erp", "name_en": "Hospital ERP (Finance / Supply Chain / HR)", "name_zh": "醫院企業資源規劃系統（財務／供應鏈／人力資源）", "name_full": "Hospital Enterprise Resource Planning (finance, supply chain, human resources)", "domain": "hospital-business-administration", "home_stakeholder": "facility", "lifecycle": ["commercial"], "role": ["system-of-record", "workflow"], "data_modality": ["transactional"], "deployment": ["on-premises", "private-cloud", "software-as-a-service", "hybrid"], "segments": ["hospital-health-system", "academic-medical-center"], "hospital_view": {"stakeholder": ["facility"], "dimension": ["business", "admin", "ops"]}, "hardware_opportunity": 3, "hardware_buyer": ["customer", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3}, "infrastructure_notes": "Where on-prem (still common in APAC hospitals), a classic DB+app HA cluster with a DR pair and nightly close/batch windows; sized by transaction volume, bed count and concurrent users. Cloud-ERP migration is steadily eroding this footprint, so refresh cycles are the entry point.", "hardware_profile": ["nvme-performance-storage", "high-availability-redundant", "disaster-recovery-backup"], "hardware_profile_sizing": {"nvme-performance-storage": "rack", "high-availability-redundant": "rack", "disaster-recovery-backup": "node"}, "plays": ["play-d"], "vendors": ["infor", "microsoft", "oracle-health", "premier", "sap", "tecsys", "workday"], "evidence_note": null, "workload_envelope": {"scaling_driver": "transaction volume, concurrent users, and bed count", "gpu_role": "none", "capacity_band": "hundreds-of-terabytes", "availability_class": "mission-critical", "latency_class": "interactive", "data_growth": "moderate", "io_pattern": "mixed", "concurrency": "high", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": null}, "detail": {"purpose_en": "Hospital ERP runs the enterprise back office — finance and general ledger, supply-chain and materials management, and human resources/payroll — for a health system. It exists to control cost, procurement and workforce administration as the business backbone behind clinical operations.", "purpose_zh": "醫院 ERP 負責醫療體系的企業後勤——財務與總帳、供應鏈與物料管理，以及人力資源/薪資——的運作。它的存在是為了掌控成本、採購與人力行政，是臨床營運背後的營運骨幹。", "smci_en": "Fits rack-scale general-purpose servers: an NVMe-backed HA database/application cluster plus a DR/backup node, sized by transaction volume and concurrent users; positioned around the customer's refresh cycle since new on-prem footprint is shrinking.", "smci_zh": "適合機架級通用型伺服器：以 NVMe 承載的高可用資料庫/應用叢集，再加一個異地備援/備份節點，規模由交易量與併發使用者決定；由於新增院內部署正在萎縮，應圍繞客戶的汰換週期切入。", "tech_en": "Where deployed on-prem (still common in APAC hospitals), it is a classic transactional database plus application tier in an HA cluster with a DR pair and nightly close/batch windows; sizing follows transaction volume, bed count and concurrent users. Cloud-ERP migration is steadily eroding the on-prem footprint, so hardware refresh cycles are the main entry point.", "tech_zh": "在採院內部署時（於亞太地區醫院仍常見），它是典型的交易型資料庫加應用層，以高可用叢集運行，並配一組異地備援對與夜間結帳/批次時窗；規模取決於交易量、床位數與併發使用者數。雲端 ERP 遷移正持續侵蝕院內部署，因此硬體汰換週期是主要切入點。", "usage_flow": [{"en": "Record transactions (finance/supply/HR)", "zh": "記錄交易（財務/供應/人資）"}, {"en": "Process procurement & inventory", "zh": "處理採購與庫存"}, {"en": "Run payroll & HR workflows", "zh": "執行薪資與人資流程"}, {"en": "Nightly close / batch posting", "zh": "夜間結帳/批次過帳"}, {"en": "Report & analyze results", "zh": "產出報表與分析"}]}}, {"id": "workforce-management", "name_en": "Workforce Management & Staffing", "name_zh": "排班與人力調度管理", "name_full": "Healthcare Workforce Management and Staffing", "domain": "hospital-business-administration", "home_stakeholder": "facility", "lifecycle": ["commercial"], "role": ["workflow", "analytics-artificial-intelligence"], "data_modality": ["transactional", "time-series"], "deployment": ["software-as-a-service", "on-premises"], "segments": ["hospital-health-system", "academic-medical-center"], "hospital_view": {"stakeholder": ["facility"], "dimension": ["ops", "admin"]}, "hardware_opportunity": 1, "hardware_buyer": ["operator", "hyperscaler"], "primary_buyer": "operator", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"operator": 1}, "infrastructure_notes": "Overwhelmingly SaaS (nurse rostering, predictive staffing, float/agency marketplaces); time-clock and biometric attendance terminals are thin edge endpoints. Customer-side server opportunity is minimal beyond legacy time-and-attendance servers awaiting decommission.", "hardware_profile": [], "hardware_profile_sizing": {}, "plays": [], "vendors": ["healthstream", "qgenda", "symplr", "ukg"], "evidence_note": null, "workload_envelope": {"scaling_driver": "employee headcount and shift-roster transaction volume", "gpu_role": "none", "capacity_band": "none", "availability_class": "best-effort", "latency_class": "real-time", "data_growth": "low", "io_pattern": "light", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": null}, "detail": {"purpose_en": "Healthcare workforce management software handles nurse and staff scheduling, shift rostering, predictive staffing, float/agency pools, and time-and-attendance. It exists to match staffing to patient demand while controlling labor cost and burnout in a chronically short-staffed sector.", "purpose_zh": "醫療人力管理軟體負責護理與員工排班、班表編排、預測性人力配置、機動/派遣人力池與出勤打卡。它的存在是為了在長期人力短缺的產業中，讓人力配置貼合病患需求，同時控管人事成本與過勞。", "smci_en": "No meaningful Supermicro server opportunity at the customer — the workload is SaaS-hosted with only thin attendance endpoints on-prem; any residual footprint is legacy time-and-attendance servers awaiting decommission, not a scale-out target.", "smci_zh": "在客戶端幾乎沒有實質的 Supermicro 伺服器機會——此工作負載以 SaaS 託管，院內僅有輕量出勤端點；任何殘留部署都是等待除役的老舊出勤打卡伺服器，並非橫向擴充的目標。", "tech_en": "This is a transactional and time-series workflow application, delivered overwhelmingly as SaaS (rostering, predictive staffing, float/agency marketplaces), with time-clock and biometric attendance devices acting as thin edge endpoints. Predictive-staffing analytics is light and cloud-side; there is essentially no scale-out compute or storage on customer hardware.", "tech_zh": "這是一套交易型與時間序列的工作流應用，絕大多數以 SaaS 交付（排班、預測性人力配置、機動/派遣媒合），打卡機與生物辨識出勤裝置僅作為輕量邊緣端點。預測性人力分析負載很輕且落在雲端；客戶端硬體基本上沒有需橫向擴充的運算或儲存。", "usage_flow": [{"en": "Forecast staffing demand", "zh": "預測人力需求"}, {"en": "Build & publish rosters", "zh": "編排並發布班表"}, {"en": "Staff clock in/out", "zh": "員工打卡上下班"}, {"en": "Fill gaps via float/agency", "zh": "以機動/派遣補缺"}, {"en": "Analyze labor cost & compliance", "zh": "分析人事成本與合規"}]}}, {"id": "medical-device-integration", "name_en": "Medical Device Integration & Alarm Mana 叢集、搭配高速 NVMe 儲存與異地備援複本；不需 GPU。", "usage_flow": [{"en": "Receive order", "zh": "接收醫囑"}, {"en": "Accession specimen", "zh": "檢體登錄"}, {"en": "Interface analyzers", "zh": "串接分析儀"}, {"en": "Validate results", "zh": "審核結果"}, {"en": "Report to EHR", "zh": "回傳病歷"}]}}, {"id": "lab-middleware-automation", "name_en": "Lab Middleware & Automation Orchestration", "name_zh": "檢驗中介軟體與實驗室自動化調度系統", "name_full": "Laboratory Middleware and Instrument Automation", "domain": "diagnostics-laboratory", "home_stakeholder": "other", "lifecycle": ["clinical"], "role": ["integration", "data-acquisition", "workflow"], "data_modality": ["transactional", "time-series"], "deployment": ["on-premises", "edge", "hybrid"], "segments": ["hospital-health-system", "diagnostic-reference-laboratory", "academic-medical-center"], "hospital_view": {"stakeholder": ["device", "facility"], "dimension": ["ops", "clinical"]}, "hardware_opportunity": 2, "hardware_buyer": ["customer", "original-equipment-manufacturer"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 2, "original-equipment-manufacturer": 2}, "infrastructure_notes": "On-prem/edge integration and real-time track-control servers sitting beside analyzers, HA for core-lab uptime; sizing driven by instrument count, result/transaction rate, and autoverification/QC rule load. No GPU.", "hardware_profile": ["edge-industrial", "high-availability-redundant"], "hardware_profile_sizing": {"edge-industrial": "node", "high-availability-redundant": "node"}, "plays": ["play-d"], "vendors": ["beckman-coulter", "data-innovations", "roche", "siemens-healthineers"], "evidence_note": null, "workload_envelope": {"scaling_driver": "connected analyzer count and result messages per hour", "gpu_role": "none", "capacity_band": "none", "availability_class": "high-availability", "latency_class": "real-time", "data_growth": "low", "io_pattern": "random-transactional", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Real-time autoverification and track-control logic beside the analyzers, not a long-term store; the record of truth persists in the laboratory information system."}, "detail": {"purpose_en": "Middleware that sits between analyzers/track automation and the LIS: it drives instrument automation lines, applies autoverification and QC rules to incoming results, and routes samples and data in real time. It exists to keep a high-volume core lab running hands-free while releasing only rule-passing results.", "purpose_zh": "位於分析儀/軌道自動化與 LIS 之間的中介軟體，負責驅動儀器自動化生產線、對進來的結果套用自動審核與品管規則，並即時調度檢體與資料。其存在是為了讓高產量的核心實驗室近乎無人化運行，同時只放行通過規則的結果。", "smci_en": "Fits compact industrial/edge server nodes on the lab floor next to the automation line, deployed as HA-redundant pairs so a single failure does not halt the track — node-scale, one or two per lab, no GPU.", "smci_zh": "適合部署在實驗室現場、緊鄰自動化生產線的精簡工業級/邊緣伺服器節點，並以高可用配對部署，使單點故障不會中斷軌道；規模為節點級，每間實驗室一至兩台，無需 GPU。", "tech_en": "Real-time integration and track-control servers ingest instrument messages — transactional data plus time-series status/sensor streams — evaluate autoverification and QC rules with low latency, and forward passing results to the LIS. Because core-lab automation cannot stop, it runs on HA edge/industrial server pairs beside the analyzers. No GPU.", "tech_zh": "即時整合與軌道控制伺服器擷取儀器訊息（交易資料加上時序的狀態/感測串流），以低延遲評估自動審核與品管規則，再將通過的結果轉送至 LIS。由於核心實驗室自動化不能中斷，因此以高可用的工業級邊緣伺服器對部署在分析儀旁；無需 GPU。", "usage_flow": [{"en": "Connect analyzers", "zh": "連接分析儀"}, {"en": "Control automation track", "zh": "控制自動化軌道"}, {"en": "Apply QC / autoverify", "zh": "套用品管/自動審核"}, {"en": "Route results to LIS", "zh": "結果送交 LIS"}]}}, {"id": "digital-pathology", "name_en": "Digital Pathology Platform (WSI workflow + AI-assisted diagnosis)", "name_zh": "數位病理平台（全玻片影像工作流程與 AI 輔助診斷）", "name_full": "Digital Pathology Platform (whole-slide imaging and artificial-intelligence-assisted diagnosis)", "domain": "diagnostics-laboratory", "home_stakeholder": "doctor", "lifecycle": ["clinical", "research"], "role": ["workflow", "data-acquisition", "analytics-artificial-intelligence", "regulated-software-as-a-medical-device"], "data_modality": ["images", "artificial-intelligence-models"], "deployment": ["on-premises", "private-cloud", "hybrid"], "segments": ["hospital-health-system", "diagnostic-reference-laboratory", "academic-medical-center", "medical-technology-in-vitro-diagnostics", "biotechnology-pharmaceutical"], "hospital_view": {"stakeholder": ["clinician", "device"], "dimension": ["clinical", "ops"]}, "hardware_opportunity": 4, "hardware_buyer": ["customer", "operator", "hyperscaler", "original-equipment-manufacturer"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 4, "operator": 3, "original-equipment-manufacturer": 2}, "infrastructure_notes": "High-throughput scanner ingest, petabyte-scale tiered image storage, and GPU servers for AI inference and model training; sizing driven by slides/day, per-slide image size, and concurrent AI workload. Flagship compute+storage pull of the cluster. Scanner-embedded ingest/inference workstation is the original-equipment-manufacturer bill-of-materials path.", "hardware_profile": ["gpu-server", "nvme-performance-storage", "capacity-archive-storage"], "hardware_profile_sizing": {"gpu-server": "cluster", "nvme-performance-storage": "rack", "capacity-archive-storage": "cluster"}, "plays": ["play-a"], "vendors": ["aiforia", "deep-bio", "hamamatsu-photonics", "ibex-analytics", "indica-labs", "leica-biosystems", "mindpeak", "owkin", "paige-ai", "pathai", "philips", "proscia", "roche", "sectra", "visiopharm"], "evidence_note": null, "workload_envelope": {"scaling_driver": "whole-slide images scanned per day and per-slide image size", "gpu_role": "mixed", "capacity_band": "petabyte-plus", "availability_class": "standard", "latency_class": "interactive", "data_growth": "explosive", "io_pattern": "high-throughput-parallel", "concurrency": "high", "retention_horizon": "long", "per_unit_data_size": null, "sources": ["42 CFR 493.1105 (CLIA) — pathology test reports retained a minimum of ten years after reporting. https://www.ecfr.gov/current/title-42/chapter-IV/subchapter-G/part-493/subpart-J/section-493.1105"], "notes": "Ingest bursts at scan time onto the fast tier; GPU inference and model training share that tier before images migrate to the capacity archive."}, "detail": {"purpose_en": "Digitizes glass pathology slides into whole-slide images (WSI) for on-screen diagnosis, and runs AI to assist detection, quantification, and grading. It exists to replace the microscope with a scalable digital workflow and to add regulated AI-assisted diagnostic tools.", "purpose_zh": "將玻璃病理切片數位化為全切片影像（WSI）以供螢幕判讀，並運行 AI 協助偵測、量化與分級。其存在是為了以可擴充的數位工作流程取代顯微鏡，並加入受監管的 AI 輔助診斷工具。", "smci_en": "Fits a GPU-server cluster for AI inference/training, an NVMe all-flash rack as the scan-ingest and viewing tier, and a high-capacity archive cluster (JBOD/object) for the PB-scale image store — the flagship compute-plus-storage pull of the lab. A scanner-embedded ingest/inference workstation is the OEM path.", "smci_zh": "適合以 GPU 伺服器叢集承載 AI 推論/訓練、以 NVMe 全快閃機櫃作為掃描匯入與瀏覽層，並以高容量歸檔叢集（JBOD/物件儲存）承載 PB 級影像庫，是實驗室中運算加儲存的旗艦級需求。掃描儀內嵌的匯入/推論工作站則是 OEM 路徑。", "tech_en": "High-throughput scanners produce multi-gigabyte pyramidal WSI files that land on an NVMe ingest tier, are served for pan/zoom viewing, and feed GPU servers for AI inference and model training. Petabyte-scale tiered storage holds the growing image archive, and the AI diagnostic components are regulated SaMD. GPU is used for both inference and training.", "tech_zh": "高通量掃描儀產出數 GB 的金字塔式 WSI 檔案，先落在 NVMe 匯入層，供縮放瀏覽並送入 GPU 伺服器進行 AI 推論與模型訓練。PB 級分層儲存保存持續成長的影像庫；AI 診斷元件屬受監管的 SaMD。GPU 同時用於推論與訓練。", "usage_flow": [{"en": "Scan slides (WSI)", "zh": "掃描切片（WSI）"}, {"en": "Ingest to fast storage", "zh": "匯入高速儲存"}, {"en": "GPU AI inference", "zh": "GPU AI 推論"}, {"en": "Pathologist reads", "zh": "病理醫師判讀"}, {"en": "Archive images", "zh": "影像歸檔"}]}}, {"id": "ngs-lab-lims", "name_en": "NGS Wet-Lab LIMS (run & sample tracking)", "name_zh": "次世代定序濕實驗室資訊管理系統（樣本與定序批次追蹤）", "name_full": "Next-Generation Sequencing Laboratory Information Management System (wet-laboratory run and sample tracking)", "domain": "diagnostics-laboratory", "home_stakeholder": "other", "lifecycle": ["research", "clinical"], "role": ["system-of-record", "workflow", "data-acquisition"], "data_modality": ["transactional", "omics"], "deployment": ["on-premises", "private-cloud", "hybrid", "software-as-a-service"], "segments": ["diagnostic-reference-laboratory", "biotechnology-pharmaceutical", "academic-medical-center", "contract-research-organization"], "hospital_view": null, "hardware_opportunity": 2, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 2, "operator": 2}, "infrastructure_notes": "Modest, transactional application tier for sample and sequencing-run tracking; deployable on-prem or as SaaS. It sits beside sequencers that stage terabyte-scale run output (BCL/FASTQ) locally, but that storage/compute pull belongs to the instruments and to downstream secondary analysis, not to the LIMS software itself. No GPU.", "hardware_profile": [], "hardware_profile_sizing": {}, "plays": [], "vendors": ["illumina", "l7-informatics", "labcollector", "ovation"], "evidence_note": null, "workload_envelope": {"scaling_driver": "samples and sequencing runs tracked per week", "gpu_role": "none", "capacity_band": "none", "availability_class": "best-effort", "latency_class": "interactive", "data_growth": "low", "io_pattern": "random-transactional", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Transactional sample and run tracking only; the terabyte-scale run output belongs to the sequencers and to downstream secondary analysis, not to this software."}, "detail": {"purpose_en": "A LIMS specialized for the sequencing wet lab: it tracks samples, libraries, reagents, and sequencing runs through the bench workflow and records the chain of custody. It exists to manage the operational lab process around the sequencers, not to process the sequence data itself.", "purpose_zh": "專為定序濕實驗室設計的 LIMS，追蹤檢體、文庫、試劑與定序批次在實驗流程中的流轉，並記錄監管鏈。其存在是為了管理環繞定序儀的實驗室操作流程，而非處理定序資料本身。", "smci_en": "Carries no significant server pull of its own — a light application/database VM alongside the LIS or lab infrastructure suffices. The real hardware opportunity is adjacent: the sequencer storage tier and the bioinformatics secondary-analysis cluster, not this software.", "smci_zh": "本身不帶明顯的伺服器需求——在 LIS 或實驗室基礎架構旁配置一台輕量的應用/資料庫 VM 即可。真正的硬體機會在其鄰近環節：定序儀的儲存層與生物資訊次級分析叢集，而非此軟體。", "tech_en": "A modest transactional application-and-database tier records samples, libraries, and run metadata, deployable on-prem or as SaaS. It sits beside sequencers that stage terabyte-scale BCL/FASTQ output locally, but that storage and compute belong to the instruments and downstream secondary analysis, not to the LIMS. No GPU.", "tech_zh": "以精簡的交易型應用與資料庫層記錄檢體、文庫與批次中繼資料，可部署於本地或以 SaaS 提供。它座落在定序儀旁，而定序儀會在本地暫存 TB 級的 BCL/FASTQ 產出，但該儲存與運算屬於儀器與下游次級分析，而非 LIMS 軟體本身。無需 GPU。", "usage_flow": [{"en": "Register samples", "zh": "登錄檢體"}, {"en": "Track library prep", "zh": "追蹤文庫製備"}, {"en": "Schedule sequencing run", "zh": "排定定序批次"}, {"en": "Record run metadata", "zh": "記錄批次中繼資料"}]}}, {"id": "clinical-genomics-reporting", "name_en": "Clinical Genomics Interpretation & Reporting", "name_zh": "臨床基因體變異判讀與報告", "name_full": "Clinical Genomics Interpretation and Reporting", "domain": "diagnostics-laboratory", "home_stakeholder": "other", "lifecycle": ["clinical"], "role": ["analytics-artificial-intelligence", "workflow", "regulated-software-as-a-medical-device"], "data_modality": ["omics", "documents"], "deployment": ["software-as-a-service", "hybrid", "private-cloud"], "segments": ["diagnostic-reference-laboratory", "hospital-health-system", "academic-medical-center", "biotechnology-pharmaceutical"], "hospital_view": null, "hardware_opportunity": 2, "hardware_buyer": ["operator", "hyperscaler", "customer"], "primary_buyer": "operator", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 1, "operator": 2}, "infrastructure_notes": "SaaS-dominant interpretation/reporting layer: consumes tertiary variant calls handed off from bioinformatics-secondary (which owns the compute-heavy pipeline). Curated knowledge bases, variant annotation/classification, report generation; minimal customer-side hardware, any footprint is cloud at the operator. No on-prem GPU pull at the customer.", "hardware_profile": [], "hardware_profile_sizing": {}, "plays": [], "vendors": ["congenica", "fabric-genomics", "golden-helix", "nucleai", "qiagen", "sophia-genetics", "tempus"], "evidence_note": null, "workload_envelope": {"scaling_driver": "genomic cases interpreted and reported per month", "gpu_role": "none", "capacity_band": "none", "availability_class": "best-effort", "latency_class": "interactive", "data_growth": "low", "io_pattern": "random-transactional", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Interpretation and reporting layer; the compute-heavy variant calling sits upstream in bioinformatics-secondary and any real footprint is cloud at the operator."}, "detail": {"purpose_en": "The interpretation-and-reporting (tertiary-analysis) layer of clinical genomics: it takes the variant calls produced by secondary analysis, annotates and classifies variants against curated knowledge bases, and generates the signed clinical report. It exists to turn a variant list into a clinically actionable, regulated diagnostic report.", "purpose_zh": "臨床基因體學的判讀與報告層（三級分析），接收由次級分析產出的變異呼叫結果，依據策展的知識庫進行變異註解與分級，並產出經簽署的臨床報告。其存在是為了將變異清單轉化為具臨床可行性、受監管的診斷報告。", "smci_en": "Carries no customer-side server pull — it is SaaS-dominant and any footprint is cloud infrastructure at the software operator. Hardware co-sell, if any, is with the ISV/operator hosting the platform, not the diagnostic lab.", "smci_zh": "不帶客戶端伺服器需求——以 SaaS 為主，任何佔用皆為軟體營運方的雲端基礎架構。若有硬體協同銷售，對象是託管該平台的 ISV/營運方，而非診斷實驗室。", "tech_en": "A predominantly SaaS analytics/workflow layer that consumes variant calls handed off from the compute-heavy secondary-analysis bioinformatics pipeline, then applies variant annotation, classification against curated knowledge bases, and report generation. The regulated SaMD logic and any real compute footprint sit at the cloud operator, not on customer premises. No on-prem GPU pull at the customer.", "tech_zh": "以 SaaS 為主的分析/工作流程層，接收由運算密集的次級分析生物資訊流程交付的變異呼叫結果，再套用變異註解、對策展知識庫的分級，以及報告產生。受監管的 SaMD 邏輯與任何實質運算佔用皆位於雲端營運方，而非客戶端；客戶端無本地 GPU 需求。", "usage_flow": [{"en": "Ingest variant calls", "zh": "匯入變異呼叫"}, {"en": "Annotate & classify", "zh": "註解與分級"}, {"en": "Match knowledge base", "zh": "對照知識庫"}, {"en": "Generate signed report", "zh": "產出簽署報告"}]}}, {"id": "rd-lab-informatics", "name_en": "R&D Lab Informatics (ELN / research LIMS / biobank & sample management)", "name_zh": "研發實驗室資訊系統（電子實驗紀錄簿／實驗室資訊管理系統／生物樣本庫）", "name_full": "Research and Development Laboratory Informatics (electronic laboratory notebook, laboratory information management system, biobank)", "domain": "pharmaceutical-research-clinical-development", "home_stakeholder": "other", "lifecycle": ["research", "preclinical"], "role": ["system-of-record", "workflow", "integration"], "data_modality": ["transactional", "documents"], "deployment": ["software-as-a-service", "private-cloud", "on-premises", "hybrid"], "segments": ["biotechnology-pharmaceutical", "academic-medical-center", "contract-research-organization", "medical-technology-in-vitro-diagnostics"], "hospital_view": null, "hardware_opportunity": 2, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable" tasets. GxP-grade high availability, backup, and long-retention archive drive most of the sizing; there is no GPU workload.", "tech_zh": "交易型資料庫加應用伺服器存放結構化記錄與文件；儲存量隨附加的儀器檔案與檢體關聯資料集成長。GxP等級的高可用、備份與長期保存歸檔主導規模；無GPU工作負載。", "usage_flow": [{"en": "Record experiment (ELN)", "zh": "記錄實驗 (ELN)"}, {"en": "Register & track samples", "zh": "登錄並追蹤樣本"}, {"en": "Attach instrument files", "zh": "附加儀器檔案"}, {"en": "Manage biobank inventory", "zh": "管理樣本庫存"}, {"en": "Archive & retain (GxP)", "zh": "歸檔與長期保存 (GxP)"}]}}, {"id": "comp-chem-simulation", "name_en": "Computational Chemistry / Molecular Modeling & Simulation", "name_zh": "計算化學／分子建模與模擬", "name_full": "Computational Chemistry, Molecular Modeling and Simulation", "domain": "pharmaceutical-research-clinical-development", "home_stakeholder": "other", "lifecycle": ["research", "preclinical"], "role": ["analytics-artificial-intelligence", "infrastructure-platform"], "data_modality": ["simulation", "artificial-intelligence-models"], "deployment": ["on-premises", "private-cloud", "hybrid", "public-cloud"], "segments": ["biotechnology-pharmaceutical", "academic-medical-center", "contract-research-organization"], "hospital_view": null, "hardware_opportunity": 4, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 4, "operator": 3}, "infrastructure_notes": "GPU-dense and CPU-HPC clusters for molecular dynamics, docking and quantum-mechanical calculations. Low-latency interconnect and fast parallel scratch storage size the cluster; large campaigns burst to cloud.", "hardware_profile": ["gpu-server", "high-performance-computing-cpu", "nvme-performance-storage", "high-memory"], "hardware_profile_sizing": {"gpu-server": "cluster", "high-performance-computing-cpu": "cluster", "nvme-performance-storage": "rack", "high-memory": "rack"}, "plays": ["play-b"], "vendors": ["cadence-design-systems", "chemical-computing-group", "cresset", "
