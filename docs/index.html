資訊管理（PV／RIM）", "name_full": "Pharmacovigilance and Regulatory Information Management", "domain": "pharmaceutical-research-clinical-development", "home_stakeholder": "other", "lifecycle": ["clinical", "post-market", "commercial"], "role": ["system-of-record", "workflow", "integration"], "data_modality": ["transactional", "documents"], "deployment": ["software-as-a-service", "vendor-managed", "private-cloud"], "segments": ["biotechnology-pharmaceutical", "contract-research-organization"], "hospital_view": null, "hardware_opportunity": 2, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "operator", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 1, "operator": 2}, "infrastructure_notes": "Predominantly SaaS or hosted case-processing and submission repositories; minimal customer on-prem beyond integration and archive nodes. AI-assisted case intake can add modest GPU at the operator.", "hardware_profile": ["gpu-server", "capacity-archive-storage"], "hardware_profile_sizing": {"gpu-server": "node", "capacity-archive-storage": "node"}, "plays": [], "vendors": ["arisglobal", "ennov", "extedo", "iqvia", "oracle-life-sciences", "veeva-systems"], "evidence_note": null, "workload_envelope": {"scaling_driver": "adverse-event case volume processed per period", "gpu_role": "inference", "capacity_band": "tens-of-terabytes", "availability_class": "standard", "latency_class": "interactive", "data_growth": "moderate", "io_pattern": "random-transactional", "concurrency": "moderate", "retention_horizon": "long", "per_unit_data_size": null, "sources": ["Commission Implementing Regulation (EU) No 520/2012, Article 12 — pharmacovigilance data/documentation retained for the life of the marketing authorisation and at least 10 years after it ceases; EMA GVP Module VI — https://www.ema.europa.eu/en/human-regulatory-overview/post-authorisation/pharmacovigilance-post-authorisation/good-pharmacovigilance-practices-gvp"], "notes": null}, "detail": {"purpose_en": "Manages drug-safety and regulatory processes — collecting, assessing, and reporting adverse events (pharmacovigilance) and tracking product registrations, submissions, and correspondence (RIM). It exists to meet mandatory safety-reporting and regulatory obligations.", "purpose_zh": "管理藥物安全與法規流程——收集、評估並通報不良事件（藥物安全監測），以及追蹤產品註冊、送件與往來文件（法規資訊管理）。存在目的是符合強制性的安全通報與法規義務。", "smci_en": "Mostly vendor-hosted; the modest hardware angle is an archive node plus, where AI-assisted case intake is run, a single GPU inference node — node scale, and largely at the operator rather than the customer.", "smci_zh": "多由廠商託管；小幅硬體切入點為一個歸檔節點，及在採用AI輔助收案時的單一GPU推論節點——節點規模，且多位於營運商而非客戶端。", "tech_en": "It runs predominantly as SaaS or hosted case-processing and submission repositories over transactional and document data, with minimal customer on-prem beyond integration and archive nodes. AI-assisted case intake can add modest GPU inference, mostly at the operator.", "tech_zh": "主要以SaaS或託管的案件處理與送件庫運作，資料為交易型與文件型，客戶地端除整合與歸檔節點外極少。AI輔助案件收錄可增加少量GPU推論，且多位於營運商端。", "usage_flow": [{"en": "Intake adverse-event case", "zh": "接收不良事件案件"}, {"en": "Triage & assess", "zh": "分級與評估"}, {"en": "Code & write narrative", "zh": "編碼與撰寫敘述"}, {"en": "Report to authorities", "zh": "通報主管機關"}, {"en": "Archive & track submissions", "zh": "歸檔與追蹤送件"}]}}, {"id": "scada-dcs", "name_en": "SCADA / DCS (Process Control)", "name_zh": "監控與資料擷取（SCADA）／分散式控制系統（DCS，製程控制）", "name_full": "Supervisory Control and Data Acquisition / Distributed Control System (process control)", "domain": "manufacturing-quality-supply-chain", "home_stakeholder": "other", "lifecycle": ["manufacturing"], "role": ["data-acquisition", "workflow"], "data_modality": ["time-series", "transactional"], "deployment": ["on-premises", "edge", "private-cloud"], "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization", "medical-technology-in-vitro-diagnostics"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3}, "infrastructure_notes": "Redundant real-time control server pairs per process area plus industrial edge I/O on a deterministic low-latency network; HA/failover and validated-change control drive sizing and refresh cycles.", "hardware_profile": ["edge-industrial", "high-availability-redundant"], "hardware_profile_sizing": {"edge-industrial": "node", "high-availability-redundant": "node"}, "plays": ["play-c"], "vendors": ["abb", "aveva", "emerson", "honeywell", "rockwell-automation", "siemens", "yokogawa"], "evidence_note": null, "workload_envelope": {"scaling_driver": "control tag and input/output point count per process area", "gpu_role": "none", "capacity_band": "none", "availability_class": "high-availability", "latency_class": "real-time", "data_growth": "low", "io_pattern": "random-transactional", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Deterministic control loop; long-term storage is offloaded to the plant historian rather than held in the control tier."}, "detail": {"purpose_en": "SCADA and DCS are the real-time process-control layer that monitors and commands plant equipment — valves, pumps, bioreactors, utilities — keeping the process running safely within its defined operating envelope. They exist so operators can supervise and control production continuously and deterministically.", "purpose_zh": "SCADA 與 DCS 是即時製程控制層，負責監視並操控廠內設備（閥件、泵浦、生物反應器、公用設施），使製程安全地維持在既定操作範圍內運行。其存在目的是讓操作員能持續且具確定性地監督與控制生產。", "smci_en": "Fits redundant HA server pairs per process area plus industrial-edge compute for I/O and supervisory functions, sized at the node/pair level on a deterministic network. HA/failover and validated-change control drive both the sizing and the refresh cycle.", "smci_zh": "適配每個製程區一組高可用冗餘伺服器對，加上負責 I/O 與監控功能的工業邊緣運算，於確定性網路上以節點／伺服器對層級配置。高可用／故障切換與驗證變更控制同時決定其規模與汰換週期。", "tech_en": "As a data-acquisition and workflow layer, it continuously scans I/O points and control tags, runs deterministic control loops, and streams high-frequency time-series plus transactional alarm/event data. It runs on a low-latency, often segmented industrial network and depends on redundant controllers and failover to avoid loss of control.", "tech_zh": "作為資料擷取與工作流程層，它持續掃描 I/O 點與控制標籤，執行確定性控制迴路，並串流高頻時序資料及交易型告警／事件資料。它運行於低延遲、通常經網段隔離的工業網路，並仰賴冗餘控制器與故障切換以避免失控。", "usage_flow": [{"en": "Sense field I/O", "zh": "感測現場 I/O"}, {"en": "Execute control logic", "zh": "執行控制邏輯"}, {"en": "Actuate equipment", "zh": "驅動設備動作"}, {"en": "Visualize & alarm on HMI", "zh": "HMI 可視化與告警"}, {"en": "Feed data to historian/MES", "zh": "數據送往歷史庫/MES"}]}}, {"id": "plant-historian", "name_en": "Plant Historian (Time-Series Data)", "name_zh": "工廠歷史資料庫（Historian，時序資料）", "name_full": "Manufacturing Plant Process Historian (time-series data)", "domain": "manufacturing-quality-supply-chain", "home_stakeholder": "other", "lifecycle": ["manufacturing"], "role": ["system-of-record", "data-acquisition"], "data_modality": ["time-series"], "deployment": ["on-premises", "private-cloud", "hybrid", "edge"], "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization", "medical-technology-in-vitro-diagnostics"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3}, "infrastructure_notes": "High-ingest time-series store scaling with tag count and sampling rate; fast local NVMe for hot data plus capacity tier for multi-year retention. Storage grows continuously as lines and sensors are added.", "hardware_profile": ["nvme-performance-storage", "capacity-archive-storage"], "hardware_profile_sizing": {"nvme-performance-storage": "node", "capacity-archive-storage": "rack"}, "plays": ["play-c"], "vendors": ["aspentech", "aveva", "canary-labs", "ge-vernova"], "evidence_note": null, "workload_envelope": {"scaling_driver": "historized tag count and sampling frequency per site", "gpu_role": "none", "capacity_band": "hundreds-of-terabytes", "availability_class": "standard", "latency_class": "real-time", "data_growth": "high", "io_pattern": "sequential-throughput", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Hot data on fast local storage with a capacity tier for multi-year retention; footprint grows as lines and sensors are added."}, "detail": {"purpose_en": "A plant historian is the time-series system-of-record that continuously captures and permanently stores every process tag from the plant floor at high frequency. It exists to give quality, engineering and operations a trustworthy long-term archive for trending, investigations, batch review and regulatory retention.", "purpose_zh": "工廠歷史資料庫（Historian）是時序型紀錄系統，以高頻率持續擷取並永久儲存廠區每一個製程標籤。其存在目的是為品保、工程與營運提供可信賴的長期封存，供趨勢分析、事件調查、批次審查與法規保存之用。", "smci_en": "Fits an NVMe all-flash node for the hot ingest/query tier paired with a high-capacity archive rack (JBOD/dense storage) for long retention — a storage-led profile with modest compute. Sizing tracks historized tag count and sampling frequency per site.", "smci_zh": "適配一台 NVMe 全快閃節點負責熱資料擷取／查詢層，搭配一機櫃高容量封存（JBOD／高密度儲存）供長期保存，屬儲存主導、運算需求不高的型態。規模依各廠歷史化標籤數與取樣頻率而定。", "tech_en": "As a system-of-record and data-acquisition store, it ingests very high volumes of time-series data, applies compression, and serves fast trend queries. Hot recent data lives on fast NVMe while multi-year retention rolls onto a high-capacity tier; storage grows continuously as tags, lines and sensors are added.", "tech_zh": "作為紀錄系統與資料擷取儲存庫，它擷取極大量的時序資料、施以壓縮，並提供快速的趨勢查詢。近期熱資料存放於高速 NVMe，多年期保存則轉入高容量儲存層；隨著標籤、產線與感測器增加，儲存量持續成長。", "usage_flow": [{"en": "Collect tags from control layer", "zh": "自控制層收集標籤"}, {"en": "Compress & write hot data", "zh": "壓縮並寫入熱資料"}, {"en": "Tier to capacity archive", "zh": "分層至容量封存"}, {"en": "Query, trend & report", "zh": "查詢、趨勢與報表"}]}}, {"id": "qc-lims-cds", "name_en": "QC Lab Informatics (LIMS / Chromatography Data)", "name_zh": "品管實驗室資訊管理系統（LIMS）／層析資料系統（CDS）", "name_full": "Quality Control Laboratory Information Management System and Chromatography Data System", "domain": "manufacturing-quality-supply-chain", "home_stakeholder": "other", "lifecycle": ["manufacturing", "post-market"], "role": ["system-of-record", "workflow", "data-acquisition"], "data_modality": ["transactional", "documents", "time-series"], "deployment": ["on-premises", "private-cloud", "hybrid", "software-as-a-service"], "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization", "medical-technology-in-vitro-diagnostics"], "hospital_view": null, "hardware_opportunity": 2, "hardware_buyer": ["customer", "operator"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 2, "operator": 1}, "infrastructure_notes": "On-prem lab servers plus instrument-attached acquisition workstations; chromatography and spectral raw files accumulate and pull validated storage and backup. Modest compute, storage-led growth.", "hardware_profile": ["capacity-archive-storage", "disaster-recovery-backup"], "hardware_profile_sizing": {"capacity-archive-storage": "node", "disaster-recovery-backup": "node"}, "plays": ["play-c"], "vendors": ["agilent-technologies", "labvantage", "labware", "starlims", "thermo-fisher-scientific", "waters"], "evidence_note": null, "workload_envelope": {"scaling_driver": "quality-control samples tested per day and instrument raw-file volume", "gpu_role": "none", "capacity_band": "tens-of-terabytes", "availability_class": "high-availability", "latency_class": "real-time", "data_growth": "moderate", "io_pattern": "mixed", "concurrency": "moderate", "retention_horizon": "medium", "per_unit_data_size": null, "sources": ["FDA 21 CFR 211.194 (complete laboratory records) with retention per 21 CFR 211.180 — batch-associated laboratory records retained at least one year after batch expiration (eCFR: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-C/part-211/subpart-J/section-211.180)"], "notes": null}, "detail": {"purpose_en": "QC lab informatics — a QC LIMS plus a Chromatography Data System — manages quality-control testing of raw materials and finished product and acquires and processes the analytical instrument data (chromatography, spectra) behind each result. It exists to run the release-testing workflow and hold the compliant record that a batch meets specification.", "purpose_zh": "品管實驗室資訊系統（QC LIMS 加上層析數據系統 CDS）管理原物料與成品的品質管制檢測，並擷取與處理每項結果背後的分析儀器數據（層析、光譜）。其存在目的是執行放行檢驗流程，並保存證明批次符合規格的合規紀錄。", "smci_en": "A storage-led profile: fits a high-capacity archive node for accumulating validated raw files plus a DR/backup node, alongside modest on-prem lab application servers. Sized by QC samples tested per day and per-instrument raw-file volume, at node scale rather than clusters.", "smci_zh": "屬儲存主導型態：適配一台高容量封存節點存放持續累積的已驗證原始檔，加上一台 DR／備份節點，並搭配少量地端實驗室應用伺服器。規模依每日品管檢測樣品數與各儀器原始檔量而定，屬節點層級而非叢集。", "tech_en": "As a system-of-record, workflow and data-acquisition layer, it runs a transactional QC database and CDS acquisition workstations attached to chromatographs and spectrometers, generating documents and time-series raw files. Compute is modest but chromatography and spectral raw files accumulate steadily, pulling validated long-retention storage and backup under GxP.", "tech_zh": "作為紀錄系統、工作流程與資料擷取層，它運行交易型品管資料庫，並以連接層析儀與光譜儀的 CDS 擷取工作站產生文件與時序原始檔。運算需求不高，但層析與光譜原始檔持續累積，在 GxP 下帶動已驗證的長保存儲存與備份需求。", "usage_flow": [{"en": "Register sample & test plan", "zh": "登錄樣品與檢測計畫"}, {"en": "Acquire instrument raw data", "zh": "擷取儀器原始數據"}, {"en": "Process & review results", "zh": "處理並審查結果"}, {"en": "Approve & release result", "zh": "核准並放行結果"}, {"en": "Archive raw files & records", "zh": "封存原始檔與紀錄"}]}}, {"id": "eqms-calibration", "name_en": "eQMS & Calibration / Maintenance Management (GxP Quality)", "name_zh": "電子品質管理系統（eQMS）與校正／維護管理（GxP 品質合規）", "name_full": "Electronic Quality Management System, Calibration and Maintenance Management", "domain": "manufacturing-quality-supply-chain", "home_stakeholder": "other", "lifecycle": ["manufacturing", "post-market"], "role": ["system-of-record", "workflow"], "data_modality": ["documents", "transactional"], "deployment": ["software-as-a-service", "private-cloud", "on-premises"], "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization", "medical-technology-in-vitro-diagnostics"], "hospital_view": null, "hardware_opportunity": 2, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "operator", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 1, "operator": 2}, "infrastructure_notes": "Predominantly validated SaaS/hosted; minimal customer-side hardware beyond integration and document retention. Calibration/CMMS modules add asset and schedule records, not compute.", "hardware_profile": ["capacity-archive-storage"], "hardware_profile_sizing": {"capacity-archive-storage": "node"}, "plays": [], "vendors": ["assurx", "etq", "ideagen", "iqvia", "mastercontrol", "veeva-systems"], "evidence_note": null, "workload_envelope": {"scaling_driver": "controlled quality records and documents managed per site", "gpu_role": "none", "capacity_band": "tens-of-terabytes", "availability_class": "standard", "latency_class": "interactive", "data_growth": "low", "io_pattern": "random-transactional", "concurrency": "moderate", "retention_horizon": "medium", "per_unit_data_size": null, "sources": ["FDA 21 CFR 211.180 — GMP records maintained under this part retained at least one year after the associated batch expiration date; readily available for inspection during the retention period (eCFR: https://www.ecfr.gov/current/title-21/chapter-I/subchapter-C/part-211/subpart-J/section-211.180)"], "notes": null}, "detail": {"purpose_en": "An electronic QMS with calibration and maintenance management runs the GxP quality processes — deviations, CAPAs, change control, training, controlled documents — and tracks the calibration and maintenance schedules of regulated equipment. It exists to keep the quality system compliant and audit-ready.", "purpose_zh": "電子品質管理系統（eQMS）搭配校正與維護管理，執行 GxP 品質流程（偏差、CAPA、變更控制、訓練、受控文件），並追蹤受管制設備的校正與維護排程。其存在目的是維持品質系統的合規性與稽核準備狀態。", "smci_en": "Minimal on-prem hardware: at most a high-capacity archive node for controlled-document retention plus small application/database servers where a site self-hosts. Calibration/CMMS modules add asset and schedule records, not compute — node-scale at most.", "smci_zh": "地端硬體需求極低：至多一台高容量封存節點供受控文件保存，以及在自行代管情況下的少量應用／資料庫伺服器。校正／CMMS 模組僅新增資產與排程紀錄，並無運算需求，至多為節點層級。", "tech_en": "As a system-of-record and workflow engine, it manages controlled documents and transactional quality records with electronic signatures and audit trails, largely a document-and-form-centric workload. It is predominantly delivered as validated SaaS or hosted; on-prem footprint is limited to integration and long-term document retention rather than heavy compute.", "tech_zh": "作為紀錄系統與工作流程引擎，它以電子簽章與稽核軌跡管理受控文件與交易型品質紀錄，主要屬以文件與表單為核心的工作負載。它多以已驗證的 SaaS 或代管方式交付；地端佔用僅限於整合與長期文件保存，而非高運算需求。", "usage_flow": [{"en": "Log quality event / record", "zh": "登錄品質事件／紀錄"}, {"en": "Route review & approval", "zh": "傳送審查與核准"}, {"en": "Track calibration & maintenance", "zh": "追蹤校正與維護"}, {"en": "Retain controlled records", "zh": "保存受控紀錄"}]}}, {"id": "serialization-track-trace", "name_en": "Serialization / Track-and-Trace (L4-L5)", "name_zh": "序列化與追蹤追溯（L4-L5 層級）", "name_full": "Pharmaceutical Serialization and Track-and-Trace", "domain": "manufacturing-quality-supply-chain", "home_stakeholder": "other", "lifecycle": ["manufacturing", "commercial"], "role": ["system-of-record", "integration", "workflow"], "data_modality": ["transactional"], "deployment": ["on-premises", "private-cloud", "hybrid", "software-as-a-service", "vendor-managed"], "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization", "medical-technology-in-vitro-diagnostics"], "hospital_view": null, "hardware_opportunity": 2, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 2, "operator": 2}, "infrastructure_notes": "Site-level (L4) repository servers with HA to protect packaging-line uptime, integrating up to enterprise/regulatory (L5) hubs that are often managed/cloud; sizing follows line count and serialization event volume.", "hardware_profile": ["high-availability-redundant"], "hardware_profile_sizing": {"high-availability-redundant": "node"}, "plays": ["play-c"], "vendors": ["antares-vision", "optel-group", "sap", "systech", "tracelink"], "evidence_note": null, "workload_envelope": {"scaling_driver": "packaging lines and serialization events generated per line", "gpu_role": "none", "capacity_band": "none", "availability_class": "high-availability", "latency_class": "interactive", "data_growth": "moderate", "io_pattern": "random-transactional", "concurrency": "moderate", "retention_horizon": "medium", "per_unit_data_size": null, "sources": ["Drug Supply Chain Security Act, 21 U.S.C. 582 — trading partners must retain transaction information and transaction statements for at least six years after the transaction (FDA DSCSA: https://www.fda.gov/drugs/drug-supply-chain-security-act-dscsa)"], "notes": null}, "detail": {"purpose_en": "Serialization / track-and-trace assigns and manages unique identifiers on pharmaceutical packaging — from the packaging line and site systems up to the enterprise and regulatory (L5) network — so every saleable unit can be authenticated and traced through the supply chain. It exists to meet anti-counterfeiting mandates like DSCSA and the EU FMD.", "purpose_zh": "序列化／追溯系統（Track-and-Trace）為藥品包裝指派並管理唯一識別碼，自包裝線與廠區系統向上串接至企業與法規（L5）網路，使每一可銷售單位皆可被驗證並在供應鏈中追溯。其存在目的是滿足如美國 DSCSA 與歐盟 FMD 等反偽藥法規要求。", "smci_en": "Fits an HA-redundant server node/pair at each packaging site to protect line uptime, integrating up to enterprise/regulatory (L5) hubs that live elsewhere. Node-scale, sized by packaging-line count and serialization event volume per line.", "smci_zh": "適配各包裝廠區一組高可用冗餘伺服器節點／對以保障產線運轉，並向上整合位於他處的企業／法規（L5）中樞。屬節點層級，規模依包裝線數量與每條線的序列化事件量而定。", "tech_en": "As a system-of-record, integration and workflow layer, it manages transactional serial-number pools and commissioning/aggregation events in real time on the packaging line, then exchanges data with enterprise and regulatory (L5) hubs that are often managed or cloud. On-site serialization uptime is critical because a repository outage stops the line.", "tech_zh": "作為紀錄系統、整合與工作流程層，它在包裝線上即時管理交易型序號池與賦碼／聚合事件，再與通常屬代管或雲端的企業及法規（L5）中樞交換資料。廠區端序列化系統的可用性至關重要，因為儲存庫中斷會使產線停擺。", "usage_flow": [{"en": "Generate serial numbers", "zh": "產生序號"}, {"en": "Commission on packaging line", "zh": "於包裝線上賦碼"}, {"en": "Aggregate to cases/pallets", "zh": "聚合至箱／棧板"}, {"en": "Report events to L5 hub", "zh": "回報事件至 L5 中樞"}]}}, {"id": "warehouse-cold-chain", "name_en": "Warehouse & Cold-Chain Management (WMS / Environmental Monitoring)", "name_zh": "倉儲管理系統與冷鏈環境監測", "name_full": "Warehouse Management System and Cold-Chain Environmental Monitoring", "domain": "manufacturing-quality-supply-chain", "home_stakeholder": "other", "lifecycle": ["manufacturing", "commercial"], "role": ["system-of-record", "data-acquisition", "workflow"], "data_modality": ["transactional", "time-series"], "deployment": ["on-premises", "private-cloud", "edge", "hybrid", "software-as-a-service"], "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization", "medical-technology-in-vitro-diagnostics"], "hospital_view": null, "hardware_opportunity": 2, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 2, "operator": 1}, "infrastructure_notes": "On-prem/edge WMS plus environmental-monitoring gateways at plant and distribution sites; ruggedized edge nodes aggregate cold-chain and cleanroom sensor streams. Sizing driven by site count and sensor density, not heavy compute.", "hardware_profile": ["edge-industrial"], "hardware_profile_sizing": {"edge-industrial": "node"}, "plays": ["play-c"], "vendors": ["blue-yonder", "ellab", "koerber", "manhattan-associates", "sap", "vaisala"], "evidence_note": null, "workload_envelope": {"scaling_driver": "distribution and storage sites and environmental-monitoring sensor count", "gpu_role": "none", "capacity_band": "none", "availability_class": "standard", "latency_class": "real-time", "data_growth": "low", "io_pattern": "random-transactional", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Ruggedized edge gateways aggregate cold-chain and cleanroom sensor streams alongside on-prem or edge warehouse management."}, "detail": {"purpose_en": "A WMS with cold-chain environmental monitoring controls warehouse operations — receiving, put-away, picking, shipping — while continuously monitoring temperature and humidity across storage and distribution sites. It exists to keep GxP-regulated and cold-chain product within its required conditions and to prove it, end to end.", "purpose_zh": "倉儲管理系統（WMS）搭配冷鏈環境監控，管理倉庫作業（收貨、上架、揀貨、出貨），同時在各儲存與配銷據點持續監測溫度與濕度。其存在目的是使受 GxP 管制及冷鏈產品維持於所需條件，並提供全程佐證。", "smci_en": "Fits ruggedized industrial-edge nodes at each site to aggregate WMS and environmental-monitoring streams, plus small on-prem app/DB servers. Node-scale and site-count-driven, not heavy compute — sized by number of sites and sensor density.", "smci_zh": "適配各據點的強固型工業邊緣節點以彙整 WMS 與環境監控串流，並搭配少量地端應用／資料庫伺服器。屬節點層級、由據點數量驅動，非高運算需求，規模依據點數與感測器密度而定。", "tech_en": "As a system-of-record, data-acquisition and workflow layer, it runs a transactional inventory database while environmental-monitoring gateways ingest time-series sensor streams from cold rooms and cleanrooms. Compute is light; ruggedized edge nodes at each plant and distribution site aggregate sensor and cold-chain data with local resilience.", "tech_zh": "作為紀錄系統、資料擷取與工作流程層，它運行交易型庫存資料庫，同時由環境監控閘道器擷取來自冷藏室與潔淨室的時序感測串流。運算需求輕，各廠區與配銷據點以強固型邊緣節點在本地具韌性地彙整感測與冷鏈資料。", "usage_flow": [{"en": "Receive & put away goods", "zh": "收貨與上架"}, {"en": "Sense environmental conditions", "zh": "感測環境條件"}, {"en": "Alert on excursions", "zh": "異常偏離告警"}, {"en": "Pick, pack & ship", "zh": "揀貨、包裝與出貨"}, {"en": "Log inventory & audit trail", "zh": "紀錄庫存與稽核軌跡"}]}}, {"id": "pat-process-twin", "name_en": "PAT & Process Digital Twin (Process Development Analytics / Simulation)", "name_zh": "製程分析技術（PAT）與製程數位分身／模擬（製程開發分析）", "name_full": "Process Analytical Technology and Process Digital Twin", "domain": "manufacturing-quality-supply-chain", "home_stakeholder": "other", "lifecycle": ["clinical", "manufacturing"], "role": ["analytics-artificial-intelligence", "data-acquisition", "integration"], "data_modality": ["time-series", "simulation", "artificial-intelligence-models"], "deployment": ["on-premises", "edge", "private-cloud", "hybrid"], "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3}, "infrastructure_notes": "GPU/edge inference for real-time spectral models on the line plus GPU/HPC for bioprocess simulation and digital-twin runs; sizing scales with model complexity and number of monitored unit operations.", "hardware_profile": ["gpu-server", "high-performance-computing-cpu", "edge-industrial"], "hardware_profile_sizing": {"gpu-server": "rack", "high-performance-computing-cpu": "rack", "edge-industrial": "node"}, "plays": ["play-c"], "vendors": ["aspentech", "bruker", "sartorius", "siemens", "tulip-interfaces"], "evidence_note": null, "workload_envelope": {"scaling_driver": "monitored unit operations and real-time process-model complexity", "gpu_role": "mixed", "capacity_band": "none", "availability_class": "standard", "latency_class": "real-time", "data_growth": "low", "io_pattern": "mixed", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Real-time spectral inference at the line paired with GPU/HPC bioprocess simulation and digital-twin runs."}, "detail": {"purpose_en": "PAT and process digital twin apply real-time analytical models on the production line and simulate the bioprocess so quality can be understood and controlled during manufacture rather than only tested afterward. They exist to enable real-time release thinking, deeper process understanding, and faster process development.", "purpose_zh": "製程分析技術（PAT）與製程數位孿生在生產線上套用即時分析模型並模擬生物製程，使品質能在製造過程中被理解與控制，而非僅於事後檢驗。其存在目的是實現即時放行的思維、更深入的製程理解，以及更快的製程開發。", "smci_en": "Fits GPU servers and HPC CPU compute at rack scale for simulation and digital-twin runs, plus industrial-edge GPU nodes on the line for real-time spectral inference. Mixed inference/compute; sized by process-model complexity and monitored unit operations.", "smci_zh": "適配機櫃層級的 GPU 伺服器與 HPC CPU 運算供模擬與數位孿生，並在產線上配置工業邊緣 GPU 節點供即時光譜推論。屬推論與運算混合型，規模依製程模型複雜度與受監控單元操作數而定。", "tech_en": "As an analytics/AI, data-acquisition and integration layer, it runs GPU/edge inference on in-line spectral models to predict critical quality attributes, and uses GPU/HPC compute for bioprocess simulation and digital-twin runs over time-series, simulation and AI-model data. Sizing scales with model complexity and the number of monitored unit operations.", "tech_zh": "作為分析／AI、資料擷取與整合層，它以 GPU／邊緣推論運行線上光譜模型以預測關鍵品質屬性，並運用 GPU/HPC 運算對時序、模擬與 AI 模型資料執行生物製程模擬與數位孿生。規模隨模型複雜度與受監控單元操作數而增。", "usage_flow": [{"en": "Acquire in-line spectra/sensors", "zh": "擷取線上光譜／感測"}, {"en": "Run real-time model inference", "zh": "執行即時模型推論"}, {"en": "Predict quality attributes", "zh": "預測品質屬性"}, {"en": "Simulate process / digital twin", "zh": "模擬製程／數位孿生"}, {"en": "Feed control & release decisions", "zh": "回饋控制與放行決策"}]}}, {"id": "automated-visual-inspection", "name_en": "Automated Visual Inspection / Machine-Vision QC (deep learning)", "name_zh": "自動化視覺檢測與機器視覺品管（深度學習）", "name_full": "Automated Visual Inspection and Machine-Vision Quality Control (deep learning)", "domain": "manufacturing-quality-supply-chain", "home_stakeholder": "other", "lifecycle": ["manufacturing"], "role": ["data-acquisition", "analytics-artificial-intelligence"], "data_modality": ["images", "artificial-intelligence-models"], "deployment": ["edge", "on-premises"], "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization", "medical-technology-in-vitro-diagnostics"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer", "original-equipment-manufacturer"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3, "original-equipment-manufacturer": 3}, "infrastructure_notes": "Deep-learning visual inspection of vials/syringes/finished devices; GPU inference node per fill-finish/packaging line edge under GxP validation. Edge-GPU count scales with line count; validated-change docs part of the sale.", "hardware_profile": ["gpu-server", "edge-industrial"], "hardware_profile_sizing": {"gpu-server": "node", "edge-industrial": "node"}, "plays": ["play-c"], "vendors": ["antares-vision", "cognex", "keyence", "koerber", "optel-group", "syntegon"], "evidence_note": null, "workload_envelope": {"scaling_driver": "fill-finish and packaging lines and images inspected per line", "gpu_role": "inference", "capacity_band": "none", "availability_class": "standard", "latency_class": "real-time", "data_growth": "low", "io_pattern": "light", "concurrency": "low", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Deep-learning inspection of vials, syringes and finished devices; edge GPU inference node per line under GxP validation."}, "detail": {"purpose_en": "Automated visual inspection uses deep-learning machine vision to detect defects in vials, syringes and finished devices on the fill-finish and packaging lines, replacing or augmenting manual inspection. It exists to raise detection reliability and throughput on high-speed lines under GxP validation.", "purpose_zh": "自動化視覺檢測運用深度學習機器視覺，在充填封裝與包裝線上偵測小瓶、注射器與成品裝置的瑕疵，取代或輔助人工檢查。其存在目的是在 GxP 驗證下提升高速產線的偵測可靠度與產能。", "smci_en": "Fits an industrial-edge GPU inference node per line (compact edge or short-depth GPU server), scaling node count with the number of fill-finish/packaging lines. Sized by lines and images inspected per line; controlled BOM and validated-change docs travel with the hardware.", "smci_zh": "適配每條產線一台工業邊緣 GPU 推論節點（精巧邊緣型或短機身 GPU 伺服器），節點數量隨充填封裝／包裝線數而增。規模依產線數與每條線檢測影像量而定；受控 BOM 與驗證變更文件須隨硬體交付。", "tech_en": "As a data-acquisition and analytics/AI layer, cameras feed high-resolution images to a GPU inference node at the line edge, where deep-learning models classify defects in real time and drive reject actuation. One GPU inference node typically sits per fill-finish/packaging line under GxP, with validated-change documentation part of the deployment.", "tech_zh": "作為資料擷取與分析／AI 層，攝影機將高解析度影像送至產線邊緣的 GPU 推論節點，由深度學習模型即時判別瑕疵並驅動剔退動作。在 GxP 下通常每條充填封裝／包裝線配置一台 GPU 推論節點，並將驗證變更文件納入部署。", "usage_flow": [{"en": "Capture line images", "zh": "擷取產線影像"}, {"en": "Run GPU defect inference", "zh": "執行 GPU 瑕疵推論"}, {"en": "Classify pass/fail", "zh": "判定合格／不合格"}, {"en": "Reject & log results", "zh": "剔退並紀錄結果"}]}}, {"id": "clinical-data-lakehouse", "name_en": "Clinical Data Warehouse / Health Data Lakehouse", "name_zh": "臨床資料倉儲／健康資料湖倉", "name_full": "Clinical Data Warehouse and Health Data Lakehouse", "domain": "data-analytics-payer-platforms", "home_stakeholder": "facility", "lifecycle": ["clinical", "research"], "role": ["analytics-artificial-intelligence", "infrastructure-platform"], "data_modality": ["transactional", "documents", "time-series", "omics"], "deployment": ["on-premises", "private-cloud", "hybrid", "public-cloud"], "segments": ["hospital-health-system", "academic-medical-center"], "hospital_view": {"stakeholder": ["facility"], "dimension": ["admin", "ops"]}, "hardware_opportunity": 3, "hardware_buyer": ["customer", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3}, "infrastructure_notes": "High-capacity tiered storage (object plus fast analytics tier) and ETL/query compute; growing GPU demand for NLP/LLM over clinical notes. Sizing driven by bed count, retention years, and modality breadth (notes, waveforms, omics).", "hardware_profile": ["gpu-server", "high-performance-computing-cpu", "nvme-performance-storage", "capacity-archive-storage"], "hardware_profile_sizing": {"gpu-server": "node", "high-performance-computing-cpu": "rack", "nvme-performance-storage": "rack", "capacity-archive-storage": "rack"}, "plays": [], "play_exemption": "Cross-cutting clinical data warehouse / lakehouse — a standalone data-platform infrastructure deal (object + fast-analytics tier + growing clinical-note NLP GPU), not the sequencing/research-AI motion of Play B", "vendors": ["databricks", "health-catalyst", "intersystems", "snowflake"], "evidence_note": null, "workload_envelope": {"scaling_driver": "data-modality breadth ingested and total retained clinical record volume across the covered patient population", "gpu_role": "inference", "capacity_band": "hundreds-of-terabytes", "availability_class": "standard", "latency_class": "real-time", "data_growth": "high", "io_pattern": "mixed", "concurrency": "high", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Warehouse compute mixes interactive analyst query with heavy batch extract-transform-load and emerging language-model passes over clinical notes."}, "detail": {"purpose_en": "A unified analytics repository that consolidates data from EHR, imaging, lab, waveform and omics systems into one governed platform, so a health system can run population reporting, quality measures, research and AI on a single source of truth instead of siloed source systems.", "purpose_zh": "統一的分析資料儲存庫，將電子病歷、影像、檢驗、波形與體學等來源系統的資料整合進一個受治理的平台，讓醫療體系能在單一可信資料源上執行族群報表、品質指標、研究與 AI，而非分散於各孤島系統。", "smci_en": "Fits SMCI high-capacity storage servers and JBOD for the object/archive tier, NVMe all-flash nodes for the hot analytics tier, HPC CPU nodes for ETL and query, and a small GPU-server tier for clinical-notes NLP/LLM inference — typically a rack-scale build sized by bed count, retention years and modality breadth.", "smci_zh": "適用美超微高容量儲存伺服器與 JBOD 作為物件/歸檔層、NVMe 全快閃節點作為熱分析層、HPC CPU 節點負責 ETL 與查詢，再加一小組 GPU 伺服器供臨床病歷 NLP/LLM 推論——通常為機架級部署，依床位數、保存年限與資料模態廣度定規模。", "tech_en": "It lands transactional records, clinical documents, time-series waveforms and omics into a tiered store — an object/capacity layer for the raw and historical data plus a fast NVMe analytics tier for query — with heavy ETL/ELT compute for normalization to a common data model. GPU inference is increasingly attached to run NLP and LLM extraction over unstructured clinical notes.", "tech_zh": "系統將交易紀錄、臨床文件、時序波形與體學資料落地至分層儲存——以物件/容量層存放原始與歷史資料，並以高速 NVMe 分析層供查詢——並以大量 ETL/ELT 運算正規化至共同資料模型。近年愈來愈多附掛 GPU 推論，用以對非結構化臨床病歷執行 NLP 與 LLM 抽取。", "usage_flow": [{"en": "Ingest from source systems", "zh": "自來源系統擷取資料"}, {"en": "Normalize & map to common model", "zh": "正規化並對應共同資料模型"}, {"en": "Store tiered (fast + object)", "zh": "分層儲存（高速層+物件層）"}, {"en": "Query, model & run NLP/LLM", "zh": "查詢、建模並執行 NLP/LLM"}, {"en": "Serve dashboards & cohorts", "zh": "供應儀表板與世代查詢"}]}}, {"id": "population-health-analytics", "name_en": "Population Health & Risk Analytics", "name_zh": "族群健康管理與風險分析", "name_full": "Population Health and Risk Analytics", "domain": "data-analytics-payer-platforms", "home_stakeholder": "other", nkage; some pharma run private analytics enclaves. Sizing by covered lives and unstructured document volume.", "hardware_profile": ["gpu-server", "capacity-archive-storage"], "hardware_profile_sizing": {"gpu-server": "rack", "capacity-archive-storage": "cluster"}, "plays": [], "play_exemption": "Operator-side real-world-data / claims analytics platform (warehouse + software-as-a-service); a data-platform co-sell, not the sequencing / research-AI motion of Play B", "vendors": ["aetion", "flatiron-health", "iqvia", "komodo-health", "tempus", "trinetx", "truveta"], "evidence_note": null, "workload_envelope": {"scaling_driver": "covered lives and volume of unstructured clinical documents linked and abstracted", "gpu_role": "inference", "capacity_band": "petabyte-plus", "availability_class": "standard", "latency_class": "interactive", "data_growth": "high", "io_pattern": "mixed", "concurrency": "high", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Hardware concentrates at the data operator; petabyte-class lake plus language-model chart abstraction and clinico-genomic linkage."}, "detail": {"purpose_en": "A platform that turns real-world data — claims, EHR, and unstructured clinical documents, often linked to genomics — into real-world evidence for pharma and CROs, supporting regulatory submissions, comparative-effectiveness studies and post-market research beyond the randomized trial.", "purpose_zh": "將真實世界資料——理賠、電子病歷與非結構化臨床文件，常連結至基因體資料——轉化為真實世界證據的平台，供藥廠與 CRO 用於法規申報、比較療效研究及上市後研究，補足隨機試驗之外的證據。", "smci_en": "Best fit is the data-operator co-sell (and pharma private enclaves): SMCI GPU servers for NLP/LLM chart abstraction paired with high-capacity archive JBOD for the petabyte data lake — a rack of GPU plus cluster-scale storage sized by covered lives and unstructured-document volume.", "smci_zh": "最佳切入為資料營運商協同銷售（及藥廠私有封閉環境）：以美超微 GPU 伺服器執行 NLP/LLM 病歷抽取，搭配高容量歸檔 JBOD 承載 PB 級資料湖——一機架 GPU 加叢集級儲存，依涵蓋人數與非結構化文件量定規模。", "tech_en": "It stores petabyte-class multi-source data lakes (real-world data, documents, omics), applies GPU-accelerated NLP/LLM for chart abstraction, and performs clinico-genomic record linkage across covered lives. Delivery is SaaS/cloud-led, so most hardware sits with the data operator, though some pharma run private on-prem analytics enclaves for sensitive datasets.", "tech_zh": "系統儲存 PB 級的多來源資料湖（真實世界資料、文件、體學），以 GPU 加速的 NLP/LLM 執行病歷抽取，並跨涵蓋人口進行臨床-基因體紀錄連結。交付以 SaaS/雲端為主，故多數硬體位於資料營運商端，惟部分藥廠會為敏感資料集自建私有地端分析封閉環境。", "usage_flow": [{"en": "Acquire & link RWD sources", "zh": "取得並連結真實世界資料源"}, {"en": "Abstract charts via NLP/LLM", "zh": "以 NLP/LLM 抽取病歷"}, {"en": "Curate cohorts & datasets", "zh": "策展世代與資料集"}, {"en": "Run studies & models", "zh": "執行研究與建模"}, {"en": "Generate evidence & reports", "zh": "產出證據與報告"}]}}, {"id": "hie-interoperability-engine", "name_en": "HIE / Interoperability Engine", "name_zh": "醫療資訊交換（HIE）與互通引擎", "name_full": "Health Information Exchange and Interoperability Engine", "domain": "data-analytics-payer-platforms", "home_stakeholder": "facility", "lifecycle": ["clinical"], "role": ["integration"], "data_modality": ["transactional", "documents"], "deployment": ["on-premises", "private-cloud", "hybrid", "software-as-a-service"], "segments": ["hospital-health-system", "academic-medical-center", "diagnostic-reference-laboratory", "payer"], "hospital_view": {"stakeholder": ["facility"], "dimension": ["ops"]}, "hardware_opportunity": 2, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 2, "operator": 2}, "infrastructure_notes": "Modest general-purpose compute but strict HA/DR — message brokers cannot drop clinical feeds, so clustered pairs and dual-site failover are standard. Sizing by interface count and HL7/FHIR message volume; no meaningful GPU.", "hardware_profile": ["high-availability-redundant", "disaster-recovery-backup"], "hardware_profile_sizing": {"high-availab ion)", "domain": "data-analytics-payer-platforms", "home_stakeholder": "other", "lifecycle": ["commercial"], "role": ["system-of-record", "workflow"], "data_modality": ["transactional", "documents"], "deployment": ["on-premises", "private-cloud", "vendor-managed", "software-as-a-service"], "segments": ["payer"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3, "operator": 3}, "infrastructure_notes": "High-availability transactional compute and database storage; nightly batch adjudication windows drive CPU sizing, and regulatory DR mandates push dual-site deployments. Legacy platform modernization (mainframe to x86) creates refresh events.", "hardware_profile": ["nvme-performance-storage", "high-availability-redundant", "disaster-recovery-backup"], "hardware_profile_sizing": {"nvme-performance-storage": "rack", "high-availability-redundant": "rack", "disaster-recovery-backup": "rack"}, "plays": ["play-d"], "vendors": ["cognizant-trizetto", "healthedge", "plexis-healthcare-systems"], "evidence_note": null, "workload_envelope": {"scaling_driver": "claims transaction volume and covered member count", "gpu_role": "none", "capacity_band": "hundreds-of-terabytes", "availability_class": "mission-critical", "latency_class": "interactive", "data_growth": "high", "io_pattern": "mixed", "concurrency": "high", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Transactional adjudication database with nightly batch windows and mandatory dual-site disaster recovery."}, "detail": {"purpose_en": "The insurer's system of record for enrollment, benefits and claims adjudication — it receives each claim, applies benefit and contract rules, and decides what to pay, forming the transactional core that runs a health plan's day-to-day operations.", "purpose_zh": "保險方在投保、給付與理賠核付上的紀錄系統——接收每筆理賠、套用給付與合約規則並裁定支付金額，構成營運健保計畫日常作業的交易核心。", "smci_en": "Fits SMCI HA-redundant server pairs with NVMe all-flash for the transactional database and a full DR site — a rack-scale build sized by claims volume and member count. The mainframe-to-x86 modernization wave is the primary refresh event to target.", "smci_zh": "適用美超微 HA 冗餘伺服器配對，搭配 NVMe 全快閃承載交易資料庫並建置完整 DR 站點——為機架級部署，依理賠量與會員數定規模。由大型主機遷移至 x86 的現代化浪潮為主要更新切入點。", "tech_en": "It is a high-volume transactional database and rules engine: real-time and nightly batch adjudication runs drive heavy CPU demand, while regulatory requirements mandate high availability and dual-site DR. Storage is transactional (fast NVMe) rather than analytical; legacy mainframe-to-x86 modernization is a recurring refresh trigger.", "tech_zh": "系統為高流量交易資料庫與規則引擎：即時與夜間批次核付作業帶來沉重 CPU 需求，法規則要求高可用性與雙站點 DR。儲存屬交易型（高速 NVMe）而非分析型；由大型主機遷移至 x86 的現代化為反覆出現的更新契機。", "usage_flow": [{"en": "Enroll members & benefits", "zh": "登錄會員與給付方案"}, {"en": "Receive claims", "zh": "接收理賠件"}, {"en": "Adjudicate against rules", "zh": "依規則核付"}, {"en": "Batch process & pay", "zh": "批次處理與支付"}, {"en": "Store & report", "zh": "儲存與報表"}]}}, {"id": "payer-um-fraud-analytics", "name_en": "Payer Care/Utilization Management & Fraud Analytics", "name_zh": "保險照護管理、醫療利用管理與詐欺分析", "name_full": "Payer Care Management, Utilization Management and Fraud Analytics", "domain": "data-analytics-payer-platforms", "home_stakeholder": "other", "lifecycle": ["clinical", "commercial"], "role": ["workflow", "analytics-artificial-intelligence"], "data_modality": ["transactional", "documents"], "deployment": ["software-as-a-service", "public-cloud", "private-cloud", "on-premises"], "segments": ["payer"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3, "operator": 2}, "infrastructure_notes": "UM and care management are SaaS-dominant; the hardware angle is fraud/waste/abuse ML at large or single-payer/government insurers, which run on-prem model training and scoring over full claims history. Sizing by claims volume and retraining cadence.", "hardware_profile": ["high-performance-computing-cpu"], "hardware_profile_sizing": {"high-performance-computing-cpu": "rack"}, "plays": [], "play_exemption": "Payer analytics; payer segment sits outside the three provider/pharma plays", "vendors": ["codoxo", "cotiviti", "sas", "zeomega"], "evidence_note": null, "workload_envelope": {"scaling_driver": "total claims volume scored and model retraining cadence", "gpu_role": "none", "capacity_band": "none", "availability_class": "standard", "latency_class": "interactive", "data_growth": "moderate", "io_pattern": "high-throughput-parallel", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Utilization management is SaaS-dominant; the iron is fraud, waste and abuse model training and scoring at large or government payers."}, "detail": {"purpose_en": "Software that manages utilization and care review while flagging fraud, waste and abuse in claims — steering appropriate care and protecting the plan's spend by scoring claims and provider behavior against learned patterns.", "purpose_zh": "管理使用率與照護審查、同時標記理賠中詐欺、浪費與濫用的軟體——透過對理賠及提供者行為依習得模式評分，引導適當照護並保護計畫支出。", "smci_en": "Fits SMCI HPC CPU-dense servers for claims-history model training and scoring at large or government payers — a rack-scale compute footprint. GPU is not the driver here; the sell is CPU throughput over full claims history and retraining cadence.", "smci_zh": "適用美超微 HPC CPU 密集型伺服器，供大型或政府保險機構進行理賠歷史模型訓練與評分——為機架級運算足跡。此處 GPU 非關鍵；銷售訴求在於針對完整理賠歷史的 CPU 吞吐量與重訓頻率。", "tech_en": "Utilization and care-management workflows are SaaS-dominant, but the fraud/waste/abuse machine-learning layer trains and scores over the full transactional claims history, which is where the on-prem hardware angle lives at large or single-payer/government insurers. It is CPU-heavy analytics; sizing follows claims volume and model-retraining cadence rather than GPU.", "tech_zh": "使用率與照護管理流程以 SaaS 為主，但詐欺/浪費/濫用的機器學習層需針對完整交易理賠歷史進行訓練與評分，此即大型或單一支付方/政府保險機構的地端硬體切入點。屬 CPU 密集型分析；規模依理賠量與模型重訓頻率而定，非 GPU。", "usage_flow": [{"en": "Ingest claims & history", "zh": "擷取理賠與歷史資料"}, {"en": "Train fraud/UM models", "zh": "訓練詐欺/使用管理模型"}, {"en": "Score claims & providers", "zh": "評分理賠與提供者"}, {"en": "Flag & route for review", "zh": "標記並轉交審查"}, {"en": "Retrain on feedback", "zh": "依回饋重新訓練"}]}}, {"id": "samd-embedded-oem-platform", "name_en": "SaMD & Embedded Device Software Platform (OEM)", "name_zh": "醫療器材軟體（SaMD）與嵌入式裝置軟體平台", "name_full": "Software as a Medical Device and Embedded Device Software Platform (original equipment manufacturer)", "domain": "medical-technology-device-software", "home_stakeholder": "other", "lifecycle": ["preclinical", "clinical", "post-market"], "role": ["regulated-software-as-a-medical-device", "infrastructure-platform"], "data_modality": ["time-series", "images", "simulation", "artificial-intelligence-models"], "deployment": ["edge", "software-as-a-service"], "segments": ["medical-technology-in-vitro-diagnostics"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["original-equipment-manufacturer", "customer"], "primary_buyer": "original-equipment-manufacturer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3, "original-equipment-manufacturer": 3}, "infrastructure_notes": "Two-sided pull: embedded/edge compute designed into devices as long-lifecycle, regulatory-locked BOMs (volume design wins), plus OEM-side V&V, simulation, and on-device AI model-training clusters. Sizing by device fleet volume and AI content per device.", "hardware_profile": ["gpu-server", "high-performance-computing-cpu", "edge-industrial"], "hardware_profile_sizing": {"gpu-server": "rack", "high-performance-computing-cpu": "rack", "edge-industrial": "node"}, "plays": [], "play_exemption": "OEM embedded design-win — medtech / in-vitro-diagnostics device software; a per-unit board/edge bill-of-materials channel deal, not a hospital imaging/genomics/manufacturing play", "vendors": ["blackberry-qnx", "green-hills-software", "nvidia", "wind-river"], "evidence_note": null, "workload_envelope": {"scaling_driver": "units shipped per year and the artificial-intelligence inference content designed into each device", "gpu_role": "mixed", "capacity_band": "none", "availability_class": "standard", "latency_class": "real-time", "data_growth": "low", "io_pattern": "mixed", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "The embedded per-unit bill-of-materials and the original-equipment-manufacturer verification, simulation and model-training clusters size as two independent motions."}, "detail": {"purpose_en": "The software that a medical-device or IVD maker builds into its products (Software as a Medical Device plus the embedded firmware/AI running on the instrument) so the device can sense, analyze, and act under regulatory clearance. It exists because modern diagnostic and therapeutic devices increasingly deliver their clinical value through on-device software and AI, not just mechanics.", "purpose_zh": "醫療器材或體外診斷（IVD）製造商內建於產品中的軟體，包含「軟體即醫療器材」（SaMD）以及運行於儀器上的嵌入式韌體與 AI，使裝置能在法規許可下進行感測、分析與執行。它之所以存在，是因為現代診斷與治療裝置的臨床價值越來越倚賴機上軟體與 AI，而非僅靠機械結構。", "smci_en": "Two-sided fit: rack-scale GPU servers plus HPC compute nodes at the OEM for AI model training, verification/validation, and simulation, and industrial edge nodes as the embedded compute designed into each device as a long-lifecycle, locked BOM. Sizing scales with annual units shipped and the AI inference content per device.", "smci_zh": "雙邊契合：OEM 端採用機櫃級 GPU 伺服器搭配 HPC 運算節點，用於 AI 模型訓練、驗證確效與模擬；並以工業級邊緣節點作為設計進每台裝置、長生命週期且鎖定 BOM 的嵌入式運算。規模隨年出貨台數與每台裝置的 AI 推論含量而擴展。", "tech_en": "Two workload tiers: on the device, edge-industrial compute runs real-time inference over time-series, image, and sensor streams under a frozen, regulatory-locked bill of materials with a long service life; at the OEM, GPU and HPC-CPU clusters handle model training, verification & validation, and physics/simulation runs. Deployment is edge (embedded per unit) plus SaaS for fleet telemetry, model management, and update distribution, with strict change-control and traceability because the software is a regulated medical device.", "tech_zh": "分為兩層工作負載：裝置端以工業級邊緣運算，在鎖定且法規凍結、服役週期長的物料清單（BOM）上，對時間序列、影像與感測串流執行即時推論；OEM 端則以 GPU 與 HPC-CPU 叢集進行模型訓練、驗證與確效（V&V）以及物理／模擬運算。部署方式為邊緣（每台裝置嵌入）加上用於裝置機隊遙測、模型管理與更新派送的 SaaS，並因軟體屬受監管醫療器材而需嚴格的變更控管與可追溯性。", "usage_flow": [{"en": "Design & train device AI (OEM)", "zh": "設計並訓練裝置 AI（OEM 端）"}, {"en": "V&V + simulation, regulatory lock", "zh": "驗證確效與模擬、法規鎖定"}, {"en": "Embed into device BOM", "zh": "嵌入裝置物料清單（BOM）"}, {"en": "Edge inference on the instrument", "zh": "儀器端邊緣推論"}, {"en": "Field telemetry back to OEM", "zh": "現場遙測回傳 OEM"}, {"en": "Retrain & release update", "zh": "再訓練並發布更新"}]}}, {"id": "ai-hpc-orchestration", "name_en": "AI / HPC Workload Orchestration & MLOps (cluster scheduling)", "name_zh": "AI／高效能運算工作負載調度與 MLOps 平台", "name_full": "Artificial Intelligence and High-Performance Computing Workload Orchestration and Machine Learning Operations", "domain": "pharmaceutical-research-clinical-development", "home_stakeholder": "other", "lifecycle": ["research", "preclinical", "clinical"], "role": ["infrastructure-platform", "workflow"], "data_modality": ["artificial-intelligence-models"], "deployment": ["on-premises", "hybrid", "private-cloud", "software-as-a-service"], "segments": ["academic-medical-center", "biotechnology-pharmaceutical", "contract-research-organization", "diagnostic-reference-laboratory"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3, "operator": 3}, "infrastructure_notes": "GPU/HPC scheduler + MLOps layer (batch queue / container orchestration / GPU partitioning) that anchors and sizes on-prem GPU/HPC clusters. The single most natural ISV co-sell for a GPU/server vendor; sizes to aggregate job concurrency.", "hardware_profile": ["gpu-server", "high-performance-computing-cpu"], "hardware_profile_sizing": {"gpu-server": "cluster", "high-performance-computing-cpu": "cluster"}, "plays": ["play-b"], "vendors": ["altair", "hewlett-packard-enterprise", "ibm", "nvidia", "seqera"], "evidence_note": null, "workload_envelope": {"scaling_driver": "aggregate concurrent GPU jobs across the cluster", "gpu_role": "mixed", "capacity_band": "none", "availability_class": "standard", "latency_class": "batch", "data_growth": "low", "io_pattern": "mixed", "concurrency": "massive", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": null}, "detail": {"purpose_en": "The scheduling and MLOps layer that sits on top of a GPU/HPC cluster — batch queuing, container orchestration, GPU partitioning, and job/experiment tracking. It exists to keep expensive GPU/HPC hardware fully utilized across many users and jobs.", "purpose_zh": "位於GPU／HPC叢集之上的排程與MLOps層——批次排隊、容器編排、GPU分割以及作業／實驗追蹤。存在目的是讓昂貴的GPU／HPC硬體在眾多使用者與作業間維持滿載。", "smci_en": "This layer directly anchors GPU server and HPC CPU clusters, making it the most natural ISV co-sell for a server vendor. It is sized to aggregate cluster job concurrency at cluster scale.", "smci_zh": "此層直接錨定GPU伺服器與HPC CPU叢集，是伺服器廠商最自然的ISV共同銷售切入點。依叢集整體作業並行度以叢集規模部署。", "tech_en": "A GPU/HPC scheduler plus MLOps layer — batch queue, container orchestration, and GPU partitioning — anchors and sizes the on-prem GPU/HPC cluster beneath it. It scales to aggregate job concurrency across the cluster.", "tech_zh": "GPU／HPC排程器加MLOps層（批次佇列、容器編排與GPU分割）錨定並決定其下地端GPU／HPC叢集的規模。依叢集整體作業並行度調整規模。", "usage_flow": [{"en": "Submit jobs", "zh": "提交作業"}, {"en": "Schedule & queue", "zh": "排程與排隊"}, {"en": "Partition & allocate GPUs", "zh": "分割並配置 GPU"}, {"en": "Run & track", "zh": "執行與追蹤"}, {"en": "Release & reclaim", "zh": "釋放並回收資源"}]}}, {"id": "pharmacometrics-modeling-simulation", "name_en": "Pharmacometrics & Clinical Pharmacology Modeling & Simulation", "name_zh": "藥物計量學與臨床藥理建模模擬", "name_full": "Pharmacometrics and Clinical Pharmacology Modeling and Simulation (population pharmacokinetics and pharmacodynamics, physiologically-based pharmacokinetics, quantitative systems pharmacology, clinical-trial simulation)", "domain": "pharmaceutical-research-clinical-development", "home_stakeholder": "other", "lifecycle": ["preclinical", "clinical"], "role": ["analytics-artificial-intelligence", "workflow"], "data_modality": ["simulation", "transactional"], "deployment": ["on-premises", "private-cloud", "hybrid"], "segments": ["biotechnology-pharmaceutical", "contract-research-organization", "academic-medical-center"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer", "operator"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3, "operator": 2}, "hardware_profile": ["high-performance-computing-cpu", "high-memory"], "hardware_profile_sizing": {"high-performance-computing-cpu": "rack", "high-memory": "node"}, "infrastructure_notes": "Embarrassingly-parallel population pharmacokinetic/pharmacodynamic estimation (NONMEM/NLME), covariate searches, bootstrap and virtual-population trial simulation fan out across CPU cores; quantitative-systems-pharmacology and physiologically-based models add large-memory nodes. Validated on-prem/private grids for licensing and regulatory compliance. Sized by concurrent estimation jobs.", "plays": ["play-b"], "vendors": ["certara", "icon-plc", "metrum-research-group", "open-systems-pharmacology", "simulations-plus"], "evidence_note": "Added via completeness audit (opus-verified gap); distinct from comp-chem-simulation and clinical-trial-suite.", "workload_envelope": {"scaling_driver": "concurrent estimation and bootstrap replicate jobs", "gpu_role": "none", "capacity_band": "none", "availability_class": "standard", "latency_class": "interactive", "data_growth": "low", "io_pattern": "high-throughput-parallel", "concurrency": "high", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": null}, "detail": {"purpose_en": "Models how drugs move through and act on the body (PK/PD, PBPK, QSP) and simulates clinical trials to inform dosing and trial design. It exists to quantify drug behavior and de-risk clinical decisions through modeling.", "purpose_zh": "模擬藥物在體內的動態與作用（PK／PD、PBPK、QSP）並模擬臨床試驗，以指導給藥與試驗設計。存在目的是以模型量化藥物行為並降低臨床決策風險。", "smci_en": "HPC CPU-dense compute nodes run the parallel estimation and bootstrap grid, with high-memory nodes carrying the QSP/PBPK models — a rack-scale validated grid that needs no GPU.", "smci_zh": "以HPC高密度CPU運算節點執行平行估計與自助抽樣格網，並以高記憶體節點承載QSP／PBPK模型——機櫃規模的驗證格網，無需GPU。", "tech_en": "Embarrassingly-parallel population PK/PD estimation (NONMEM/NLME), covariate searches, and bootstrap replicates fan out across CPU cores, while QSP and PBPK models add large-memory nodes. Validated on-prem or private grids satisfy licensing and regulatory compliance; there is no GPU workload, and sizing follows concurrent estimation jobs.", "tech_zh": "高度平行的族群PK／PD估計（NONMEM／NLME）、共變數搜尋與自助抽樣分散於多CPU核心，QSP與PBPK模型則需高記憶體節點。為授權與法規合規採經驗證的地端或私有運算格網；無GPU工作負載，規模依並行估計作業數而定。", "usage_flow": [{"en": "Assemble PK/PD data", "zh": "彙整 PK／PD 資料"}, {"en": "Build & estimate model", "zh": "建立並估計模型"}, {"en": "Run covariate/bootstrap search", "zh": "執行共變數／自助抽樣搜尋"}, {"en": "Simulate virtual populations/trials", "zh": "模擬虛擬族群／試驗"}, {"en": "Report for submission", "zh": "產出送件報告"}]}}, {"id": "ms-proteomics-metabolomics", "name_en": "Mass-Spectrometry Proteomics & Metabolomics Informatics", "name_zh": "質譜蛋白質體學與代謝體學資訊分析", "name_full": "Mass-Spectrometry Proteomics and Metabolomics Informatics", "domain": "pharmaceutical-research-clinical-development", "home_stakeholder": "other", "lifecycle": ["research", "preclinical", "clinical"], "role": ["analytics-artificial-intelligence", "data-acquisition"], "data_modality": ["omics", "artificial-intelligence-models"], "deployment": ["on-premises", "private-cloud", "hybrid"], "segments": ["biotechnology-pharmaceutical", "academic-medical-center", "diagnostic-reference-laboratory", "contract-research-organization"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer", "operator"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3, "operator": 2}, "hardware_profile": ["high-performance-computing-cpu", "high-memory", "nvme-performance-storage", "capacity-archive-storage"], "hardware_profile_sizing": {"high-performance-computing-cpu": "rack", "high-memory": "node", "nvme-performance-storage": "rack", "capacity-archive-storage": "rack"}, "infrastructure_notes": "Parallel spectral-library and database search plus data-independent-acquisition deconvolution (MaxQuant / DIA-NN / Spectronaut / FragPipe) are CPU-bound with large-memory nodes; NVMe scratch; accumulating raw instrument files drive archive growth; emerging GPU for deep-learning spectral and retention-time prediction. Sized by sample throughput. Distinct from NGS-scoped bioinformatics-secondary.", "plays": ["play-b"], "vendors": ["biognosys", "bruker", "matrix-science", "nonlinear-dynamics-waters", "sciex", "thermo-fisher-scientific"], "evidence_note": "Added via completeness audit (opus-verified gap).", "workload_envelope": {"scaling_driver": "samples analyzed per day and per-run raw file size", "gpu_role": "none", "capacity_band": "hundreds-of-terabytes", "availability_class": "standard", "latency_class": "batch", "data_growth": "high", "io_pattern": "high-throughput-parallel", "concurrency": "high", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": null}, "detail": {"purpose_en": "Turns mass-spectrometry raw data into identified and quantified proteins and metabolites via spectral-library and database search and data-independent-acquisition deconvolution. It exists to read the protein and metabolite content of biological samples at scale.", "purpose_zh": "透過光譜庫與資料庫搜尋以及資料獨立擷取（DIA）解卷積，將質譜原始資料轉化為已鑑定並定量的蛋白質與代謝物。存在目的是大規模讀取生物樣本的蛋白質與代謝物組成。", "smci_en": "HPC CPU nodes carry the search and deconvolution workload, high-memory nodes handle large searches, NVMe provides scratch, and high-capacity archive stores accumulating raw files — rack scale, and largely CPU-bound today.", "smci_zh": "以HPC CPU節點承載搜尋與解卷積工作，高記憶體節點供大型搜尋，NVMe提供暫存，並以大容量歸檔存放累積的原始檔——機櫃規模，目前多以CPU為主。", "tech_en": "Parallel spectral-library and database search plus DIA deconvolution (MaxQuant/DIA-NN/Spectronaut/FragPipe) are CPU-bound and need large-memory nodes and NVMe scratch, while accumulating raw instrument files drive archive growth. Deep-learning spectral and retention-time prediction is an emerging GPU workload, and sizing follows sample throughput.", "tech_zh": "平行光譜庫與資料庫搜尋加DIA解卷積（MaxQuant／DIA-NN／Spectronaut／FragPipe）以CPU為主，需高記憶體節點與NVMe暫存，累積的原始儀器檔案則驅動歸檔成長。深度學習光譜與滯留時間預測為新興GPU需求，規模依樣本吞吐量而定。", "usage_flow": [{"en": "Acquire MS raw files", "zh": "取得質譜原始檔"}, {"en": "Search spectra / deconvolute", "zh": "搜尋光譜／解卷積"}, {"en": "Identify & quantify", "zh": "鑑定與定量"}, {"en": "Statistical analysis", "zh": "統計分析"}, {"en": "Archive raw + results", "zh": "歸檔原始檔與結果"}]}}, {"id": "spatial-biology-omics", "name_en": "Spatial Biology / Spatial-Omics Analysis", "name_zh": "空間生物學／空間體學分析", "name_full": "Spatial Biology and Spatial-Omics Analysis (spatial transcriptomics and multiplex tissue proteomics)", "domain": "pharmaceutical-research-clinical-development", "home_stakeholder": "other", "lifecycle": ["research", "preclinical"], "role": ["analytics-artificial-intelligence", "data-acquisition"], "data_modality": ["images", "omics", "artificial-intelligence-models"], "deployment": ["on-premises", "private-cloud", "hybrid"], "segments": ["academic-medical-center", "biotechnology-pharmaceutical", "diagnostic-reference-laboratory"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer", "operator"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3, "operator": 2}, "hardware_profile": ["gpu-server", "nvme-performance-storage", "capacity-archive-storage"], "hardware_profile_sizing": {"gpu-server": "rack", "nvme-performance-storage": "rack", "capacity-archive-storage": "cluster"}, "infrastructure_notes": "Deep-learning cell segmentation, image registration and stitching, and spatial modeling on GPU (Xenium / Visium / CosMx / PhenoCycler / MERFISH); NVMe working tier; multiplex whole-slide image and transcript stacks (hundreds of gigabytes to multiple terabytes per run) drive petabyte archive. Mirrors the cryogenic-electron-microscopy profile. Sized by run volume.", "plays": ["play-b"], "vendors": ["10x-genomics", "akoya-biosciences", "bruker-spatial-biology", "indica-labs", "vizgen"], "evidence_note": "Added via completeness audit (opus-verified gap); distinct from digital-pathology, bioinformatics-secondary, cryo-em-structural-bio.", "workload_envelope": {"scaling_driver": "spatial runs per week and per-run image and transcript volume", "gpu_role": "inference", "capacity_band": "petabyte-plus", "availability_class": "standard", "latency_class": "batch", "data_growth": "explosive", "io_pattern": "high-throughput-parallel", "concurrency": "moderate", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": null}, "detail": {"purpose_en": "Analyzes where molecules sit within tissue — spatial transcriptomics and multiplex tissue proteomics — combining imaging with omics to map cells and gene/protein expression in situ. It exists to preserve the spatial context lost in bulk and single-cell assays.", "purpose_zh": "分析分子在組織中的空間位置——空間轉錄體學與多重組織蛋白質體學——結合影像與體學，於原位描繪細胞與基因／蛋白質表現。存在目的是保留批量與單細胞分析中喪失的空間脈絡。", "smci_en": "GPU servers run segmentation and spatial modeling, an NVMe all-flash working tier feeds them, and petabyte-class capacity archive stores the multiplex image and transcript stacks — rack-to-cluster, mirroring the cryo-EM footprint.", "smci_zh": "以GPU伺服器執行分割與空間建模，NVMe全快閃工作層供給，並以PB級大容量歸檔存放多重影像與轉錄本堆疊——機櫃至叢集規模，輪廓與低溫電顯相近。", "tech_en": "Deep-learning cell segmentation, image registration and stitching, and spatial modeling run on GPU (Xenium/Visium/CosMx/PhenoCycler/MERFISH), with an NVMe working tier feeding them. Multiplex whole-slide image and transcript stacks (hundreds of GB to multiple TB per run) drive petabyte archive, mirroring the cryo-EM profile.", "tech_zh": "以GPU執行深度學習細胞分割、影像對位與拼接以及空間建模（Xenium／Visium／CosMx／PhenoCycler／MERFISH），並以NVMe工作層供給。多重全玻片影像與轉錄本堆疊（每次執行數百GB至數TB）驅動PB級歸檔，輪廓與低溫電顯相近。", "usage_flow": [{"en": "Ingest run (images + transcripts)", "zh": "匯入資料（影像＋轉錄本）"}, {"en": "Segment cells & register images", "zh": "細胞分割與影像對位"}, {"en": "Assign transcripts", "zh": "指派轉錄本"}, {"en": "Spatial modeling", "zh": "空間建模"}, {"en": "Visualize & archive", "zh": "視覺化與歸檔"}]}}, {"id": "healthcare-llm-serving", "name_en": "Healthcare Foundation-Model / LLM Serving Platform", "name_zh": "醫療基礎模型／大型語言模型服務平台", "name_full": "Healthcare Foundation-Model and Large Language Model Serving Platform (private on-premises generative-artificial-intelligence inference gateway)", "domain": "data-analytics-payer-platforms", "home_stakeholder": "facility", "lifecycle": ["clinical", "commercial"], "role": ["infrastructure-platform", "analytics-artificial-intelligence"], "data_modality": ["artificial-intelligence-models", "documents", "transactional"], "deployment": ["on-premises", "private-cloud", "hybrid"], "segments": ["hospital-health-system", "academic-medical-center", "biotechnology-pharmaceutical"], "hospital_view": null, "hardware_opportunity": 4, "hardware_buyer": ["customer", "operator", "hyperscaler"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 4, "operator": 3}, "hardware_profile": ["gpu-server", "high-memory"], "hardware_profile_sizing": {"gpu-server": "cluster", "high-memory": "rack"}, "infrastructure_notes": "Large-video-memory multi-GPU tensor-parallel serving of 70-billion-parameter and larger foundation models sited on-prem for protected-health-information residency and latency (ambient documentation, chart summarization, coding assist, agentic clinical workflows). The serving/infrastructure layer beneath the decision-support apps (cdss-clinical-ai) — the same app-versus-infrastructure split as ai-drug-discovery versus ai-hpc-orchestration. Sized by concurrent token throughput and number of models hosted.", "plays": ["play-b"], "vendors": ["aidoc", "google", "hippocratic-ai", "john-snow-labs", "microsoft-nuance-dax", "nvidia-nim-bionemo", "openevidence"], "evidence_note": "Added via completeness audit (opus-verified gap); the text/multimodal analogue of imaging-ai-deployment.", "workload_envelope": {"scaling_driver": "concurrent token throughput and number of foundation models hosted", "gpu_role": "mixed", "capacity_band": "none", "availability_class": "standard", "latency_class": "interactive", "data_growth": "low", "io_pattern": "light", "concurrency": "high", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Compute-bound tensor-parallel inference gateway sited on-premises for protected-health-information residency; storage input-output is not the driver."}, "detail": {"purpose_en": "A private, on-prem inference platform that hosts large foundation models behind the hospital firewall, so generative-AI workloads — ambient documentation, chart summarization, coding assist, agentic clinical workflows — run on protected health data without sending it to a public cloud.", "purpose_zh": "在醫院防火牆內託管大型基礎模型的私有地端推論平台，讓生成式 AI 工作負載——環境語音記錄、病歷摘要、編碼輔助、代理式臨床流程——能在受保護的健康資料上運行，而無須將資料送往公有雲。", "smci_en": "Fits SMCI multi-GPU servers (large-VRAM, NVLink-class interconnect) paired with high-memory hosts — a GPU-cluster-scale build. This is a flagship on-prem AI-inference deal driven by PHI residency and token throughput and by how many foundation models are served concurrently.", "smci_zh": "適用美超微多 GPU 伺服器（大顯存、NVLink 等級互連）搭配高記憶體主機——為 GPU 叢集級部署。此為受保護健康資料在地化與 token 吞吐量、以及並發託管基礎模型數量驅動的旗艦級地端 AI 推論商機。", "tech_en": "It runs tensor-parallel serving of 70-billion-parameter and larger models across multiple large-VRAM GPUs, requiring high-memory hosts and fast interconnect. It is the infrastructure serving layer beneath decision-support apps (CDSS), sited on-prem for PHI residency and low latency; sizing is driven by concurrent token throughput and the number of models hosted, not stored-data volume.", "tech_zh": "系統以張量平行方式跨多顆大顯存 GPU 供應 700 億參數以上的模型，需要高記憶體主機與高速互連。它是決策支援應用（CDSS）底層的基礎設施供應層，因受保護健康資料在地化與低延遲需求而部署於地端；規模由並發 token 吞吐量與託管模型數量決定，而非儲存資料量。", "usage_flow": [{"en": "Load foundation models", "zh": "載入基礎模型"}, {"en": "Serve on GPU cluster", "zh": "於 GPU 叢集供應服務"}, {"en": "Route app requests via gateway", "zh": "經閘道路由應用請求"}, {"en": "Run inference on PHI locally", "zh": "本地對受保護健康資料推論"}, {"en": "Return to clinical apps", "zh": "回傳臨床應用"}]}}, {"id": "payer-actuarial-hpc", "name_en": "Payer Actuarial & Underwriting Risk Modeling", "name_zh": "保險精算與核保風險建模", "name_full": "Payer Actuarial and Underwriting Risk Modeling (high-performance-computing grid)", "domain": "data-analytics-payer-platforms", "home_stakeholder": "other", "lifecycle": ["commercial"], "role": ["analytics-artificial-intelligence"], "data_modality": ["simulation", "transactional"], "deployment": ["on-premises", "private-cloud", "hybrid"], "segments": ["payer"], "hospital_view": null, "hardware_opportunity": 3, "hardware_buyer": ["customer"], "primary_buyer": "customer", "supermicro_reachable": true, "hardware_opportunity_by_buyer": {"customer": 3}, "hardware_profile": ["high-performance-computing-cpu", "high-memory"], "hardware_profile_sizing": {"high-performance-computing-cpu": "rack", "high-memory": "node"}, "infrastructure_notes": "CPU-dense grid for large stochastic / Monte-Carlo actuarial runs (thousands of scenarios over millions of policies on tight overnight batch windows); regulatory reserving and reporting deadlines drive grid refresh and expansion. Sized by scenario count and policy volume.", "plays": [], "play_exemption": "Payer actuarial / underwriting compute grid; the payer segment sits outside the three provider/pharma solution plays", "vendors": ["fis-prophet", "milliman", "moodys-analytics", "wtw"], "evidence_note": "Added via completeness audit (opus-verified gap); distinct from payer-core-admin and payer-um-fraud-analytics.", "workload_envelope": {"scaling_driver": "stochastic scenario count and total policy volume per reserving run", "gpu_role": "none", "capacity_band": "none", "availability_class": "standard", "latency_class": "interactive", "data_growth": "low", "io_pattern": "high-throughput-parallel", "concurrency": "high", "retention_horizon": null, "per_unit_data_size": null, "sources": [], "notes": "Central-processing-unit-dense grid for Monte-Carlo reserving on tight overnight batch windows; scratch data is transient, not accumulating."}, "detail": {"purpose_en": "A compute grid that runs the insurer's actuarial and underwriting risk models — large stochastic simulations that project reserves, price policies and test solvency across thousands of scenarios, meeting regulatory reserving and reporting deadlines.", "purpose_zh": "運行保險方精算與核保風險模型的運算網格——執行大規模隨機模擬，跨數千情境推估準備金、定價保單並測試清償能力，以符合法規準備金與申報期限。", "smci_en": "Fits SMCI HPC CPU-dense compute nodes with high-memory configurations — a rack-scale grid sized by stochastic scenario count and policy volume. The sell is core density and memory per node to close the overnight reserving batch window; no GPU required.", "smci_zh": "適用美超微 HPC CPU 密集型運算節點搭配高記憶體配置——為機架級網格，依隨機情境數與保單量定規模。銷售訴求在於核心密度與每節點記憶體，以在隔夜時段內完成準備金批次；無須 GPU。", "tech_en": "It is a CPU-dense batch g
