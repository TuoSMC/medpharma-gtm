stic-reference-laboratory", "medical-technology-in-vitro-diagnostics"], "vendors": ["paige-ai", "ibex-analytics", "pathai", "mindpeak", "deep-bio", "lunit", "aiforia"], "confidence": "B", "source": "KLAS Digital Pathology 2026 names Ibex/Paige.ai/PathAI as AI developers being evaluated; Roche navify Digital Pathology Open Environment integrates 3rd-party algorithms (Deep Bio, Lunit, Owkin, Mindpeak); AstraZeneca computational-pathology collaborations (Lunit, Mindpeak) per DeciBio 2025; Paige Prostate FDA approval.", "_deep": 3}, {"id": "digital-pathology-research-quantitative-analysis", "parent": "digital-pathology", "name_en": "Quantitative Tissue Image Analysis for Research, Pharma & Companion Dx", "name_zh": "研究、製藥與伴隨式診斷用組織定量影像分析", "name_full": "Quantitative Whole-Slide Tissue Image Analysis for Drug Discovery, Translational Research and Companion-Diagnostic Development", "scope_en": "Non-clinical / CDx-development image-analysis software for tissue-based biomarker quantification, multiplex IHC and translational research, used by pharma/biotech R&D, CROs and academic labs. Batch GPU + HPC over large multiplexed image sets with fast NVMe scratch and deep archive — a pharma-R&D datacenter buyer and building entirely distinct from the clinical worklist. This is the ~30% / ~$840M (2025) 'drug discovery' application segment.", "scope_zh": "非臨床／伴隨式診斷開發用的影像分析軟體，供組織生物標記定量、多重 IHC 與轉譯研究，由製藥/生技研發、CRO 及學術實驗室使用。針對大型多重影像集的批次 GPU + HPC，搭配高速 NVMe 暫存與深層歸檔——買方為製藥研發資料中心、場域與臨床工作清單完全不同。此為約 30%／約 8.4 億美元（2025）的『藥物探索』應用區隔。", "role": ["analytics-artificial-intelligence", "workflow", "data-acquisition"], "data_modality": ["images", "artificial-intelligence-models"], "hardware_profile": ["gpu-server", "high-performance-computing-cpu", "nvme-performance-storage", "capacity-archive-storage"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["biotechnology-pharmaceutical", "contract-research-organization", "academic-medical-center", "medical-technology-in-vitro-diagnostics"], "vendors": ["indica-labs", "visiopharm", "aiforia", "pathai", "owkin"], "confidence": "B", "source": "Indica Labs HALO/HALO AI + pharma-services & companion-Dx pages (indicalab.com); Visiopharm precision-medicine/CDx positioning; Indica+Visiopharm HALO Link integration press release (Apr 2025); market reports break out 'drug discovery' as ~30% / $840M 2025 application distinct from primary diagnosis. NOTE: 'definiens' removed — acquired by AstraZeneca, now internal pharma AI tooling, not an independent market vendor.", "_deep": 3}, {"id": "digital-pathology-wsi-scanner-acquisition", "parent": "digital-pathology", "name_en": "Whole-Slide Imaging Scanner & Image Acquisition", "name_zh": "全玻片影像掃描儀與影像擷取", "name_full": "Whole-Slide Imaging Scanners and Embedded Image-Acquisition / Ingest Software", "scope_en": "The WSI scanner instruments and their embedded acquisition/ingest and pre-processing software. The scanner-attached acquisition/ingest workstation is an original-equipment-manufacturer bill-of-materials path (per-unit compute + high memory to tile, compress and stream multi-gigapixel images off the instrument), commercially distinct from the hospital's IMS purchase and controlled by the device maker, not the lab.", "scope_zh": "WSI 掃描儀器及其內嵌的擷取／匯入與前處理軟體。掃描儀附掛的擷取／匯入工作站屬 OEM 物料清單路徑（每台需運算 + 高記憶體以切片、壓縮並將數十億像素影像串流出儀器），在商業上與醫院的 IMS 採購有別，且由設備製造商而非實驗室掌控。", "role": ["data-acquisition"], "data_modality": ["images"], "hardware_profile": ["edge-industrial", "high-memory"], "hardware_opportunity": 2, "primary_buyer": "original-equipment-manufacturer", "segments": ["medical-technology-in-vitro-diagnostics", "diagnostic-reference-laboratory", "hospital-health-system"], "vendors": ["leica-biosystems", "hamamatsu-photonics", "3dhistech", "roche", "epredia", "grundium"], "confidence": "B", "source": "FDA-cleared surgical-pathology WSI scanner list (Epredia E1000 Dx, Philips PIPS, Hamamatsu NanoZoomer S360MD, Leica Aperio AT2 DX / GT 450 DX, Roche VENTANA DP 200) per IJPCR review; KLAS 2026 scanner segment (Leica dominant, Roche); PathologyOutlines/Lumea WSI vendor lists add 3DHISTECH Pannoramic and Grundium Ocus.", "_deep": 3}, {"id": "bioinformatics-secondary-alignment-variant", "parent": "bioinformatics-secondary", "name_en": "Secondary-Analysis Acceleration Engines (alignment + variant calling)", "name_zh": "二級分析加速引擎（比對＋變異偵測）", "name_full": "Genomic secondary-analysis acceleration engines — FASTQ-to-VCF alignment and germline/somatic variant calling accelerated on GPU or FPGA", "scope_en": "The read-to-variant engine: sequence alignment plus small-/structural-variant calling, accelerated on GPU or FPGA to cut a 30x whole-genome from ~30 CPU-hours to under two hours. This is the core compute-bound step and the single biggest SMCI GPU/FPGA-adjacent pull inside the parent; distinct from the workflow layer that schedules it and from the application-domain pipelines that consume its VCFs.", "scope_zh": "定序讀段到變異的核心引擎：序列比對加上小型／結構變異偵測，透過 GPU 或 FPGA 加速，將 30x 全基因組從約 30 CPU 小時縮短至兩小時內。此為最耗算力的步驟，也是母市場中最大的 SMCI GPU/FPGA 拉動點，區別於排程它的工作流層與消費其 VCF 的應用領域管線。", "role": ["analytics-artificial-intelligence", "workflow"], "data_modality": ["omics", "artificial-intelligence-models"], "hardware_profile": ["gpu-server", "high-performance-computing-cpu", "nvme-performance-storage"], "hardware_opportunity": 4, "primary_buyer": "customer", "segments": ["diagnostic-reference-laboratory", "academic-medical-center", "biotechnology-pharmaceutical", "contract-research-organization"], "vendors": ["Illumina (DRAGEN)", "NVIDIA (Parabricks / Clara)", "Sentieon", "Google (DeepVariant)"], "confidence": "B", "source": "Benchmarking accelerated NGS analysis pipelines, PMC (2024) https://pmc.ncbi.nlm.nih.gov/articles/PMC12092081/ ; NVIDIA Parabricks https://developer.nvidia.com/blog/improve-variant-calling-accuracy-with-nvidia-parabricks/ ; Sentieon https://www.sentieon.com/", "_deep": 19}, {"id": "bioinformatics-secondary-workflow-orchestration", "parent": "bioinformatics-secondary", "name_en": "Bioinformatics Pipeline Orchestration / Workflow Platforms", "name_zh": "生物資訊管線編排／工作流平台", "name_full": "Bioinformatics pipeline orchestration and workflow-management platforms (Nextflow/WDL/CWL) that schedule reproducible multi-step genomics pipelines across HPC and cloud", "scope_en": "The reproducibility and scheduling layer that chains alignment, variant calling and annotation into containerized, resumable pipelines and dispatches them across on-prem HPC schedulers, Kubernetes and cloud. Distinct commercial segment (Nextflow/Seqera ecosystem, DNAnexus, Terra) with its own buyer — the bioinformatics-platform team — separate from the compute engines it drives; drives HPC-cluster and NVMe-scratch demand more than raw GPU.", "scope_zh": "可重現性與排程層，將比對、變異偵測與註解串成容器化、可續跑的管線，並分派到地端 HPC 排程器、Kubernetes 與雲端。為獨立商業區隔（Nextflow/Seqera 生態、DNAnexus、Terra），買方為生物資訊平台團隊，有別於其驅動的運算引擎；拉動 HPC 叢集與 NVMe 暫存需求多於純 GPU。", "role": ["workflow", "infrastructure-platform", "integration"], "data_modality": ["omics", "artificial-intelligence-models"], "hardware_profile": ["high-performance-computing-cpu", "nvme-performance-storage", "capacity-archive-storage"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["biotechnology-pharmaceutical", "academic-medical-center", "diagnostic-reference-laboratory", "contract-research-organization"], "vendors": ["Seqera (Nextflow / Platform)", "DNAnexus", "Terra (Broad Institute)", "Lifebit", "Seven Bridges (Velsera)"], "confidence": "B", "source": "Seqera Platform https://seqera.io/platform/ ; Workflow managers in bioinformatics (Excelra) https://www.excelra.com/blogs/bioinformatics-workflow-managers/ ; DNAnexus / Terra Nextflow compatibility", "_deep": 2}, {"id": "bioinformatics-secondary-metagenomics-pathogen", "parent": "bioinformatics-secondary", "name_en": "Clinical Metagenomics / Pathogen Genomics Analysis", "name_zh": "臨床總體基因體／病原基因體分析", "name_full": "Metagenomic and pathogen-genomics bioinformatics — taxonomic classification, AMR-gene detection, and microbial/viral consensus-genome assembly from mNGS and isolate WGS", "scope_en": "The infectious-disease and microbial pipeline domain: taxonomic classification against very large reference databases, antimicrobial-resistance gene detection, and memory-heavy de-novo assembly of microbial/viral genomes from shotgun mNGS or isolate WGS. Distinct algorithms (k-mer/read classifiers, large-RAM assemblers), distinct buyers (clinical microbiology, public-health, ID labs) and distinct vendors from human-genome pipelines.", "scope_zh": "感染症與微生物管線領域：對超大參考資料庫進行分類鑑定、抗藥性基因偵測，以及對散彈式 mNGS 或分離株 WGS 進行高記憶體需求的微生物／病毒基因組從頭組裝。演算法（k-mer／讀段分類器、大記憶體組裝器）、買方（臨床微生物、公衛、感染症實驗室）與廠商皆與人類基因組管線不同。", "role": ["analytics-artificial-intelligence", "workflow"], "data_modality": ["omics", "artificial-intelligence-models"], "hardware_profile": ["high-performance-computing-cpu", "high-memory", "nvme-performance-storage", "capacity-archive-storage"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["diagnostic-reference-laboratory", "academic-medical-center", "hospital-health-system", "biotechnology-pharmaceutical"], "vendors": ["CosmosID", "One Codex", "Illumina (IDbyDNA / Explify)", "Chan Zuckerberg ID (CZ ID)"], "confidence": "B", "source": "Comparison of three commercial metagenomic shotgun tools, PubMed (2019) https://pubmed.ncbi.nlm.nih.gov/31826963/ ; CZ ID platform https://czid.org/ ; CosmosID https://www.cosmosid.com/", "_deep": 10}, {"id": "bioinformatics-secondary-population-cohort", "parent": "bioinformatics-secondary", "name_en": "Population-Scale / Biobank Cohort Analytics", "name_zh": "族群規模／生物銀行世代分析", "name_full": "Population-scale and biobank cohort genomics — joint genotyping, imputation, and genome-wide association analysis across 100,000+ genome cohorts inside trusted research environments", "scope_en": "The at-scale cohort domain: joint genotyping, low-coverage imputation and genome-wide association studies (GWAS) across 100k-500k+ genome biobanks (UK Biobank, All of Us style). The parent's flagship hardware pull and prime cloud-repatriation target — sustained joint-calling and Hail/PLINK sweeps over petabyte cohorts favor owned HPC + NVMe + object storage over metered cloud. Distinct at-scale workload (not covered by single-sample engines) and biobank-platform vendors; buyer = biobanks, pharma genetics centers.", "scope_zh": "大規模世代領域：跨 10 萬至 50 萬以上基因組生物銀行（UK Biobank、All of Us 型態）的聯合基因分型、低覆蓋補值與全基因組關聯研究（GWAS）。為母市場的旗艦硬體拉動點與首要雲端回遷標的——對 PB 級世代持續進行聯合偵測與 Hail/PLINK 掃描，自有 HPC＋NVMe＋物件儲存優於計量雲端。為有別於單樣本引擎的大規模工作負載，廠商與買方（生物銀行、藥廠遺傳學中心）具區隔。", "role": ["analytics-artificial-intelligence", "workflow", "infrastructure-platform"], "data_modality": ["omics", "artificial-intelligence-models", "real-world-data"], "hardware_profile": ["high-performance-computing-cpu", "gpu-server", "high-memory", "nvme-performance-storage", "capacity-archive-storage"], "hardware_opportunity": 4, "primary_buyer": "customer", "segments": ["academic-medical-center", "biotechnology-pharmaceutical", "contract-research-organization"], "vendors": ["DNAnexus", "Lifebit", "Broad Institute (Hail / Terra)", "DNAstack"], "confidence": "B", "source": "UK Biobank Research Analysis Platform (built by DNAnexus) https://www.ukbiobank.ac.uk/use-our-data/research-analysis-platform/ ; Lifebit UK Biobank guide https://lifebit.ai/blog/uk-biobank-complete-guide/ ; DNAstack federated population genomics https://dnastack.com/", "_deep": 21}, {"id": "mes-ebr-process-pharma", "parent": "mes-ebr", "name_en": "Process pharma / biopharma MES + EBR", "name_zh": "製藥／生物製藥流程型製造執行系統與電子批次紀錄", "name_full": "Process Pharmaceutical & Biopharmaceutical Manufacturing Execution System with Electronic Batch Record (small-molecule OSD, sterile, and biologics/bioprocess)", "scope_en": "The deep, validated shop-floor MES that runs GMP batch execution for chemical/small-molecule (oral solid dose, sterile fill-finish) AND biologics/bioprocess plants: master/electronic batch records, review-by-exception, weigh-and-dispense, equipment and material genealogy, e-signatures, tight integration to DeltaV/PLC/DCS process control. Spans small-molecule and biologics because the same four deep vendors serve both (Syncade/PharmaSuite merely lean sterile/biologics). This is the on-prem, HA-redundant plant-server + line-edge + DR anchor of the whole parent — SMCI direct.", "scope_zh": "在 GMP 工廠執行批次生產的深度、已驗證車間 MES，涵蓋化學／小分子（口服固體劑、無菌充填）與生物製劑／生物製程：主批次與電子批次紀錄、例外審查、稱量配料、設備與物料譜系、電子簽章，並與 DeltaV/PLC/DCS 製程控制緊密整合。因四大深度廠商同時服務小分子與生物製劑，故合為一子市場。此為整個母市場中地端、高可用冗餘工廠伺服器＋產線邊緣＋災備的硬體錨點，屬 SMCI 直銷。", "role": ["system-of-record", "workflow", "integration"], "data_modality": ["transactional", "time-series", "documents"], "hardware_profile": ["edge-industrial", "high-availability-redundant", "disaster-recovery-backup"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization"], "vendors": ["Körber (Werum PAS-X)", "Emerson (Syncade / DeltaV MES)", "Rockwell Automation (FactoryTalk PharmaSuite)", "Siemens (Opcenter Execution Pharma)", "Honeywell", "MasterControl (Mx)", "Apprentice.io"], "confidence": "B", "source": "ABI Research 'MES Software for Pharmaceutical, Biotechnology & Cell/Gene' competitive ranking (Körber/Siemens lead); Emerson SPARK Matrix MES 2024; IntuitionLabs 'Pharma MES & eBR Software Guide'; Grand View Research MES-in-Life-Sciences report; vendor sites (Emerson Syncade, Rockwell PharmaSuite, Siemens Opcenter, Körber Werum PAS-X)", "_deep": 4}, {"id": "mes-ebr-cell-gene-therapy", "parent": "mes-ebr", "name_en": "Cell & gene therapy manufacturing orchestration + chain-of-identity", "name_zh": "細胞與基因治療製造編排與身分鏈", "name_full": "Cell & Gene Therapy (ATMP) Manufacturing Orchestration, Electronic Batch Record and Chain-of-Identity / Chain-of-Custody", "scope_en": "The distinct software layer for autologous/allogeneic cell & gene therapy (ATMP) manufacturing: per-patient batch execution plus scheduling/orchestration and chain-of-identity / chain-of-custody linking apheresis → manufacturing → infusion. Genuinely distinct from process MES — distinct buyers (CGT developers, CGT CDMOs), distinct vendors (orchestration specialists), and a SaaS/cloud-heavy delivery model (TrakCel OCELLOS is Salesforce-hosted) where a platform operator/hyperscaler often runs the iron. The only SMCI-relevant on-prem angle is CGT batch execution (Lonza MODA-ES, Werum PAS-X CGT) at the plant, which overlaps process-pharma iron; the CoI/orchestration layer is operator-run co-sell — hence modest, not flagship.", "scope_zh": "自體／異體細胞與基因治療（ATMP）製造的獨立軟體層：每位病患的批次執行，加上排程／編排與身分鏈／保管鏈，串連血液成分分離→製造→輸注。與流程型 MES 明顯不同——買家不同（CGT 開發商、CGT 委託製造）、廠商不同（編排專門商）、且以 SaaS／雲端為主（TrakCel OCELLOS 由 Salesforce 託管），常由平台營運方／雲端擁有硬體。SMCI 相關的地端角度僅為工廠端 CGT 批次執行（Lonza MODA-ES、Werum PAS-X CGT），且與流程製藥硬體重疊；CoI／編排層屬營運方共同銷售，故為中度而非旗艦。", "role": ["workflow", "integration", "system-of-record"], "data_modality": ["transactional", "documents", "real-world-data", "time-series"], "hardware_profile": ["high-availability-redundant", "disaster-recovery-backup"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["biotechnology-pharmaceutical", "contract-development-manufacturing-organization"], "vendors": ["TrakCel (OCELLOS)", "Vineti", "Lonza (MODA-ES)", "Körber (Werum PAS-X for CGT)", "Title21", "Hypertrust Patient Data Care"], "confidence": "B", "source": "ABI Research MES ranking names Cell & Gene as a distinct manufacturing track; TrakCel OCELLOS (300+ sites / 11 countries, Salesforce-hosted) & Lonza MODA-ES integration announcements (trakcel.com, biopharminternational.com); Körber CGT partnerships with TrakCel/Vineti/Hypertrust (koerber-pharma.com); Lonza–Vineti partnership (lonza.com)", "_deep": 2}, {"id": "mes-ebr-medical-device", "parent": "mes-ebr", "name_en": "Medical-device / IVD discrete MES + eDHR", "name_zh": "醫療器材／體外診斷離散型製造執行系統與電子器材歷史紀錄", "name_full": "Medical Device & In-Vitro Diagnostics Discrete Manufacturing Execution System with Electronic Device History Record (eDHR)", "scope_en": "Discrete (assembly/serialized-unit) MES for medical-device and IVD manufacturing, whose system-of-record is the electronic Device History Record (eDHR) under ISO 13485 / 21 CFR Part 820 / EU MDR — a different regulatory and process world from GMP batch pharma. Distinct buyer (MedTech/IVD OEMs and their contract manufacturers) and a distinct vendor cohort built around discrete production and eDHR/BR. Mix of on-prem discrete MES (iBASEt, Critical Manufacturing → SMCI direct) and cloud/no-code (42Q, Tulip → operator co-sell).", "scope_zh": "醫療器材與體外診斷製造的離散型（組裝／序號單件）MES，其記錄系統為 ISO 13485／21 CFR Part 820／歐盟 MDR 下的電子器材歷史紀錄（eDHR），與 GMP 批次製藥的法規與製程截然不同。買家不同（醫材／IVD 原廠及其委外製造），廠商群圍繞離散生產與 eDHR/BR。地端離散 MES（iBASEt、Critical Manufacturing，SMCI 直銷）與雲端／無程式碼（42Q、Tulip，營運方共銷）並存。", "role": ["system-of-record", "workflow", "integration"], "data_modality": ["transactional", "documents", "time-series"], "hardware_profile": ["edge-industrial", "high-availability-redundant", "disaster-recovery-backup"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["medical-technology-in-vitro-diagnostics"], "vendors": ["iBASEt", "Critical Manufacturing", "42Q", "MasterControl (eDHR)", "Tulip", "Siemens (Opcenter Execution / Camstar)"], "confidence": "B", "source": "42Q medical-device eDHR case study (42-q.com); iBASEt DHR report (ibaset.com); Critical Manufacturing medical-device eDHR blog (criticalmanufacturing.com); Siemens eDHR & PTC eDHR pages; Gartner Peer Insights MES market", "_deep": 2}, {"id": "ehr-emr-core-acute-inpatient", "parent": "ehr-emr-core", "name_en": "Acute-Care / Inpatient EHR", "name_zh": "急症住院電子病歷（醫院核心系統）", "name_full": "Acute-Care / Inpatient Electronic Health Record (Hospital Core System-of-Record)", "scope_en": "The inpatient system-of-record for hospitals and integrated delivery networks (IDNs) — order entry, results, documentation, pharmacy and revenue cycle for staffed acute beds. Large self-hosted deployments run HA transactional database clusters (Epic on Caché/IRIS, Oracle Health, MEDITECH) plus a full DR site, sized by bed count, concurrent clinicians and uptime SLAs. This is the flagship of Play D and the one EHR segment where the health system typically buys and operates its own iron (SMCI direct); a growing minority take vendor-managed single-tenant hosting (operator co-sell). Refresh cycles and DR-site builds are the main deal triggers.", "scope_zh": "醫院與整合醫療網（IDN）的住院核心系統：醫囑、檢驗結果、病歷文件、藥事與收費循環。大型自建部署運行高可用交易資料庫叢集（Epic、Oracle Health、MEDITECH）加完整異地備援站，依床數、同時在線臨床人員與可用性SLA擴容。這是Play D的旗艦，也是醫療系統通常自購自營硬體（SMCI直銷）的唯一EHR區塊；少數採廠商託管單租戶（operator協銷）。汰換週期與DR建置為主要成交觸發點。", "role": ["system-of-record", "workflow"], "data_modality": ["transactional", "documents"], "hardware_profile": ["nvme-performance-storage", "high-availability-redundant", "disaster-recovery-backup", "high-memory"], "hardware_opportunity": 4, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["epic-systems", "oracle-health", "meditech", "altera-digital-health"], "confidence": "B", "source": "KLAS US Acute Care EHR Market Share 2026 (Epic ~43% acute share; MEDITECH Expanse Best in KLAS 1-150 beds); Definitive Healthcare inpatient EHR market share; Altera Sunrise Black Book top inpatient EHR (community 101-250 beds), 14 health-system Sunrise renewals 2026 (Becker's).", "_deep": 22}, {"id": "ehr-emr-core-ambulatory", "parent": "ehr-emr-core", "name_en": "Ambulatory / Physician-Practice EHR", "name_zh": "門診／醫師診所電子病歷", "name_full": "Ambulatory / Physician-Practice Electronic Health Record and Practice Management", "scope_en": "Outpatient EHR + practice-management for independent physician groups, clinics and specialty practices. The install base is dominated by ISV-hosted cloud/SaaS — small practices buy no infrastructure of their own, so this is an operator co-sell (dedicated single-tenant hosting) at best, and modest. Important co-sell caveat: athenahealth is pure public-cloud / AWS-committed (near-zero SMCI room, per playbook scope rule 4), whereas eClinicalWorks, NextGen and Greenway still run owned datacenters where an ISV hardware conversation exists. Not a SMCI-direct segment.", "scope_zh": "獨立醫師集團、診所與專科診所的門診EHR＋診所管理。安裝基礎以ISV託管雲端/SaaS為主——小型診所不自購基礎設施，故最多為operator協銷（專屬單租戶託管），機會modest。重要協銷提醒：athenahealth為純公有雲/AWS綁定（依手冊範圍規則4，SMCI幾無空間），而eClinicalWorks、NextGen、Greenway仍營運自有機房，存在ISV硬體對話空間。非SMCI直銷區塊。", "role": ["system-of-record", "workflow", "integration"], "data_modality": ["transactional", "documents"], "hardware_profile": ["nvme-performance-storage", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["hospital-health-system"], "vendors": ["eclinicalworks", "nextgen-healthcare", "greenway-health", "veradigm", "athenahealth"], "confidence": "B", "source": "KLAS ambulatory EHR reporting (athenahealth athenaClinicals & EpicCare Ambulatory co-leaders); ehrsource ambulatory vendor rosters. Segment trimmed to hospital-health-system (AMC dropped: independent physician practices are the defining buyer).", "_deep": 2}, {"id": "ehr-emr-core-community-critical-access", "parent": "ehr-emr-core", "name_en": "Community & Critical-Access Hospital EHR", "name_zh": "社區與偏鄉急救（Critical-Access）醫院電子病歷", "name_full": "Community and Critical-Access Hospital Electronic Health Record (1-150 beds)", "scope_en": "Inpatient EHR for small, rural and critical-access hospitals (roughly 1-150 beds) where Epic is too costly/complex. A distinct vendor field from large-acute, and the segment is shifting hard to vendor-hosted single-tenant delivery (MEDITECH-as-a-Service, Oracle Health CommunityWorks hosted, TruBridge hosting, Altera Paragon Denali) — so predominantly operator co-sell, but each hosted site still needs real dedicated HA + DR iron, making the opportunity significant rather than modest. Ties to the rural-hospital EHR replacement wave (Black Book: ~55% of rural/CAH planning replacement within 18 months).", "scope_zh": "小型、偏鄉與critical-access醫院（約1-150床）的住院EHR，Epic對其過於昂貴複雜。廠商陣容與大型急症區塊不同，且此區塊正快速轉向廠商託管單租戶交付（MEDITECH-as-a-Service、Oracle CommunityWorks託管、TruBridge託管、Altera Paragon Denali）——故以operator協銷為主，但每個託管站點仍需實體專屬HA＋DR硬體，機會為significant而非modest。對應偏鄉醫院EHR汰換潮（Black Book：約55%偏鄉/CAH醫院18個月內規劃汰換）。", "role": ["system-of-record", "workflow"], "data_modality": ["transactional", "documents"], "hardware_profile": ["nvme-performance-storage", "high-availability-redundant", "disaster-recovery-backup"], "hardware_opportunity": 3, "primary_buyer": "operator", "segments": ["hospital-health-system"], "vendors": ["meditech", "trubridge", "oracle-health", "azalea-health", "medhost", "juno-health"], "confidence": "B", "source": "KLAS (MEDITECH Expanse Best in KLAS Community Hospital 1-150 beds); Black Book 2026 Rural & Critical-Access Hospital EHR replacement rankings (Juno Health top-rated 9.32/10, Azalea Health, Altera Paragon Denali, MEDHOST, MEDITECH Expanse Cloud, Oracle CommunityWorks).", "_deep": 2}, {"id": "ehr-emr-core-behavioral-health", "parent": "ehr-emr-core", "name_en": "Behavioral Health & Human-Services EHR", "name_zh": "行為健康與人群服務電子病歷", "name_full": "Behavioral Health and Human-Services Electronic Health Record", "scope_en": "EHR for community mental-health centers, addiction/recovery, intellectual & developmental disability (IDD), foster-care and CCBHC / human-services providers — a distinct vendor world (Netsmart myAvatar/myEvolv, Qualifacts CareLogic/Credible, Streamline SmartCare, Core Solutions Cx360) that KLAS reports as its own Behavioral Health category. Delivery is overwhelmingly ISV-run SaaS, so operator co-sell only and modest; the providers themselves rarely buy infrastructure, and leaders increasingly run on public cloud, capping SMCI pull.", "scope_zh": "社區心理衛生中心、成癮/康復、智能與發展障礙（IDD）、寄養照護與CCBHC/人群服務機構的EHR——為獨立廠商生態（Netsmart myAvatar/myEvolv、Qualifacts CareLogic/Credible、Streamline SmartCare、Core Solutions Cx360），KLAS列為獨立的行為健康類別。交付以ISV營運SaaS為壓倒性主流，故僅operator協銷且機會modest；服務機構本身幾乎不自購基礎設施，且領導廠商日益採用公有雲，限制SMCI拉動力。", "role": ["system-of-record", "workflow"], "data_modality": ["transactional", "documents"], "hardware_profile": ["nvme-performance-storage", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["hospital-health-system"], "vendors": ["netsmart", "qualifacts", "streamline-healthcare", "core-solutions"], "confidence": "B", "source": "Best in KLAS Behavioral Health category (Qualifacts 2023 Best in KLAS; Netsmart largest, 24,000+ orgs; Qualifacts 2,700+ orgs / 33% of CCBHCs; Streamline SmartCare for CMHCs; Core Solutions behavioral/IDD/human-services).", "_deep": 2}, {"id": "ehr-emr-core-ltpac", "parent": "ehr-emr-core", "name_en": "Long-Term & Post-Acute Care (LTPAC) EHR", "name_zh": "長照與後急性照護（LTPAC）電子病歷", "name_full": "Long-Term and Post-Acute Care Electronic Health Record (Skilled Nursing, Senior Living, Home Health, Hospice)", "scope_en": "EHR for skilled-nursing facilities, senior living, home health and hospice — a distinct vendor world from acute/ambulatory, led by PointClickCare (~65% skilled-nursing share, 6-yr KLAS leader, 21,000+ facilities) and MatrixCare (15,000+ providers), with WellSky (Best-in-KLAS home health/hospice), Netsmart and American HealthTech. Delivery is vendor-run cloud/SaaS, so operator co-sell and modest; the care organizations themselves buy little to no iron and the leaders increasingly run on public cloud, capping SMCI pull. KLAS tracks this as its own Long-Term Care / Continuum-of-Care category.", "scope_zh": "技術性護理機構、銀髮住宿、居家健康與安寧照護的EHR——廠商生態與急症/門診不同，由PointClickCare（技術性護理約65%市佔、KLAS連6年領先、逾21,000機構）與MatrixCare（逾15,000供應者）領銜，另有WellSky（居家健康/安寧Best in KLAS）、Netsmart、American HealthTech。交付為廠商營運雲端/SaaS，故operator協銷且機會modest；照護機構本身幾乎不購硬體，且領導廠商日益採用公有雲，限制SMCI拉動力。KLAS列為獨立的長照/照護連續體類別。", "role": ["system-of-record", "workflow"], "data_modality": ["transactional", "documents"], "hardware_profile": ["nvme-performance-storage", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["hospital-health-system"], "vendors": ["pointclickcare", "matrixcare", "wellsky", "netsmart", "american-healthtech"], "confidence": "B", "source": "Best in KLAS Long-Term Care / Continuum-of-Care (PointClickCare #1 LTC 6 consecutive years, ~65% skilled-nursing share, 21,000+ facilities; MatrixCare LTC leader, 15,000+ providers; WellSky Personal Care Best in KLAS 2025).", "_deep": 0}, {"id": "imaging-ai-deployment-onprem-orchestration", "parent": "imaging-ai-deployment", "name_en": "On-Prem Vendor-Neutral Imaging AI Orchestration Platform", "name_zh": "院內部署・廠商中立影像AI編排平台", "name_full": "On-Premise Vendor-Neutral Radiology AI Orchestration / Marketplace Platform (customer-owned GPU inference)", "scope_en": "Hospital- or imaging-network-deployed aggregation layer that pulls studies from PACS, routes each to multiple third-party AI algorithms (a curated marketplace of 30-275+ apps), and returns results to the worklist/report. Deployed on the customer's OWN on-prem GPU inference server for data sovereignty, latency, and OpEx-avoidance. This is the SMCI-direct core of the category.", "scope_zh": "由醫院或影像網路自行部署的整合層：從PACS取回檢查、路由至多家第三方AI演算法（策展式市集，30–275+應用），再將結果回寫工作清單/報告。基於資料主權、延遲與成本考量，跑在客戶自有的院內GPU推論伺服器上，是本類別中SMCI直銷的核心。", "role": ["integration", "workflow", "analytics-artificial-intelligence", "infrastructure-platform"], "data_modality": ["images", "artificial-intelligence-models"], "hardware_profile": ["gpu-server", "nvme-performance-storage"], "hardware_opportunity": 4, "primary_buyer": "customer", "segments": ["hospital-health-system", "diagnostic-reference-laboratory", "academic-medical-center"], "vendors": ["Blackford (Bayer)", "deepc (deepcOS)", "CARPL.ai", "Sectra Amplifier", "Incepto Medical", "Aidoc aiOS"], "confidence": "B", "source": "Web-verified 2026: Blackford Precision AI Orchestration (blackfordanalysis.com, on-prem/cloud/hybrid); deepcOS (deepc.ai); CARPL.ai on-prem+cloud, 275+ apps (carpl.ai, TechCrunch 2024); Sectra Amplifier Marketplace (medical.sectra.com); Incepto Medical (signifyresearch.net Mar-2025 round-up). All confirmed as vendor-neutral orchestration platforms with on-prem deployment.", "_deep": 5}, {"id": "imaging-ai-deployment-validation-lifecycle-mlops", "parent": "imaging-ai-deployment", "name_en": "Imaging AI Validation, Governance & Lifecycle Platform (MLOps)", "name_zh": "影像AI驗證・治理與生命週期平台（MLOps）", "name_full": "Clinical Imaging AI Assurance / MLOps — validation, bias-drift monitoring, federated evaluation, regulatory lifecycle", "scope_en": "Software that lets a health system or an AI developer validate, benchmark, locally deploy, and continuously monitor imaging AI models inside a secure OWNED environment — bias/fairness and performance-drift analysis, FDA-ready report generation, and federated (edge-node) evaluation across sites. The hardware pull is model validation / re-training / continuous eval (GPU compute + fast local storage), distinct from the pure inference-routing of the on-prem orchestration child. Gesund.ai and Ferrum both deploy on-prem or private cloud (customer-owned).", "scope_zh": "讓醫療系統或AI開發者在安全的自有環境中驗證、基準測試、就地部署並持續監控影像AI模型的軟體——偏差/公平性與效能漂移分析、產生FDA可用報告、跨院區聯邦式（邊緣節點）評估。硬體拉動來自模型驗證/再訓練/持續評估（GPU運算＋高速本地儲存），有別於純推論路由的院內編排子市場。Gesund.ai與Ferrum皆可院內或私有雲部署（客戶自有）。", "role": ["infrastructure-platform", "analytics-artificial-intelligence", "integration"], "data_modality": ["images", "artificial-intelligence-models", "real-world-data"], "hardware_profile": ["gpu-server", "nvme-performance-storage"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center", "medical-technology-in-vitro-diagnostics"], "vendors": ["Gesund.ai", "Ferrum Health", "Rhino Health"], "confidence": "B", "source": "Web-verified 2026: Gesund.ai governance/MLOps platform, deploys on-prem or private cloud (gesund.ai); Ferrum Health AI Governance Suite, health-system-owned/controlled, on-prem (ferrumhealth.com, marketplace.microsoft.com); Rhino Health federated computing (rhinofcp.com). Dropped John Snow Labs (NLP/RWD/patient-journey, not imaging-AI validation) and Centaur Labs (crowd data-annotation service, not a customer-owned governance/MLOps platform) as misfits for this sub-market.", "_deep": 2}, {"id": "cdss-clinical-ai-reference-knowledge", "parent": "cdss-clinical-ai", "name_en": "Evidence-Based Reference & Medication Knowledge CDSS", "name_zh": "實證參考與用藥知識臨床決策支援", "name_full": "Evidence-Based Reference, Order Sets & Medication Knowledge CDSS (rule/content-based)", "scope_en": "Content-licensed decision support embedded in the EHR: evidence reference lookup (infobutton), order sets and care pathways, and medication knowledge bases (drug-drug interaction, allergy, dose/renal checks). The dominant CDSS revenue tier (~46% evidence-reference; DDI ~30% of alerts) but SaaS-light and content-centric — served as APIs/cloud content, so the underlying iron is bought by the content ISV or a hyperscaler, not the hospital. Near-zero SMCI direct pull; included for completeness and honesty.", "scope_zh": "以內容授權、嵌入 EHR 的決策支援：實證參考查詢（infobutton）、醫囑組合與照護路徑、用藥知識庫（藥物交互作用、過敏、劑量／腎功能校正）。為 CDSS 營收最大區塊（實證參考約46%、DDI 約占警示30%），但屬 SaaS-light、以內容為核心，多以 API／雲端內容交付，底層硬體由內容 ISV 或雲端業者採購，非醫院自購。對 SMCI 幾無直接硬體拉動，列此為求完整與誠實。", "role": ["workflow", "integration"], "data_modality": ["documents", "transactional"], "hardware_profile": [], "hardware_opportunity": 1, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Wolters Kluwer (UpToDate, Medi-Span, Sentri7)", "Elsevier (ClinicalKey)", "EBSCO DynaMed", "Merative Micromedex", "First Databank (FDB)", "Zynx Health", "Isabel Healthcare", "BMJ Best Practice", "EvidenceCare"], "confidence": "B", "source": "MarketsandMarkets CDSS market (US$3.89B by 2030); Mordor Clinical Decision Support Software / Clinical Knowledge-Based Platforms reports (evidence-reference 46.4% 2025, DDI 30%); vendor sites", "_deep": 0}, {"id": "cdss-clinical-ai-predictive-surveillance", "parent": "cdss-clinical-ai", "name_en": "Real-Time Predictive Clinical Surveillance (Sepsis / Deterioration / Early Warning)", "name_zh": "即時預測性臨床監測（敗血症／病情惡化／早期預警）", "name_full": "Real-Time Predictive Clinical Surveillance & Early-Warning AI (sepsis, deterioration, patient-safety)", "scope_en": "Continuous machine-learning inference over streaming EHR vitals, labs and orders to predict sepsis, clinical deterioration and safety events ahead of onset — FDA-cleared continuous monitors (Bayesian Health TREWS, first-ever continuous AI sepsis 510(k), May 2026) plus homegrown academic early-warning models (Duke Sepsis Watch, UCSD COMPOSER). Architecturally distinct from rule-based CDSS: it reasons continuously over evolving patient state, so it demands always-on, low-latency inference next to the clinical data — a genuine high-availability + modest-GPU + fast-storage pull, and several deployments run on hospital/private infrastructure (SMCI direct). GPU footprint is modest (many models are gradient-boosted/logistic); the anchor is HA + NVMe, not dense training.", "scope_zh": "對串流的 EHR 生命徵象、檢驗與醫囑進行連續機器學習推論，在敗血症、病情惡化與病安事件發生前提出預警——含 FDA 核准之連續監測（Bayesian Health TREWS，史上首個連續 AI 敗血症 510(k)，2026年5月）與學術自研早期預警模型（Duke Sepsis Watch、UCSD COMPOSER）。與規則式 CDSS 架構本質不同：需對演變中的病人狀態連續推理，故需貼近臨床資料、永不中斷、低延遲的推論，形成真實的高可用＋中度 GPU＋高速儲存拉動；部分部署於醫院／私有基礎設施（SMCI 直銷）。GPU 需求屬中度（多為梯度提升／羅吉斯模型），主錨為高可用＋NVMe，而非密集訓練。", "role": ["analytics-artificial-intelligence", "workflow", "regulated-software-as-a-medical-device"], "data_modality": ["time-series", "transactional", "artificial-intelligence-models"], "hardware_profile": ["gpu-server", "high-availability-redundant", "nvme-performance-storage"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Bayesian Health", "Dascena (InSight)", "Epic (Deterioration Index / sepsis model)", "Jvion (Lightbeam Health)", "Health Catalyst (Healthcare.AI)", "Etiometry", "CLEW Medical", "Ambient Clinical Analytics (AWARE)"], "confidence": "B", "source": "Bayesian Health first-ever FDA 510(k) clearance for continuous AI sepsis monitoring, announced 2026-05-12 (BioSpace/PRNewswire/Medical Device Network; TREWS prospective study, Nature Medicine, ~82% sensitivity, 18% mortality reduction on timely response); MDPI J Clin Med 2025 sepsis-AI review", "_deep": 6}, {"id": "cdss-clinical-ai-ambient-documentation", "parent": "cdss-clinical-ai", "name_en": "Ambient AI Clinical Documentation (Generative Scribe)", "name_zh": "環境式 AI 臨床文書（生成式醫療謄寫）", "name_full": "Ambient AI Clinical Documentation / Generative Medical Scribe", "scope_en": "Ambient speech-to-note generative AI that passively captures the clinician-patient encounter and drafts structured documentation back into the EHR. GPU-intensive ASR + LLM inference and the fastest-growing clinical-AI submarket (~US$1.2B 2025 → ~US$15B 2035, ~29% CAGR). Hardware pull is real but largely runs at the ISV/operator (co-sell) or is hyperscaler-owned (Microsoft DAX Copilot on Azure) — SMCI reach is via the fast-moving independents (Abridge, Ambience, Suki) who may operate dedicated single-tenant GPU. Adjacent to the healthcare-llm-serving category; kept here as the named clinical-documentation application submarket.", "scope_zh": "被動聆聽並擷取醫病對話、生成結構化文書並回填 EHR 的環境式語音轉文字生成式 AI。屬 GPU 密集之 ASR＋LLM 推論，為臨床 AI 成長最快區塊（2025 約US$1.2B→2035 約US$15B，CAGR 約29%）。硬體拉動真實，但多由 ISV／營運方運行（co-sell）或屬雲端業者自有（微軟 DAX Copilot 於 Azure）——SMCI 觸及點在快速成長之獨立業者（Abridge、Ambience、Suki）自建單租戶 GPU。與 healthcare-llm-serving 類別相鄰，此處列為具名之臨床文書應用子市場。", "role": ["analytics-artificial-intelligence", "workflow", "data-acquisition"], "data_modality": ["documents", "time-series", "artificial-intelligence-models"], "hardware_profile": ["gpu-server"], "hardware_opportunity": 3, "primary_buyer": "operator", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Microsoft Nuance (DAX Copilot)", "Abridge", "Ambience Healthcare", "Suki AI", "Nabla", "DeepScribe", "Augmedix", "Freed"], "confidence": "B", "source": "Astute Analytica AI Clinical Documentation (Ambient Scribe) market; openPR ambient-scribe report; KLAS (Abridge Best in KLAS Ambient AI 2025 & 2026); RCT of 238 physicians (DAX/Nabla vs usual care)", "_deep": 2}, {"id": "cdss-clinical-ai-orchestration-governance", "parent": "cdss-clinical-ai", "name_en": "Enterprise Clinical AI Orchestration & Governance Platform", "name_zh": "企業級臨床 AI 編排與治理平台", "name_full": "Enterprise Clinical AI Orchestration, Deployment & Governance Platform (model-ops)", "scope_en": "Health-system-wide platform to deploy, run, monitor and govern many clinical AI models (homegrown, open-source and third-party) through one inference gateway — with validation, drift detection, override tracking, audit logging and human-in-the-loop controls demanded by the EU AI Act and institutional governance. Aidoc aiOS is verified as an on-prem orchestration/governance control plane with an API gateway for homegrown/open-source models; John Snow Labs offers on-prem/private-cloud governed medical LLM/NLP — giving an SMCI-direct GPU + HA + fast-storage pull. NOTE (adjacency risk, flagged not hidden): aiOS is imaging-rooted, so this overlaps the imaging-ai-deployment / pacs-ai-orchestration siblings; retained as the cross-modality model-ops/governance control plane rather than an imaging marketplace, at confidence B.", "scope_zh": "以單一推論閘道在整個醫療系統部署、運行、監控並治理眾多臨床 AI 模型（自研、開源、第三方），提供驗證、漂移偵測、覆寫追蹤、稽核日誌與人在迴路控制，以符合歐盟 AI 法與機構治理。已核實 Aidoc aiOS 為地端編排／治理控制平面，具自研／開源模型之 API 閘道；John Snow Labs 提供地端／私有雲之受治理醫療 LLM／NLP，構成 SMCI 直銷之 GPU＋高可用＋高速儲存拉動。註（相鄰風險，明列不藏）：aiOS 源於影像，故與 imaging-ai-deployment／pacs-ai-orchestration 兄弟項重疊；本項保留為跨模態之模型維運／治理控制平面，而非影像市集，信賴度 B。", "role": ["infrastructure-platform", "analytics-artificial-intelligence", "integration"], "data_modality": ["artificial-intelligence-models", "transactional", "time-series"], "hardware_profile": ["gpu-server", "high-availability-redundant", "nvme-performance-storage"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Aidoc (aiOS)", "John Snow Labs", "ClosedLoop.ai", "NVIDIA (Clara / MONAI Deploy)"], "confidence": "B", "source": "Aidoc aiOS platform pages verified 2026-08 (run/orchestrate/govern clinical AI across a health system; on-prem orchestration minimizing cloud transmission; API gateway to deploy/monitor/govern homegrown or open-source models; validation, drift detection, override tracking); John Snow Labs on-prem/private-cloud governed Medical LLM (HIPAA/GDPR audit); EU AI Act medical-AI governance driver", "_deep": 3}, {"id": "ris-cvis-workflow-cardiovascular-cvis", "parent": "ris-cvis-workflow", "name_en": "Cardiovascular Information System (CVIS)", "name_zh": "心血管資訊系統（CVIS）", "name_full": "Cardiovascular Information System — cardiology workflow, structured reporting & multi-modality image/waveform management", "scope_en": "Service-line system for the cardiovascular department: cath-lab hemodynamics, echo/vascular image and cine-loop management, ECG/waveform storage, structured reporting and registry (ACC/NCDR) submission. The storage-heavy member of this parent — echo cine loops, angiography video and long-retention waveform archives drive an NVMe playback tier plus PB-scale capacity archive, sized by cath/echo procedure volume and cardiology retention rules. Distinct buyer (cardiology service line, separate budget from radiology).", "scope_zh": "心血管科的服務線系統：導管室血流動力學、超音波／血管影像與動態影像（cine-loop）管理、心電圖／波形儲存、結構化報告與登錄（ACC/NCDR）提交。此為母類別中儲存需求最重者——超音波動態影像、血管攝影影片與長期波形封存驅動 NVMe 播放層加 PB 級容量封存，依導管／超音波手術量與心臟科保存規則估算。買方獨立（心臟服務線，預算與放射科分開）。", "role": ["workflow", "system-of-record", "data-acquisition", "integration"], "data_modality": ["images", "time-series", "transactional", "documents"], "hardware_profile": ["capacity-archive-storage", "nvme-performance-storage", "high-availability-redundant"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["philips", "ge-healthcare", "fujifilm-healthcare", "change-healthcare", "siemens-healthineers", "digisonics", "scimage", "lumedx", "merative"], "confidence": "B", "source": "Verified: KLAS Best of KLAS 2022 CVIS/hemodynamics rankings (cardiovascularbusiness.com); SNS Insider & MarketsandMarkets CVIS market reports 2025 (globenewswire.com CVIS-to-USD-2.8B-by-2032); Fortune Business Insights CVIS report; vendor products confirmed — Philips IntelliSpace Cardiovascular (KLAS 73.4), Intelerad DigiView/Digisonics (74.9), Intelerad Apollo Advance/LUMEDX (77.2), Fujifilm Synapse Cardiology, GE Centricity Cardio Enterprise, ScImage. Named CVIS vendors (GE, Philips, Siemens, Fujifilm, LUMEDX, Digisonics, Epic, ScImage, Merative/ex-Merge) all confirmed selling into this sub-market.", "_deep": 10}, {"id": "ris-cvis-workflow-radiology-ris", "parent": "ris-cvis-workflow", "name_en": "Radiology Information System (RIS)", "name_zh": "放射科資訊系統（RIS）", "name_full": "Radiology Information System — scheduling, order management & departmental workflow", "scope_en": "Departmental system-of-record for radiology: patient scheduling, order/exam management, technologist worklists, results distribution and billing interfaces. Standalone RIS is steadily being absorbed into the EHR (Epic Radiant, Oracle Health) and into 'deconstructed PACS' workflow, but survives in imaging-center and outpatient chains where the EHR footprint is thin. Transactional DB with HA/failover needs; image bytes live in PACS/VNA, not here — so a modest, availability-driven hardware pull rather than a storage anchor.", "scope_zh": "放射科的部門級記錄系統：病患排程、檢查醫囑管理、技師工作清單、報告分發與計費介面。獨立 RIS 正穩定被整合進 EHR（Epic Radiant、Oracle Health）與「解構式 PACS」工作流程，但在 EHR 覆蓋較薄的影像中心與門診連鎖仍存在。交易型資料庫需高可用／故障轉移；影像位元組存於 PACS/VNA 而非此處——故為以可用性驅動的中度硬體拉動，而非儲存錨點。", "role": ["system-of-record", "workflow", "integration"], "data_modality": ["transactional", "documents"], "hardware_profile": ["high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["sectra", "medinformatix", "ramsoft", "epic-systems", "oracle-health", "novarad", "merative"], "confidence": "B", "source": "Grand View Research & Future Market Insights RIS market reports 2025 (grandviewresearch.com/industry-analysis/radiology-information-system-ris-market); vendor sites: Sectra RIS, MedInformatix, RamSoft PowerServer, Epic Radiant, Novarad. EHR-absorption trend (Epic Radiant / Oracle Health displacing standalone RIS) corroborated across radiology-IT trade coverage.", "_deep": 2}, {"id": "ris-cvis-workflow-reporting-speech-recognition", "parent": "ris-cvis-workflow", "name_en": "Radiology Reporting & Speech Recognition", "name_zh": "放射科報告與語音辨識", "name_full": "Radiology reporting, speech recognition & AI-assisted structured reporting", "scope_en": "The dictation-and-reporting layer on top of RIS/PACS: real-time speech-to-text, radiology-specific language models, structured templates and AI 'impression'/findings generation. Distinct vendors and a distinct GPU/NLP inference pull (ASR + radiology LLMs). But the dominant platforms are cloud-native SaaS — Nuance PowerScribe One (~80% US share) runs on Microsoft/Azure, effectively hyperscaler with near-zero co-sell; Rad AI and peers are cloud services. SMCI reach is the operator/on-prem minority (Augnito, legacy on-prem PowerScribe 360, self-hosted ASR), so opportunity is real but capped — an operator/GPU co-sell, not a customer-direct anchor.", "scope_zh": "位於 RIS/PACS 之上的口述與報告層：即時語音轉文字、放射科專用語言模型、結構化範本與 AI「結論／發現」生成。有獨立廠商且帶來獨特的 GPU/NLP 推論需求（ASR＋放射科 LLM）。但主流平台為雲端原生 SaaS——Nuance PowerScribe One（美國約 80% 市佔）跑在 Microsoft/Azure，實質為超大規模雲、幾無協銷；Rad AI 等為雲端服務。SMCI 觸及集中於營運商／地端的少數（Augnito、舊版地端 PowerScribe 360、自建 ASR），故機會真實但受限——屬營運商／GPU 協銷，而非客戶直銷錨點。", "role": ["workflow", "analytics-artificial-intelligence", "data-acquisition"], "data_modality": ["documents", "artificial-intelligence-models", "time-series"], "hardware_profile": ["gpu-server"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["hospital-health-system", "academic-medical-center", "diagnostic-reference-laboratory"], "vendors": ["nuance-powerscribe", "solventum-mmodal", "rad-ai", "augnito", "dolbey"], "confidence": "B", "source": "Verified: KLAS-cited ~80-81% Nuance PowerScribe US radiology-reporting share (multiple trade sources, medicai.io/ITN/Applied Radiology); Rad AI next-gen speech recognition launch (radai.com/news, itnonline.com); 3M/Solventum M*Modal Fluency for Imaging confirmed as #2 enterprise platform. Note: Nuance/PowerScribe One = Microsoft-Azure (hyperscaler, out of scope); SMCI-reachable share is the on-prem/operator remainder — hence primary_buyer=operator, opportunity capped at 2.", "_deep": 3}, {"id": "ris-cvis-workflow-dose-management", "parent": "ris-cvis-workflow", "name_en": "Radiation Dose Management", "name_zh": "輻射劑量管理", "name_full": "Radiation dose monitoring & management informatics", "scope_en": "Vendor-neutral informatics that aggregates CT/fluoro/interventional radiation-dose data for tracking, benchmarking, SSDE/cumulative-dose calculation and regulatory compliance (Joint Commission, ACR DIR, EU EURATOM). A genuinely distinct segment with its own buyer — medical physics and the radiation-safety officer, a regulatory-driven purchase — but SaaS-light: a small aggregation database and dashboards, not a compute or archive anchor. Included for completeness and honesty; minimal SMCI hardware pull.", "scope_zh": "廠商中立的資訊系統，彙整 CT／透視／介入輻射劑量資料以進行追蹤、基準比較、SSDE／累積劑量計算與法規遵循（Joint Commission、ACR DIR、EU EURATOM）。為真正獨立的區隔，有自己的買方——醫學物理與輻射安全官，屬法規驅動採購——但屬 SaaS-light：僅小型彙整資料庫與儀表板，非運算或封存錨點。為完整與誠實納入；SMCI 硬體拉動極小。", "role": ["integration", "analytics-artificial-intelligence", "workflow"], "data_modality": ["transactional", "documents"], "hardware_profile": [], "hardware_opportunity": 1, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["bayer-radimetrics", "ge-healthcare", "sectra", "siemens-healthineers", "pacshealth", "philips"], "confidence": "B", "source": "Verified: ITN/DAIC dose-management vendor coverage (itnonline.com 'Recording and Managing Radiation Dose'); Physica Medica 2025 systematic review of automated CT dose-monitoring software (ScienceDirect S1120-1797(25)00166-8) — Radimetrics most-used (20 studies), DoseWatch #2 (12). Products confirmed: Bayer Radimetrics/eXposure, GE DoseWatch, Sectra DoseTrack, Siemens teamplay, Philips DoseWise, PACSHealth DoseMonitor.", "_deep": 0}, {"id": "or-surgical-video-perioperative-management", "parent": "or-surgical-video", "name_en": "Perioperative & OR Management / Scheduling", "name_zh": "圍手術期與手術室管理／排程", "name_full": "Perioperative and Operating Room Management and Scheduling Software", "scope_en": "The transactional workflow layer of the OR: surgical case scheduling, OR block-time management, perioperative documentation, and utilization/throughput analytics. Largely SaaS or riding the EHR, with AI-driven schedule optimization as the current growth edge. Distinct buyer (perioperative-services / OR directors) but minimal dedicated iron.", "scope_zh": "手術室的交易型工作流程層：手術排程、手術室區塊時間管理、圍手術期文件記錄與使用率／吞吐量分析。多為 SaaS 或依附於 EHR，AI 驅動的排程最佳化為當前成長點。買方明確（圍手術期服務／手術室主管），但幾乎不需專屬硬體。", "role": ["workflow", "system-of-record", "analytics-artificial-intelligence"], "data_modality": ["transactional"], "hardware_profile": [], "hardware_opportunity": 1, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Surgical Information Systems (SIS)", "Picis OR Manager", "LiveData PeriOp Manager", "LeanTaaS iQueue for Operating Rooms", "Qventus", "Apella", "Epic OpTime", "Oracle Health SurgiNet"], "confidence": "B", "source": "Apella 'OR Schedule Optimization Landscape' (LeanTaaS/Qventus/Epic/Apella) apella.io/blog; Picis OR Manager picis.com; LeanTaaS iQueue leantaas.com; Fortune Business Insights OR Scheduling Software Market", "_deep": 0}, {"id": "or-surgical-video-integration-routing", "parent": "or-surgical-video", "name_en": "Integrated OR / Surgical Video Routing & Device Integration", "name_zh": "整合手術室／手術影像路由與設備整合", "name_full": "Integrated Operating Room Video Routing and Device Integration Platform", "scope_en": "The 'integrated OR' appliance market: per-OR systems that route, switch, record and display 4K/8K surgical video and centrally control networked OR devices, over medical-grade video-over-IP. Sold predominantly as vendor OEM appliances with in-room edge capture/routing nodes — SMCI angle is an OEM design-win embedded in the integration vendor's system, not a hospital-direct server sale.", "scope_zh": "「整合手術室」設備市場：每間手術室的系統，透過醫療級 IP 影像傳輸路由、切換、錄製與顯示 4K/8K 手術影像並集中控制連網設備。主要以廠商 OEM 設備形式銷售，含房內邊緣擷取／路由節點 — SMCI 切入點為嵌入整合廠商系統的 OEM 設計導入，而非對醫院直售伺服器。", "role": ["data-acquisition", "integration", "workflow"], "data_modality": ["images", "time-series"], "hardware_profile": ["edge-industrial", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "original-equipment-manufacturer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Karl Storz OR1", "Stryker (iSuite / Connected OR)", "Olympus ENDOALPHA", "Getinge Tegris", "Sony NUCLeUS", "STERIS Harmony iQ", "Brainlab Digital O.R.", "Richard Wolf core nova", "EIZO CuratOR"], "confidence": "B", "source": "iData Research 'Best OR Equipment Brands US 2025' (Stryker >11k integrated ORs; Storz/STERIS/Olympus) idataresearch.com; Getinge Tegris getinge.com; Karl Storz OR1 karlstorz.com", "_deep": 2}, {"id": "or-surgical-video-media-archive", "parent": "or-surgical-video", "name_en": "Surgical Video Management & Archiving", "name_zh": "手術影像管理與典藏", "name_full": "Surgical Video Management and Archiving Platform (Surgical Media VNA)", "scope_en": "Centralized capture, ingest, and long-term retention of surgical video into a searchable media library / surgical VNA. Distinguished from the routing appliance by its storage pull: high-bitrate 4K/8K ingest (NVMe) plus PB-scale multi-OR archive with DR, on-prem or vendor-hosted. Vendor set overlaps routing/AI siblings (Sony/Storz/Caresyntax) — it qualifies on distinct buyer+hardware (hospital-IT-direct storage) not on unique vendors.", "scope_zh": "集中擷取、匯入並長期保存手術影像至可搜尋的媒體庫／手術 VNA。與路由設備的差異在於其儲存拉動：高位元率 4K/8K 匯入（NVMe）加上跨多手術室的 PB 級典藏與災難復原，可地端或廠商託管。廠商與路由／AI 子市場重疊（Sony／Storz／Caresyntax）— 其成立依據為獨立的買方＋硬體（醫院 IT 直購儲存），而非獨有廠商。", "role": ["system-of-record", "data-acquisition", "workflow"], "data_modality": ["images", "documents"], "hardware_profile": ["nvme-performance-storage", "capacity-archive-storage", "disaster-recovery-backup"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Karl Storz AIDA", "Sony NUCLeUS", "Medtronic Touch Surgery Enterprise", "Olympus", "Caresyntax"], "confidence": "B", "source": "ACS Bulletin 'Video-Based Technologies in the OR' facs.org (Nov-Dec 2023); Karl Storz AIDA image-management/archiving (4K/3D, DICOM/HL7 to central storage) karlstorz.com; Medtronic Touch Surgery Enterprise 'record/access/analyze secure library' medtronic.com; Caresyntax surgical video capture caresyntax.com", "_deep": 8}, {"id": "or-surgical-video-surgical-intelligence-ai", "parent": "or-surgical-video", "name_en": "Surgical Intelligence & Intraoperative AI", "name_zh": "手術智能與術中人工智慧", "name_full": "Surgical Intelligence and Intraoperative Computer-Vision AI Platform", "scope_en": "Computer-vision AI over endoscopic and whole-room OR video — retrospective phase / skill / adverse-event analytics and real-time intra-op safety alerts ('surgical data science', the OR black box). GPU-intensive model training and inference; leading platforms deploy on-prem/edge appliances inside the hospital (SST) making the ISV co-sell real rather than pure hyperscaler SaaS.", "scope_zh": "針對內視鏡與全室手術影像的電腦視覺 AI — 術後階段／技巧／不良事件分析與術中即時安全警示（「手術資料科學」、手術黑盒子）。GPU 密集的模型訓練與推論；領先平台於醫院內部署地端／邊緣設備（如 SST），使 ISV 共同銷售成立，而非純粹的雲端 SaaS。", "role": ["analytics-artificial-intelligence", "regulated-software-as-a-medical-device", "data-acquisition"], "data_modality": ["images", "artificial-intelligence-models", "time-series"], "hardware_profile": ["gpu-server", "nvme-performance-storage", "edge-industrial"], "hardware_opportunity": 3, "primary_buyer": "operator", "segments": ["hospital-health-system", "academic-medical-center", "medical-technology-in-vitro-diagnostics"], "vendors": ["Theator", "Caresyntax (ORION)", "Medtronic Touch Surgery Enterprise", "Surgical Safety Technologies (OR Black Box)", "Intuitive Case Insights"], "confidence": "B", "source": "Theator surgical intelligence platform theator.io; Caresyntax ORION Multi-Modal Analytics (video/audio/device AI, 4,200 ORs) caresyntax.com; MIT Technology Review OR Black Box (SST, on-prem multimodal capture) technologyreview.com 2024; Medtronic Touch Surgery Enterprise medtronic.com", "_deep": 8}, {"id": "radiation-oncology-tps-external-beam-photon", "parent": "radiation-oncology-tps-ois", "name_en": "External-Beam Photon/Electron TPS (IMRT/VMAT/SBRT dose-calculation farm)", "name_zh": "外照射光子／電子治療計畫系統（IMRT／VMAT／SBRT 劑量計算農場）", "name_full": "External-Beam Photon and Electron Radiotherapy Treatment Planning System", "scope_en": "The mainstream external-beam TPS that computes photon/electron dose distributions (Monte Carlo, collapsed-cone/convolution-superposition) for IMRT, VMAT and SBRT, and runs the GPU-accelerated dose-calculation server sized to plan throughput at each cancer center. This is the core discrete GPU/server project the parent describes; multi-site health systems repeat it per facility.", "scope_zh": "主流的外照射 TPS，計算光子／電子劑量分布（蒙地卡羅、collapsed-cone／卷積疊加）以支援 IMRT、VMAT 與 SBRT，並依各癌症中心的計畫吞吐量配置 GPU 加速劑量計算伺服器；即母類別所述、每個癌症中心一個獨立 GPU／伺服器專案的核心，且多院區醫療體系會逐一複製。", "role": ["regulated-software-as-a-medical-device", "workflow", "system-of-record"], "data_modality": ["images", "simulation"], "hardware_profile": ["gpu-server", "high-availability-redundant"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Varian Eclipse (Siemens Healthineers)", "Elekta Monaco", "RaySearch RayStation", "Philips Pinnacle (legacy)"], "confidence": "B", "source": "Siemens Healthineers Eclipse, Elekta Monaco and RaySearch RayStation vendor pages; TBRC radiation-oncology TPS market report; vendor tags previously verified in vendors.yaml (Varian, Elekta, RaySearch under radiation-oncology-tps-ois). Philips Pinnacle listed as legacy/discontinued (unverified patent-transfer claim removed).", "_deep": 5}, {"id": "radiation-oncology-tps-proton-particle", "parent": "radiation-oncology-tps-ois", "name_en": "Proton / Particle-Therapy TPS (pencil-beam-scanning Monte Carlo)", "name_zh": "質子／粒子治療計畫系統（筆形束掃描蒙地卡羅）", "name_full": "Proton and Particle Beam Therapy Treatment Planning System", "scope_en": "A physically distinct, high-value niche: TPS for proton (and other particle) pencil-beam-scanning therapy, using GPU-implemented Monte Carlo dose engines (e.g. RayStation MC, Eclipse AcurosPT) with robust optimization. Serves the small but capital-intensive population of proton centers; commissioning and replanning are far more compute-heavy than photon TPS, pulling GPU plus HPC-CPU clusters.", "scope_zh": "在物理上獨立、單價極高的利基：質子（及其他粒子）筆形束掃描治療的 TPS，採用 GPU 化的蒙地卡羅劑量引擎（如 RayStation MC、Eclipse AcurosPT）與穩健最佳化。服務數量少但資本密集的質子治療中心；其驗機與重新計畫的運算量遠高於光子 TPS，帶動 GPU 加 HPC-CPU 叢集需求。", "role": ["regulated-software-as-a-medical-device", "workflow", "system-of-record"], "data_modality": ["images", "simulation"], "hardware_profile": ["gpu-server", "high-performance-computing-cpu"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["academic-medical-center", "hospital-health-system"], "vendors": ["RaySearch RayStation (dominant in proton planning)", "Varian Eclipse for Proton Therapy (Siemens Healthineers)"], "confidence": "B", "source": "RaySearch proton-therapy-treatment-planning pages (MC dose engine on GPU); Siemens Healthineers 'Eclipse for Proton Therapy'; IOPscience/PMC studies on commercial proton MC TPS commissioning (AcurosPT vs RayStation MC).", "_deep": 4}, {"id": "radiation-oncology-ai-auto-contouring", "parent": "radiation-oncology-tps-ois", "name_en": "AI Auto-Contouring / OAR & Target Auto-Segmentation", "name_zh": "AI 自動勾畫／危及器官與標靶自動分割", "name_full": "Deep-Learning Auto-Segmentation for Radiotherapy Planning", "scope_en": "A hot pure-play sub-market of deep-learning auto-segmentation that contours organs-at-risk and targets on planning CT/MR, feeding the TPS. Distinct vendor cohort separate from the incumbent TPS makers, tracked as its own KLAS/analyst category. Pulls GPU inference at the cancer center (Limbus/MIM run on the customer's local workstation/server) plus vendor-side GPU training; some vendors also offer cloud SaaS (a secondary operator co-sell path).", "scope_zh": "以深度學習自動分割為核心的熱門純玩家利基：在計畫用 CT／MR 上勾畫危及器官與標靶並回饋 TPS。其廠商群獨立於既有 TPS 大廠，並被視為獨立的 KLAS／分析師類別。帶動癌症中心端的 GPU 推論（Limbus／MIM 於客戶本地工作站／伺服器執行）與廠商端 GPU 訓練；部分廠商另提供雲端 SaaS（次要的 operator 共同銷售路徑）。", "role": ["analytics-artificial-intelligence", "regulated-software-as-a-medical-device", "workflow"], "data_modality": ["images", "artificial-intelligence-models"], "hardware_profile": ["gpu-server"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Limbus AI (Radformation)", "MIM Contour ProtegeAI (GE HealthCare)", "MVision AI", "Therapanacea ART-Plan", "Mirada DLCExpert"], "confidence": "B", "source": "Springer PESM multi-vendor auto-segmentation analysis (2024); RT-review 'Best AI Auto-Contouring' roundups; BusinessWire Radformation-Limbus acquisition (2024); MIM/GE HealthCare product pages.", "_deep": 2}, {"id": "radiation-oncology-ois-record-verify", "parent": "radiation-oncology-tps-ois", "name_en": "Oncology Information System / Record-and-Verify (oncology EMR)", "name_zh": "腫瘤資訊系統／紀錄核對（腫瘤 EMR）", "name_full": "Oncology Information System and Record-and-Verify Electronic Medical Record", "scope_en": "The transactional system-of-record that manages the whole treatment course - scheduling, charge capture, record-and-verify of delivery, and oncology-specific EMR. Explicitly ZERO-GPU: the hardware pull is HA database nodes plus immutable DR/backup, routing to Play D (clinical core resilience & ransomware DR). Distinct oncology-IT / health-system buyer, increasingly contested by general EHR vendors' oncology modules.", "scope_zh": "管理整個療程的交易型記錄系統——排程、費用擷取、治療的 record-and-verify 與腫瘤專用 EMR。明確零 GPU：其硬體需求為高可用資料庫節點加不可竄改的 DR／備援，對應 Play D（臨床核心韌性與勒索軟體 DR）。買方為獨立的腫瘤 IT／醫療體系，且日益受通用 EHR 廠商的腫瘤模組競爭。", "role": ["system-of-record", "workflow", "integration"], "data_modality": ["transactional", "documents"], "hardware_profile": ["high-availability-redundant", "disaster-recovery-backup"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Varian ARIA (Siemens Healthineers)", "Elekta MOSAIQ", "RaySearch RayCare", "Epic Beacon", "MEDITECH Expanse Oncology"], "confidence": "B", "source": "Signify Research onco-IT insight; ITN Online 'Oncology Information Systems Need to Integrate'; Elekta MOSAIQ-Epic integration page; Siemens Healthineers ARIA OIS page; RaySearch RayCare product page.", "_deep": 2}, {"id": "advanced-visualization-3d-enterprise-thin-client", "parent": "advanced-visualization-3d", "name_en": "Enterprise Thin-Client / Server-Side Advanced Visualization", "name_zh": "企業級精簡型/伺服器端進階影像處理平台", "name_full": "Enterprise Thin-Client / Server-Side Advanced Visualization (centralized 3D rendering AVW)", "scope_en": "Vendor-neutral advanced-visualization platforms that centralize 3D/MPR/MIP/volume-rendering and clinical post-processing (colonography, lung, vessel analysis, calcium scoring) on shared render servers and stream fully rendered images to zero-footprint thin clients across the health system. This is the de-facto enterprise standard and the largest GPU pull in the category — the render tier lives on the customer's own iron.", "scope_zh": "廠商中立的進階視覺化平台，將3D/MPR/MIP/體積渲染與臨床後處理（虛擬大腸鏡、肺結節、血管分析、鈣化評分）集中於共用渲染伺服器，並把完整渲染影像串流至全院零安裝精簡客戶端。此為企業級事實標準，也是本類別最大的GPU拉動——渲染層部署於客戶自有硬體。", "role": ["workflow", "analytics-artificial-intelligence", "infrastructure-platform"], "data_modality": ["images"], "hardware_profile": ["gpu-server", "nvme-performance-storage", "high-availability-redundant"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["TeraRecon (iNtuition)", "Canon Medical / Vital Images (Vitrea Enterprise)", "Visage Imaging (Visage 7)", "Siemens Healthineers (syngo.via)", "Philips (IntelliSpace Portal)", "GE HealthCare (AW Server)", "Fovia (F.A.S.T.)", "Ziosoft/Qi Imaging"], "confidence": "B", "source": "Verified: TeraRecon iNtuition confirmed as true thin-client server-side advanced visualization streaming to zero-footprint clients (diagnosticimaging.com, terarecon.com/about). Also ITN 'Enterprise Advanced Visualization Goes Mainstream'; Canon Vitrea product page; MarketsandMarkets Advanced Visualization Market report.", "_deep": 2}, {"id": "advanced-visualization-3d-cardiovascular-ctffr", "parent": "advanced-visualization-3d", "name_en": "Cardiovascular Advanced Visualization & CT-FFR / Plaque Analysis", "name_zh": "心血管進階視覺化與CT-FFR/斑塊分析", "name_full": "Cardiovascular Advanced Visualization, CT-derived FFR & Coronary Plaque Quantification", "scope_en": "Specialized cardiac/vascular post-processing distinct from the radiology enterprise: coronary CTA analysis, chamber quantification, cardiac MR, and physics-based CT-FFR (computational fluid dynamics on patient-specific coronary models) plus AI plaque quantification. Distinct cardiology buyer; carries a compute signature (CFD simulation + AI inference) beyond plain rendering. On-prem packages (incl. on-premise AI plaque) are SMCI-direct; the FFR-CT/plaque SaaS players (HeartFlow, Cleerly) run their own dedicated cloud compute (operator), not customer iron — the SMCI-addressable iron here is the on-prem cvi42/Medis/Pie tier, so primary_buyer stays customer.", "scope_zh": "有別於放射科企業平台的專科心血管後處理：冠狀動脈CTA分析、心腔量化、心臟MR，以及基於物理的CT-FFR（在病患專屬冠脈模型上做計算流體力學）與AI斑塊量化。買方為心臟科；具備超越單純渲染的運算特徵（CFD模擬＋AI推論）。地端套件（含地端AI斑塊）屬SMCI直銷；FFR-CT/斑塊SaaS業者（HeartFlow、Cleerly）自營專用雲端運算（operator），非客戶自有硬體——本子市場SMCI可尋址硬體為地端cvi42/Medis/Pie層，故primary_buyer維持customer。", "role": ["analytics-artificial-intelligence", "regulated-software-as-a-medical-device", "workflow"], "data_modality": ["images", "simulation", "artificial-intelligence-models"], "hardware_profile": ["gpu-server", "high-performance-computing-cpu"], "hardware_opportunity": 3, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Circle Cardiovascular Imaging (cvi42 / cvi42 Plaque on-prem)", "Medis Medical Imaging (QAngio/QFR)", "Pie Medical Imaging (CAAS)", "HeartFlow (FFR-CT — operator/cloud)", "Cleerly (plaque — operator/cloud)", "Elucid (PlaqueIQ)", "Siemens Healthineers (Cardiac syngo)"], "confidence": "B", "source": "Verified: cvi42 confirmed for cardiac MR/CT with FDA-cleared ON-PREMISE AI plaque quantification (circlecvi.com, globenewswire 2026-03-18); Medis QAngio confirmed for quantitative coronary angiography. HeartFlow/Cleerly = operator cloud model. Also DAIC advanced-visualization market coverage (dicardiology.com).", "_deep": 6}, {"id": "advanced-visualization-3d-surgical-planning-3d-printing", "parent": "advanced-visualization-3d", "name_en": "Surgical Planning & Point-of-Care 3D Anatomical Modeling / 3D Printing", "name_zh": "手術規劃與照護現場3D解剖建模/3D列印", "name_full": "Virtual Surgical Planning, Patient-Specific Anatomical Modeling & Point-of-Care 3D Printing", "scope_en": "Segmentation-to-STL engineering software that converts CT/MR into patient-specific 3D anatomical models, surgical guides, and implant designs for point-of-care 3D-printing labs (orthopaedics, CMF, cardiac, complex reconstruction). Distinct surgeon / hospital 3D-lab buyer, distinct from the reading-room AVW; hardware signature is GPU segmentation/design workstations plus capacity archive for large mesh/model files, not an enterprise render tier. Lower but real SMCI pull; workstation-scale.", "scope_zh": "分割轉STL的工程軟體，將CT/MR轉為病患專屬3D解剖模型、手術導板與植入物設計，供照護現場3D列印實驗室使用（骨科、顱顎面、心臟、複雜重建）。買方為外科醫師/院內3D實驗室，有別於閱片室AVW；硬體特徵為GPU分割/設計工作站加大型網格/模型檔的容量歸檔，而非企業渲染層。SMCI拉動較低但真實，屬工作站規模。", "role": ["workflow", "regulated-software-as-a-medical-device", "analytics-artificial-intelligence"], "data_modality": ["images", "simulation"], "hardware_profile": ["gpu-server", "capacity-archive-storage"], "hardware_opportunity": 2, "primary_buyer": "customer", "segments": ["hospital-health-system", "academic-medical-center", "medical-technology-in-vitro-diagnostics"], "vendors": ["Materialise (Mimics / Mimics Medical / Mimics inPrint)", "3D Systems (D2P)", "Synopsys (Simpleware)", "Axial3D", "Ricoh 3D for Healthcare"], "confidence": "B", "source": "Verified: Materialise Mimics confirmed for hospital 3D-labs / point-of-care 3D printing, segmentation-to-model workflow (materialise.com/en/healthcare/hcps/point-of-care-3d-printing, Mimics inPrint page); PMC10080800 review on POC 3D-printing software regulation.", "_deep": 3}, {"id": "him-coding-autonomous-cac", "parent": "him-coding", "name_en": "Autonomous & Computer-Assisted Coding (AI Coding)", "name_zh": "自主與電腦輔助疾病分類編碼（AI 編碼）", "name_full": "Autonomous and Computer-Assisted Medical Coding (AI Coding Engines)", "scope_en": "NLP/LLM engines that read clinical documentation and assign or suggest ICD/CPT/HCPCS codes — spanning computer-assisted coding (coder-in-the-loop) through fully autonomous coding (direct code assignment, human review only on edge cases). GPU-intensive inference over high document volume; overwhelmingly delivered as ISV-hosted single-tenant SaaS, making this an operator co-sell rather than a customer-owned-iron deal.", "scope_zh": "以 NLP/LLM 讀取病歷文件並指派或建議 ICD/CPT/HCPCS 代碼，涵蓋電腦輔助編碼（人工複核）到全自主編碼（直接指派、僅複雜案例轉人工）。針對大量文件的推論運算吃 GPU；絕大多數以 ISV 託管之單租戶 SaaS 交付，屬 operator 共售而非客戶自購機房。", "role": ["analytics-artificial-intelligence", "workflow"], "data_modality": ["documents", "artificial-intelligence-models", "transactional"], "hardware_profile": ["gpu-server"], "hardware_opportunity": 3, "primary_buyer": "operator", "segments": ["hospital-health-system", "academic-medical-center", "diagnostic-reference-laboratory"], "vendors": ["fathom", "codametrix", "nym-health", "solventum", "optum", "dolbey", "maverick-medical-ai", "akasa"], "confidence": "B", "source": "KLAS Research 'From Hype to Reality: Autonomous Coding' (CodaMetrix/Fathom/Nym); Maverick Medical AI RadNet/Infinx/ImagineSoftware partnerships (radiologybusiness.com, businesswire); Solventum 360 Encompass CAC + Optum Enterprise CAC vendor pages; CB Insights Automated & Assisted Coding ESP", "_deep": 4}, {"id": "him-coding-cdi", "parent": "him-coding", "name_en": "Clinical Documentation Integrity (CDI)", "name_zh": "臨床文件完整性（CDI）", "name_full": "Clinical Documentation Integrity / Improvement Software", "scope_en": "AI-assisted worklist software that detects documentation gaps and prioritizes charts so CDI specialists can query physicians — improving code capture, case-mix index and quality metrics. A distinct HIM specialty with its own buyers (CDI/quality leaders, not coders) and pure-play vendors. Predictive/NLP models, mostly ISV-hosted; modest GPU pull.", "scope_zh": "以 AI 偵測病歷文件缺口並為病歷排序，供 CDI 專員向醫師發出查詢，提升代碼擷取、病例組合指數與品質指標。屬 HIM 中具獨立買方（CDI／品質主管而非編碼師）與純營廠商的專科。以 NLP／預測模型為主，多由 ISV 託管；GPU 帶動中等。", "role": ["analytics-artificial-intelligence", "workfl tech.com — Always-Aware ambient sensors, SmartHospital command center); Ouva NVIDIA Clara Guardian edge confirmed (nvidia.com/clara/smart-hospitals, marktechpost.com, ouva.co/blog); Artisight NVIDIA GPU-powered in-room devices (artisight.com/patient-room, fiercehealthcare.com); AvaSure fall/elopement AI. Strongest on-prem GPU anchor in the parent.", "_deep": 5}, {"id": "smart-room-ambient-ai-virtual-nursing-telesitting", "parent": "smart-room-ambient-ai", "name_en": "Virtual Nursing & Tele-Sitting Platform", "name_zh": "虛擬護理與遠距陪護平台", "name_full": "Inpatient Virtual Nursing, Tele-Sitting & Virtual Care Command-Center Platform (human-in-the-loop two-way video)", "scope_en": "Human-in-the-loop two-way audio/video platforms letting a remote observer or virtual nurse cover many rooms for admission/discharge support, documentation and 1-observer-to-many patient safety sitting, coordinated from a virtual command center. Hardware pull is video routing/media servers plus recorded-session archive and HA for the command center; in-room endpoints are OEM carts. Distinct from autonomous CV monitoring though vendor lines overlap. NOTE: Teladoc and Amwell are cloud-heavy (thin operator on-prem pull); the on-prem operator co-sell concentrates in AvaSure and Caregility.", "scope_zh": "人為介入的雙向音視訊平台，讓遠端觀察員或虛擬護理師跨多房支援入院／出院、文件記錄與一對多安全陪護，由虛擬指揮中心協調。硬體需求為視訊路由／媒體伺服器加錄影歸檔與指揮中心的高可用性；房內端點為 OEM 推車。與自主 CV 監測不同但廠商線重疊。Teladoc／Amwell 偏雲端，院內拉動集中於 AvaSure 與 Caregility。", "role": ["workflow", "data-acquisition"], "data_modality": ["images", "time-series"], "hardware_profile": ["capacity-archive-storage", "high-availability-redundant"], "hardware_opportunity": 2, "primary_buyer": "operator", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["Caregility", "AvaSure", "Andor Health", "Teladoc Health", "Amwell"], "confidence": "B", "source": "avasure.com/telesitter & /platform (1 observer to 16 patients, Guardian video carts); Caregility virtual care platform; Andor Health ThinkAndor; signifyresearch.net virtual sitter/nursing segmentation; CB Insights intra-hospital virtual nursing ESP. All vendors web-confirmed real; Teladoc/Amwell flagged cloud-heavy so operator on-prem pull is modest (opp 2).", "_deep": 2}, {"id": "smart-room-ambient-ai-edge-sensor-appliance-oem", "parent": "smart-room-ambient-ai", "name_en": "Embedded Smart-Room Edge Sensor Appliance (OEM)", "name_zh": "嵌入式智慧病房邊緣感測裝置（OEM）", "name_full": "Embedded Per-Room Edge Sensor Appliance — LiDAR / radar / optical, on-device inference (per-unit OEM BOM)", "scope_en": "Purpose-built per-room edge appliances (LiDAR, mmWave radar or optical) that run fall / bed-exit / vitals inference entirely on-device and emit only structured alerts, never raw video. The compute is embedded in a small-form edge module (e.g. NVIDIA Jetson) shipped as part of the sensor. CAVEAT (SMCI angle is speculative, confidence lowered to C): the embedded module for a wall-mounted LiDAR/radar sensor is typically a Jetson/custom-radar board sourced from NVIDIA or embedded specialists, NOT Supermicro's usual x86 edge-server/IoT box class — a real device category but a thin, unproven OEM design-win for SMCI. Kept as a genuinely distinct hardware_buyer model (embedded on-device vs #1's rack-server operator), not as installed base.", "scope_zh": "專用單房邊緣裝置（LiDAR、毫米波雷達或光學），完全在裝置端執行跌倒／離床／生命徵象推論，僅送出結構化警示、不傳原始影像。運算嵌於小型邊緣模組（如 NVIDIA Jetson）隨感測器出貨。注意（SMCI 角度為推測，信心下修至 C）：此類壁掛感測器的嵌入模組多為 Jetson／自訂雷達板，來自 NVIDIA 或嵌入式專業廠，非 Supermicro 慣常的 x86 邊緣伺服器／IoT 機型——是真實裝置類別但對 SMCI 為未經證實的 OEM 設計導入。保留是因其 hardware_buyer 模式（裝置端內嵌）確與 #1（機架伺服器營運）不同。", "role": ["data-acquisition", "analytics-artificial-intelligence"], "data_modality": ["time-series", "images", "artificial-intelligence-models"], "hardware_profile": ["edge-industrial"], "hardware_opportunity": 2, "primary_buyer": "original-equipment-manufacturer", "segments": ["hospital-health-system", "academic-medical-center"], "vendors": ["VirtuSense", "Nesa Solutions", "Xandar Kardian"], "confidence": "C", "source": "virtusense.ai (VSTOne single LiDAR edge sensor, on-device processing, no video stored); nesasolutions.com + prnewswire.com (NVIDIA Jetson edge, on-device inference, writes to Epic flowsheets, Epic Toolbox 2026 — WEB-VERIFIED); Xandar Kardian radar sensor. DROPPED vendor Cherish Health (radar RPM but home/senior-living/assisted-living per about.att.com & cherishhealth.com, not hospital inpatient smart-room — wrong segment).", "_deep": 2}, {"id": "comp-chem-simulation-molecular-dynamics-fep", "parent": "comp-chem-simulation", "name_en": "Molecular Dynamics & Free-Energy Simulation (MD / FEP)", "name_zh": "分子动力学与自由能模拟 (MD / FEP)", "name_full": "Physics-based classical molecular dynamics and alchemical free-energy perturbation (binding-affinity) simulation", "scope_en": "Long-timestep classical MD and alchemical free-energy (FEP/TI) calculations for protein-ligand binding affinity, conformational dynamics, and lead optimization. The single most GPU-bound sub-market in comp-chem: modern MD/FEP engines are optimized for flagship data-center GPUs (H100/GB200-class), with FEP+ campaigns running thousands of coupled lambda-window simulations on GPU fleets.", "scope_zh": "长时间步经典分子动力学与炼金术自由能 (FEP/TI) 计算，用于蛋白-配体结合亲和力、构象动力学与先导优化。是计算化学中对 GPU 依赖最强的子市场：现代 MD/FEP 引擎针对旗舰级数据中心 GPU (H100/GB200 级) 优化，FEP+ 计算需在 GPU 集群上运行数千个耦合 lambda 窗口模拟。", "role": ["analytics-artificial-intelligence", "infrastructure-platform"], "data_modality": ["simulation", "time-series"], "hardware_profile": ["gpu-server", "nvme-performance-storage", "high-performance-computing-cpu"], "hardware_opportunity": 4, "primary_buyer": "customer", "segments": ["biotechnology-pharmaceutical", "academic-medical-center", "contract-research-organization"], "vendors": ["Schrodinger (Desmond / FEP+)", "D. E. Shaw Research (Anton / DESMOND)", "OpenMM", "GROMACS", "AMBER", "NAMD", "Cresset (Flare FEP)", "OpenFE"], "confidence": "A", "source": "IntuitionLabs molecular simulation overview; Schrodinger FEP+/Desmond product docs; Amber 2024 GPU review (PMC12344759); OpenMM/GROMACS GPU benchmarks (arXiv 1507.00898)", "_deep": 3}, {"id": "comp-chem-simulation-docking-virtual-screening", "parent": "comp-chem-simulation", "name_en": "Structure-Based Virtual Screening & Molecular Docking", "name_zh": "基于结构的虚拟筛选与分子对接", "name_full": "High-throughput molecular docking and ultra-large-library (giga-scale) structure-based virtual screening", "scope_en": "Embarrassingly-parallel docking and pose scoring against billion-compound enumerated libraries (Enamine REAL, ZINC), increasingly ML-boosted. Distinct from MD/FEP: pulls GPU+CPU throughput fleets PLUS large NVMe/capacity storage to stage and stream multi-billion-molecule libraries (e.g. 1.6B compounds docked on 26,000 GPUs in <1 day; VirtualFlow 1.3B on 8,000 CPU cores).", "scope_zh": "针对数十亿化合物枚举库 (Enamine REAL、ZINC) 的高度并行对接与打分，日益结合机器学习加速。与 MD/FEP 不同：需要 GPU+CPU 吞吐集群外加大容量 NVMe/归档存储来暂存与流式处理数十亿分子库 (例如 26,000 张 GPU 一天内对接 16 亿化合物；VirtualFlow 用 8,000 CPU 核筛 13 亿)。", "role": ["analytics-artificial-intelligence", "workflow"], "data_modality": ["simulation", "artificial-intelligence-models"], "hardware_profile": ["gpu-server", "high-performance-computing-cpu", "nvme-performance-storage", "capacity-archive-storage"], "hardware_opportunity": 4, "primary_buyer": "customer", "segments": ["biotechnology-pharmaceutical", "contract-research-organization", "academic-medical-center"], "vendors": ["Schrodinger (Glide)", "Cadence Molecular Sciences / OpenEye (FRED, OEDocking, ROCS X)", "Chemical Computing Group (MOE)", "BIOVIA / Dassault Systemes (Discovery Studio)", "AutoDock-GPU", "DP Technology (Uni-Dock)", "VirtualFlow"], "confidence": "A", "source": "Uni-Dock (ACS JCTC 2c01145; ChemRxiv); VirtualFlow / AutoDock-GPU ultra-large screening (PMC10523430); Schrodinger virtual screening white paper; Cadence/OpenEye ROCS X launch 2025-09-25 (cadence.com newsroom)", "_deep": 4}, {"id": "comp-chem-simulation-quantum-electronic-structure", "parent": "comp-
